function exImgDir(id){
  const ex=(typeof id==="object")?id:ALL_EX_LOOKUP[id];
  return ex&&ex.img?ex.img:null;
}
function gifUrl(id){
  const dir=exImgDir(id);
  if(!dir)return "";
  return `https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/${dir}/0.jpg`;
}
function gifUrlAlt(id){
  const dir=exImgDir(id);
  if(!dir)return "";
  return `https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/${dir}/1.jpg`;
}

const PLAN_LIMITS={
  free:{aiWorkoutsPerWeek:3,aiFoodPerDay:5,coachPerDay:5},
  premium:{aiWorkoutsPerWeek:Infinity,aiFoodPerDay:Infinity,coachPerDay:Infinity},
};
function isPremium(){return (S.profile?.plan)==="premium";}
function planLimit(key){return PLAN_LIMITS[isPremium()?"premium":"free"][key];}
function weekKey(){const d=new Date();const onejan=new Date(d.getFullYear(),0,1);const wk=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);return d.getFullYear()+"-W"+wk;}
function dayKey(){return new Date().toISOString().split("T")[0];}
// Returns how many uses remain for a feature; Infinity if premium
function usesLeft(feature){
  if(isPremium())return Infinity;
  const u=S.usage||{};
  if(feature==="aiWorkout"){const used=(u.aiWorkout&&u.aiWorkout.k===weekKey())?u.aiWorkout.n:0;return Math.max(0,planLimit("aiWorkoutsPerWeek")-used);}
  if(feature==="aiFood"){const used=(u.aiFood&&u.aiFood.k===dayKey())?u.aiFood.n:0;return Math.max(0,planLimit("aiFoodPerDay")-used);}
  if(feature==="coach"){const used=(u.coach&&u.coach.k===dayKey())?u.coach.n:0;return Math.max(0,planLimit("coachPerDay")-used);}
  return Infinity;
}
function consumeUse(feature){
  if(isPremium())return true;
  if(!S.usage)S.usage={};
  const k=feature==="aiWorkout"?weekKey():dayKey();
  const cur=S.usage[feature];
  if(!cur||cur.k!==k)S.usage[feature]={k,n:0};
  S.usage[feature].n++;
  saveUsage(S.usage);
  return true;
}

async function searchUsers(term){
  const t=(term||"").trim().toLowerCase();
  const snap=await getDocs(collection(db,"userIndex"));
  const all=snap.docs.map(d=>d.data()).filter(u=>u.email!==OWNER_EMAIL);

  return all.filter(u=>(u.email||"").toLowerCase().includes(t)||(u.username||"").toLowerCase().includes(t)||(u.name||"").toLowerCase().includes(t)).slice(0,40);

// FX — SONS + HAPTICS (feedback Premium)
// ═══════════════════════════════════════════
const FX={
  audioCtx:null,
  // Garantia: contexto só pode ser criado em resposta a interação do usuário (regra do navegador)
  _ensureCtx(){
    if(this.audioCtx)return this.audioCtx;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC)this.audioCtx=new AC();
    }catch(e){}
    return this.audioCtx;
  },
  _soundOn(){return S.profile?.sound!==false;}, // padrão: ligado
  _hapticOn(){return S.profile?.haptic!==false;}, // padrão: ligado
  // Toca um tom curto com envelope (fade out) — suave, sem clipping
  _tone(freq,dur=80,type="sine",vol=0.12,delay=0){
    if(!this._soundOn())return;
    const ctx=this._ensureCtx();if(!ctx||ctx.state==="closed")return;
    try{
      if(ctx.state==="suspended")ctx.resume();
      const now=ctx.currentTime+delay/1000;
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=type;osc.frequency.value=freq;
      gain.gain.setValueAtTime(0,now);
      gain.gain.linearRampToValueAtTime(vol,now+0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+dur/1000);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);osc.stop(now+dur/1000+0.02);
    }catch(e){}
  },
  _vibe(pattern){
    if(!this._hapticOn())return;
    try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){}
  },
  // ─── Feedbacks específicos ───
  // Tap genérico (botão simples)
  tap(){this._tone(440,40,"sine",0.06);this._vibe(8);},
  // Tap em ação positiva
  tapSoft(){this._tone(660,50,"sine",0.07);this._vibe(6);},
  // Botão importante (confirmar)
  tapStrong(){this._tone(523,70,"triangle",0.10);this._vibe(15);},
  // Adicionar água — som de gota d'água (duas frequências rápidas)
  waterDrop(){
    if(this._soundOn()){this._tone(800,30,"sine",0.08);this._tone(1100,40,"sine",0.07,40);}
    this._vibe(10);
  },
  // Adicionar comida — bip curto
  food(){this._tone(660,60,"triangle",0.08);this._vibe(8);},
  // Sucesso pequeno (atingiu meta de água, por exemplo)
  success(){
    if(this._soundOn()){this._tone(523,80,"sine",0.10);this._tone(659,80,"sine",0.10,60);this._tone(784,120,"sine",0.12,120);}
    this._vibe([20,40,30]);
  },
  // Conquista grande (meta de calorias)
  achievement(){
    if(this._soundOn()){this._tone(523,100,"triangle",0.11);this._tone(659,100,"triangle",0.11,80);this._tone(784,100,"triangle",0.11,160);this._tone(1047,200,"triangle",0.13,240);}
    this._vibe([30,30,30,30,80]);
  },
  // Treino completo
  workoutDone(){
    if(this._soundOn()){this._tone(392,120,"triangle",0.10);this._tone(523,120,"triangle",0.11,100);this._tone(659,200,"triangle",0.12,200);}
    this._vibe([40,60,40,60,100]);
  },
  // Desfazer / remover
  undo(){this._tone(330,60,"sine",0.06);this._vibe([5,30,5]);},
  // Erro / aviso
  warn(){this._tone(220,150,"square",0.08);this._vibe([20,60,20]);},
  // Abrir modal / panel
  open(){this._tone(587,40,"sine",0.05);},
  // Fechar modal
  close(){this._tone(440,40,"sine",0.04);},
};

function computeTMB(){
  const p=S.profile||S.onboard?.data;if(!p)return;
  const w=parseFloat(p.weight),h=parseFloat(p.height),a=parseFloat(p.age);if(!w||!h||!a)return;
  const bmr=p.sex==="M"?10*w+6.25*h-5*a+5:p.sex==="F"?10*w+6.25*h-5*a-161:10*w+6.25*h-5*a-78;
  const acts={sed:1.2,light:1.375,mod:1.55,active:1.725,very:1.9};
  const tdee=bmr*(acts[p.activity]||1.55);
  S.tmb=Math.round(bmr);
  S.targetCal=p.goal==="lose"?Math.round(tdee-400):p.goal==="gain"?Math.round(tdee+350):Math.round(tdee);
  if(S.profile){S.profile.tmb=S.tmb;S.profile.targetCal=S.targetCal;}
}

let _toastTimer=null;
function toast(msg,type="info"){
  let host=document.getElementById("toastHost");
  if(!host){host=document.createElement("div");host.id="toastHost";document.body.appendChild(host);}
  host.innerHTML="";
  const ic=type==="success"?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
    :type==="error"?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12.01" y2="16.5"/></svg>`
    :`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="7.5" x2="12.01" y2="7.5"/></svg>`;
  const el=document.createElement("div");
  el.className=`toast toast-${type}`;

  el.querySelector(".toast-msg").textContent=String(msg).replace(/^[✅❌⚠️ℹ️]+\s*/,"");
  host.appendChild(el);
  try{if(type==="error")FX.tapStrong();else FX.tapSoft();}catch(e){}
  clearTimeout(_toastTimer);

}
let _scrollMemo=null;let _renderedAppKey="";let _renderedModalKey="";
function _appKey(){return `${S.phase}|${S.tab}|${S.session?"sess":""}`;}
function _elPath(el,root){const p=[];while(el&&el!==root){const par=el.parentElement;if(!par)return null;p.unshift(Array.prototype.indexOf.call(par.children,el));el=par;}return p;}
function _elByPath(path,root){let el=root;for(const i of path){el=el&&el.children[i];if(!el)return null;}return el;}
function _captureScroll(){
  const items=[];
  ["app","modalRoot"].forEach(rid=>{
    const root=document.getElementById(rid);if(!root)return;
    root.querySelectorAll("*").forEach(el=>{
      if(el.scrollTop>0){const path=_elPath(el,root);if(path)items.push({rid,path,top:el.scrollTop});}
    });
  });
  _scrollMemo={appKey:_renderedAppKey,modalKey:_renderedModalKey,items};
}
function _restoreScroll(){
  const sameView=_renderedAppKey===_appKey();
  const appEl=document.getElementById("app");
  if(appEl)appEl.classList.toggle("no-entry",sameView);
  _renderedAppKey=_appKey();_renderedModalKey=S.modal||"";
  if(!_scrollMemo)return;
  const okApp=_scrollMemo.appKey===_renderedAppKey;
  const okModal=_scrollMemo.modalKey===_renderedModalKey;
  const apply=()=>{_scrollMemo&&_scrollMemo.items.forEach(it=>{
    if(it.rid==="app"&&!okApp)return;
    if(it.rid==="modalRoot"&&!okModal)return;
    const root=document.getElementById(it.rid);const el=root&&_elByPath(it.path,root);if(el)el.scrollTop=it.top;
  });};
  apply();requestAnimationFrame(apply);
}
function r(){
  _captureScroll();
  document.getElementById("app").innerHTML="";
  document.getElementById("modalRoot").innerHTML="";
  if(S.phase==="splash")document.getElementById("app").appendChild(rSplash());
  else if(S.phase==="login")document.getElementById("app").appendChild(rLogin());
  else if(S.phase==="onboard")document.getElementById("app").appendChild(rOnboard());
  else{
    if(S.session){document.getElementById("app").appendChild(rSession());_restoreScroll();return;}
    document.getElementById("app").appendChild(rHome());
    const modals=["food","newWorkout","addExercises","assignWorkout","exDetail","addFoodManual","pickSessionExercises","treinos","aiWorkout","coach","autoDiet","reports","perfil","premium","monthCal","waterInfo","clearDay","support","tickets","perms","tmbInfo"];
    if(modals.includes(S.modal))document.getElementById("modalRoot").appendChild(rModal());
  }
  _restoreScroll();
}

function openFlexConfig(){
  // estado local: lista de semanas, cada uma com array de dias (0-6)
  if(!S.onboard.data.flexWeeks||!S.onboard.data.flexWeeks.length){
    S.onboard.data.flexWeeks=[{days:[]},{days:[]}]; // começa com 2 semanas
  }
  const dayShort=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const ov=document.createElement("div");
  ov.className="flex-ov";
  document.body.appendChild(ov);

  const render=()=>{
    const weeks=S.onboard.data.flexWeeks;
    ov.innerHTML=`<div class="flex-sheet">
      <div class="flex-hdr">
        <div>
          <div class="flex-title">🔀 Rotina flexível</div>
          <div class="flex-sub">Monte a frequência de cada semana</div>
        </div>
        <button class="close-x" id="flexX">✕</button>
      </div>
      <div class="flex-intro">Selecione os dias de treino de cada semana. Você pode adicionar ou remover semanas, e usar "repetir" para clonar o padrão.</div>
      <div class="flex-weeks">
        ${weeks.map((wk,wi)=>`
          <div class="flex-week">
            <div class="flex-week-top">
              <span class="flex-week-nm">Semana ${wi+1}</span>
              <span class="flex-week-cnt">${wk.days.length}x</span>
              ${weeks.length>1?`<button class="flex-week-del" data-delweek="${wi}" aria-label="Remover semana">🗑️</button>`:""}
            </div>
            <div class="flex-week-days">
              ${dayShort.map((dn,di)=>`<button class="flex-day ${wk.days.includes(di)?"flex-day-on":""}" data-wk="${wi}" data-d="${di}">${dn}</button>`).join("")}
            </div>
          </div>
        `).join("")}
      </div>
      <div class="flex-actions">
        <button class="flex-add" id="flexAdd">＋ Adicionar semana</button>
        <button class="flex-repeat" id="flexRepeat">🔁 Repetir frequência</button>
      </div>
      <div class="flex-foot">
        <button class="flex-skip" id="flexSkip">Pular etapa</button>
        <button class="flex-save" id="flexSave">Salvar rotina</button>
      </div>
    </div>`;

    // dias
    ov.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{
      const wi=parseInt(b.dataset.wk),di=parseInt(b.dataset.d);
      const days=S.onboard.data.flexWeeks[wi].days;
      const idx=days.indexOf(di);
      if(idx>=0)days.splice(idx,1);else days.push(di);
      days.sort((a,b)=>a-b);
      render();
    });
    // remover semana
    ov.querySelectorAll("[data-delweek]").forEach(b=>b.onclick=()=>{
      const wi=parseInt(b.dataset.delweek);
      S.onboard.data.flexWeeks.splice(wi,1);
      render();
    });
    // adicionar semana
    ov.querySelector("#flexAdd").onclick=()=>{
      if(S.onboard.data.flexWeeks.length>=52){toast("Máximo de 52 semanas (1 ano).");return;}
      S.onboard.data.flexWeeks.push({days:[]});
      render();
      // rolar até o fim
      const sheet=ov.querySelector(".flex-weeks");if(sheet)sheet.scrollTop=sheet.scrollHeight;
    };
    // repetir frequência: clona o padrão atual de semanas (dobra)
    ov.querySelector("#flexRepeat").onclick=()=>{
      const cur=S.onboard.data.flexWeeks;
      if(cur.length>=52){toast("Máximo de 52 semanas (1 ano).");return;}
      const pattern=cur.map(w=>({days:[...w.days]}));
      const room=52-cur.length;
      const toAdd=pattern.slice(0,room);
      S.onboard.data.flexWeeks=[...cur,...toAdd];
      toast(`Padrão de ${pattern.length} semana(s) repetido!`,"success");
      render();
    };
    // pular etapa: tudo descanso
    ov.querySelector("#flexSkip").onclick=()=>{
      S.onboard.data.flexRoutine=true;
      S.onboard.data.flexWeeks=null;
      S.onboard.data.flexSkipped=true;
      S.onboard.data.trainDays=[];
      ov.remove();
      toast("Etapa pulada — todos os dias ficarão como descanso. Você pode ajustar depois.");
      r();
    };
    // salvar
    ov.querySelector("#flexSave").onclick=()=>{
      const weeks=S.onboard.data.flexWeeks;
      if(weeks.every(w=>w.days.length===0)){toast("Selecione ao menos um dia de treino, ou use 'Pular etapa'.");return;}
      S.onboard.data.flexRoutine=true;
      S.onboard.data.flexSkipped=false;
      // a primeira semana define os trainDays "padrão" exibidos na agenda da semana atual
      S.onboard.data.trainDays=[...(weeks[0].days||[])];
      ov.remove();
      toast(`Rotina flexível de ${weeks.length} semana(s) salva!`,"success");
      r();
    };
    ov.querySelector("#flexX").onclick=()=>{
      // fechar sem ativar (se não havia nada antes)
      if(!S.onboard.data.flexSkipped&&(!S.onboard.data.trainDays||!S.onboard.data.trainDays.length)){
        S.onboard.data.flexRoutine=false;
      }
      ov.remove();r();
    };
  };
  render();
}

function autoSuggestSplit(){
  const d=S.onboard.data;
  const nDays=d.flexRoutine?0:(d.trainDays?d.trainDays.length:0);
  const level=d.activity; // proxy de condicionamento
  let split,reason;
  // Se rotina flexível ou poucos dias definidos, considerar nível/objetivo
  const days=nDays||3;
  if(days<=2){split="Full Body";reason="Com 1-2 dias por semana, treinar o corpo todo em cada sessão traz o melhor estímulo geral.";}
  else if(days===3){split="ABC";reason="Com 3 dias, a divisão ABC equilibra volume e recuperação muito bem.";}
  else if(days===4){split="ABCD";reason="Com 4 dias, a ABCD permite focar melhor cada grupo muscular.";}
  else if(days===5){split="ABCDE";reason="Com 5 dias, a ABCDE dá espaço para priorizar cada região com mais volume.";}
  else {split="ABCDEF";reason="Com 6 dias, a ABCDEF maximiza o volume por grupo, ideal para avançados.";}
  // Ajuste por objetivo: emagrecer com poucos dias favorece full body
  if(d.goal==="lose"&&days<=3){split="Full Body";reason="Para emagrecimento com até 3 dias, full body queima mais calorias por sessão.";}
  S.onboard.data.split=split;
  S.onboard.data.splitAuto=true;
  r();
  setTimeout(()=>toast("Sugestão: divisão "+split+". "+reason,"success"),50);
}

// ─── SISTEMA DE NÍVEIS (considera treino, dieta, água, descanso) ───
// Níveis 1-7: poucos pontos no início, crescendo gradativamente.
const LEVEL_THRESHOLDS=[0,30,90,200,400,750,1300,2200]; // XP acumulado para níveis 1..8
function computeProgress(){
  const hist=S.history||{};
  const days=Object.keys(hist);
  let trainedDays=0,dietDays=0,waterDays=0,restDays=0,totalWorkouts=0,volume=0;
  days.forEach(k=>{
    const h=hist[k]||{};
    if(h.trained){trainedDays++;totalWorkouts++;if(h.workout&&h.workout.volume)volume+=h.workout.volume;}
    else restDays++; // dia registrado sem treino conta como descanso
    if(h.cal>0)dietDays++;
    if(h.water>=(computeWaterGoal()*0.8))waterDays++;
  });
  // pontuação: treino vale mais, mas dieta/água/descanso também contam
  const xp=Math.round(trainedDays*40 + dietDays*15 + waterDays*10 + restDays*5 + (volume/1000));
  let level=1;
  for(let i=1;i<LEVEL_THRESHOLDS.length;i++){if(xp>=LEVEL_THRESHOLDS[i])level=i+1;}
  level=Math.min(level,7);
  const curBase=LEVEL_THRESHOLDS[level-1]||0;
  const nextBase=level<7?LEVEL_THRESHOLDS[level]:LEVEL_THRESHOLDS[7];
  const xpInLevel=xp-curBase;
  const xpNeeded=Math.max(1,nextBase-curBase);
  const xpPct=level>=7?100:Math.min(100,Math.round((xpInLevel/xpNeeded)*100));
  return {xp,level,xpInLevel,xpNeeded,xpPct,trainedDays,dietDays,waterDays,restDays,totalWorkouts,volume};
}

// Rótulo do intervalo da semana visualizada (offset 0 = semana atual).
function weekRangeLabel(offset){
  const now=new Date();
  const sun=new Date(now);sun.setDate(now.getDate()-now.getDay()+offset*7);
  const sat=new Date(sun);sat.setDate(sun.getDate()+6);
  const fmt=d=>`${d.getDate()}/${d.getMonth()+1}`;
  const yr=sat.getFullYear();
  if(offset===0)return `Esta semana · ${fmt(sun)} a ${fmt(sat)} · ${yr}`;
  if(offset===1)return `Próxima · ${fmt(sun)} a ${fmt(sat)} · ${yr}`;
  if(offset===-1)return `Anterior · ${fmt(sun)} a ${fmt(sat)} · ${yr}`;
  return `${fmt(sun)} a ${fmt(sat)} · ${yr}`;
}
// Verifica se um dia (índice 0-6 no offset) é anterior a hoje (já passou).
function isPastDay(i,offset){
  const d=dateForDay(i,offset);d.setHours(0,0,0,0);
  const t=new Date();t.setHours(0,0,0,0);
  return d.getTime()<t.getTime();
}
// Verifica se um dia é anterior ao cadastro do usuário (não deve ser acessível).
function isBeforeSignup(offset){
  const created=S.profile?.createdAt?new Date(S.profile.createdAt):null;
  if(!created)return false;
  created.setHours(0,0,0,0);
  // sábado (fim) da semana visualizada
  const now=new Date();const sat=new Date(now);sat.setDate(now.getDate()-now.getDay()+offset*7+6);sat.setHours(23,59,59,999);
  return sat.getTime()<created.getTime();
}
// Data de um dia da semana (índice 0-6) no offset visualizado.
function dateForDay(i,offset){
  const now=new Date();
  const d=new Date(now);d.setDate(now.getDate()-now.getDay()+offset*7+i);
  return d;
}

// Verifica se atribuir um treino ao dia `day` respeita o mínimo de 2 dias
// de descanso entre treinos (não pode ter treino nos 2 dias anteriores nem
// nos 2 seguintes — evita treinar grupos consecutivamente).
// Retorna {ok:true} ou {ok:false, conflictDay:N}.
// Verifica se alocar o treino `workoutId` no dia `day` respeita 2 dias de
// descanso da MESMA divisão. Ou seja: não pode haver o mesmo treino nos 2 dias
// anteriores nem nos 2 seguintes. Diferentes divisões em dias seguidos são OK.
function checkRestRule(day,workoutId,ignoreDay){
  const sched=S.schedule||{};
  if(!workoutId)return {ok:true};
  for(let delta=1;delta<=2;delta++){
    for(const dd of [(day-delta+7)%7,(day+delta)%7]){
      if(dd===ignoreDay)continue;
      if(sched[dd]&&sched[dd].id===workoutId)return {ok:false,conflictDay:dd};
    }
  }
  return {ok:true};
}
// Lista os dias (índices) em que um treino (por id) está alocado
function daysForWorkout(id){
  const sched=S.schedule||{};const out=[];
  for(let i=0;i<7;i++){if(sched[i]&&sched[i].id===id)out.push(i);}
  return out;
}

// Retorna os dias de treino (0-6) da semana visualizada, considerando rotina flexível.
function trainDaysForWeek(offset){
  const p=S.profile||{};

    const weeksSince=Math.round((now-cs)/(7*86400000));
    if(weeksSince<0)return [];
    const idx=weeksSince%p.flexWeeks.length;
    return p.flexWeeks[idx].days||[];
  }
  return p.trainDays||[];
}

    const w=S.workouts.find(x=>x.id===sched.id);
    const exs=w?(w.exercises||[]):[];
    const muscles=[...new Set(exs.map(e=>MUSCLE_META[e.group]?.label).filter(Boolean))];
    const totalSets=exs.reduce((a,e)=>a+(e.sets||3),0);
    const estMin=Math.max(15,Math.round(exs.length*7));
    const estKcal=Math.round(estMin*7);
    const accent=MUSCLE_META[exs[0]?.group]?.color||"#FF6B00";
    const trainedToday=(S.history||{})[new Date().toISOString().split("T")[0]]?.trained;
    return `<div class="ag2-hero ag2-in" data-herostart="${sched.id}" style="--accent:${accent};animation-delay:.06s">
      <div class="ag2-hero-glow"></div>
      <div class="ag2-hero-top">
        <span class="ag2-hero-tag">${trainedToday?"✓ CONCLUÍDO HOJE":"TREINO DE HOJE"}</span>
        <span class="ag2-hero-lt">${(sched.letter||"A").slice(0,2)}</span>
      </div>
      <div class="ag2-hero-nm">${sched.name}</div>
      <div class="ag2-hero-mus">${muscles.length?muscles.map(m=>m.charAt(0)+m.slice(1).toLowerCase()).join(" · "):"Toque para configurar"}</div>
      <div class="ag2-hero-meta">${exs.length} exercícios&nbsp;&nbsp;·&nbsp;&nbsp;${totalSets} séries&nbsp;&nbsp;·&nbsp;&nbsp;~${estMin} min&nbsp;&nbsp;·&nbsp;&nbsp;~${estKcal} kcal</div>
      <button class="ag2-hero-btn" data-herostart="${sched.id}">${icPlay}&nbsp; ${trainedToday?"Treinar de novo":"Iniciar treino"}</button>
    </div>`;
  })();
  d.innerHTML=`
  ${hero}
  <div class="ag2-week-bar ag2-in" style="animation-delay:.1s">
    <span class="ag2-sec ag2-week-left">SUA SEMANA</span>
    <button class="ag2-sec-link ag2-week-center" id="bWeekWorkouts">${icDb} Meus treinos</button>
    <div class="ag2-streak ag2-week-right" title="Sequência de treinos"><span class="ag2-streak-fire">🔥</span><span class="ag2-streak-n">${streak}</span><span class="ag2-streak-u">${streak===1?"dia":"dias"}</span></div>
  </div>
  <div class="ag2-weeknav ag2-in" style="animation-delay:.11s">
    <button class="ag2-weeknav-btn" id="bWeekPrev" aria-label="Semana anterior">‹</button>
    <div class="ag2-weeknav-mid">
      <div class="ag2-weeknav-label" id="weekLabel">${weekRangeLabel(S.weekOffset||0)}</div>
      ${(S.weekOffset||0)!==0?`<button class="ag2-weeknav-today" id="bWeekToday">↩ Hoje</button>`:""}
    </div>
    <button class="ag2-weeknav-btn" id="bWeekNext" aria-label="Próxima semana">›</button>
  </div>
  <div class="ag2-week ag2-in" style="animation-delay:.12s">
    ${WD.map((wd,i)=>{
      const wkOff=S.weekOffset||0;const isTrain=trainDays.includes(i);const isTd=(wkOff===0&&i===today());const sched=S.schedule[i];const dd=dateForDay(i,wkOff);
      const isPast=isPastDay(i,wkOff);
      // histórico imutável: o que foi de fato concluído neste dia (independe do schedule atual)
      const dKey=dd.toISOString().split("T")[0];
      const histDay=(S.history||{})[dKey];
      const doneWk=histDay&&histDay.trained&&histDay.workout;
      let body;
      if(doneWk){
        // dia com treino concluído (registrado no histórico) — mostra mesmo se a divisão foi excluída depois
        body=`<div class="ag2-wk ag2-wk-done">
          <span class="ag2-wk-lt ag2-wk-lt-done">${(doneWk.letter||doneWk.name||"✓")[0]}</span>
          <span class="ag2-wk-nm">${doneWk.name||"Treino"} <span class="ag2-wk-tag">✓ feito</span></span>
        </div>`;
      }
      else if(!isTrain)body=`<button class="ag2-rest ag2-rest-btn" data-toggleday="${i}"${isPast?" disabled":""}>Descanso${isPast?"":` <span class="ag2-rest-edit">＋ treino</span>`}</button>`;
      else if(sched)body=`<div class="ag2-wk">
          <span class="ag2-wk-lt">${(sched.letter||"A").slice(0,2)}</span>
          <span class="ag2-wk-nm">${sched.name}</span>
          ${isPast?"":`<button class="ag2-mini" data-ed="${i}" aria-label="Editar">${icPen}</button>`}
          ${isPast?"":`<button class="ag2-mini ag2-mini-play" data-play="${sched.id}" aria-label="Iniciar">${icPlay}</button>`}
        </div>`;
      else body=`<div class="ag2-day-empty">${isPast?`<span class="ag2-day-past-lbl">—</span>`:`<button class="ag2-assign" data-ass="${i}">+ Atribuir treino</button><button class="ag2-torest" data-toggleday="${i}" title="Marcar como descanso">😴</button>`}</div>`;
      return `<div class="ag2-day ${isTd?"ag2-day-td":""} ${!isTrain?"ag2-day-rest":""} ${isPast?"ag2-day-past":""}" id="dayc${i}">
        <div class="ag2-day-col"><span class="ag2-day-ab">${dayShort[i]}</span><span class="ag2-day-date">${dd.getDate()}</span>${isTd?`<span class="ag2-tdot"></span>`:""}</div>
        <div class="ag2-day-body">${body}</div>
      </div>`;
    }).join("")}
  </div>`;
  // Hero card start
  d.querySelectorAll("[data-herostart]").forEach(el=>el.onclick=e=>{e.stopPropagation();FX.tapStrong();const w=S.workouts.find(x=>x.id===el.dataset.herostart);if(w){if((w.exercises||[]).length){S.mCtx={workout:w,fromAgenda:true};S.modal="pickSessionExercises";r();}else{toast("Esse treino ainda não tem exercícios. Adicione em Meus Treinos.");}}});
  const openWorkouts=()=>{FX.tap();S.mCtx={};S.modal="treinos";r();};
  d.querySelector("#bWeekWorkouts")?.addEventListener("click",openWorkouts);

  d.querySelectorAll("[data-ass]").forEach(b=>b.onclick=()=>{S.mCtx={day:parseInt(b.dataset.ass)};S.modal="treinos";r();});
  d.querySelectorAll("[data-ed]").forEach(b=>b.onclick=e=>{e.stopPropagation();S.mCtx={day:parseInt(b.dataset.ed)};S.modal="treinos";r();});
  d.querySelectorAll("[data-play]").forEach(b=>b.onclick=e=>{e.stopPropagation();const w=S.workouts.find(x=>x.id===b.dataset.play);if(w)startSession(w.exercises||[]);else toast("Esse treino foi removido.");});
  // Alternar dia treino <-> descanso
  d.querySelectorAll("[data-toggleday]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const i=parseInt(b.dataset.toggleday);
    const wkOff=S.weekOffset||0;
    const pf=S.profile;
    if(pf.flexRoutine&&Array.isArray(pf.flexWeeks)&&pf.flexWeeks.length){
      // atualizar a semana flexível correspondente ao offset visualizado
      const created=pf.createdAt?new Date(pf.createdAt):new Date();
      const cs=new Date(created);cs.setHours(0,0,0,0);cs.setDate(cs.getDate()-cs.getDay());
      const now=new Date();now.setHours(0,0,0,0);now.setDate(now.getDate()-now.getDay()+wkOff*7);
      const weeksSince=Math.max(0,Math.round((now-cs)/(7*86400000)));
      const idx=weeksSince%pf.flexWeeks.length;
      const days=[...(pf.flexWeeks[idx].days||[])];
      const di=days.indexOf(i);
      if(di>=0){days.splice(di,1);if(S.schedule&&S.schedule[i]){delete S.schedule[i];saveSchedule(S.schedule);}}
      else{days.push(i);}
      pf.flexWeeks[idx].days=days.sort((a,b)=>a-b);
    }else{
      const td=[...(pf.trainDays||[])];
      const idx=td.indexOf(i);
      if(idx>=0){td.splice(idx,1);if(S.schedule&&S.schedule[i]){delete S.schedule[i];saveSchedule(S.schedule);}}
      else{td.push(i);}
      pf.trainDays=td.sort((a,b)=>a-b);
    }
    saveProfile(pf);FX.tap();r();
  });
  // Navegação de semana (setas)
  const goWeek=delta=>{
    const next=(S.weekOffset||0)+delta;
    if(delta<0&&isBeforeSignup(next)){toast("Não há semanas antes do seu cadastro.");return;}
    S.weekOffset=next;FX.tap();r();
  };
  d.querySelector("#bWeekPrev")?.addEventListener("click",()=>goWeek(-1));
  d.querySelector("#bWeekNext")?.addEventListener("click",()=>goWeek(1));
  d.querySelector("#bWeekToday")?.addEventListener("click",()=>{S.weekOffset=0;FX.tap();r();});
  // Swipe horizontal na grade de dias para trocar de semana
  const weekEl=d.querySelector(".ag2-week");
  if(weekEl){
    let sx=0,sy=0,swiping=false;
    weekEl.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;swiping=true;},{passive:true});
    weekEl.addEventListener("touchend",e=>{
      if(!swiping)return;swiping=false;
      const dx=e.changedTouches[0].clientX-sx;const dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){const dir=dx<0?1:-1;if(dir<0&&isBeforeSignup((S.weekOffset||0)-1)){toast("Não há semanas antes do seu cadastro.");return;}goWeek(dir);}
    },{passive:true});
  }
  return d;
}

        if(e.target.closest("[data-dayedit]"))return;
        const di=el.dataset.exp;S.aiwExpanded[di]=!S.aiwExpanded[di];render();
      });
      // Realocar dia: abre seletor
      d2.querySelectorAll("[data-dayedit]").forEach(el=>el.onclick=e=>{
        e.stopPropagation();
        const di=parseInt(el.dataset.dayedit);
        const used=res.dayMap.map(x=>x.day);
        const ov=document.createElement("div");
        ov.className="cfm-ov";
        ov.innerHTML=`<div class="cfm-box" style="max-width:320px"><div class="cfm-title" style="margin-bottom:14px">Mover para qual dia?</div><div class="aiw-dsel">${dayNames.map((dn,d)=>{const taken=used.includes(d)&&res.dayMap[di].day!==d;return `<button class="aiw-dsel-btn ${res.dayMap[di].day===d?"aiw-dsel-on":""}" data-newday="${d}" ${taken?"disabled style=\"opacity:0.35\"":""}>${dn}${taken?" (ocupado)":""}</button>`;}).join("")}</div><button class="cfm-cancel" id="dselCancel" style="margin-top:14px;width:100%">Cancelar</button></div>`;
        document.body.appendChild(ov);
        ov.onclick=ev=>{if(ev.target===ov)ov.remove();};
        ov.querySelector("#dselCancel").onclick=()=>ov.remove();
        ov.querySelectorAll("[data-newday]:not([disabled])").forEach(b=>b.onclick=()=>{
          res.dayMap[di].day=parseInt(b.dataset.newday);
          ov.remove();render();
        });
      });
      d2.querySelector("#bRegen").onclick=()=>{S.aiwResult=null;S.aiwExpanded={};S.aiwStep=0;render();};
      d2.querySelector("#bSaveAIW").onclick=async(ev)=>{
        const btn=ev.currentTarget;if(btn.dataset.s==="1")return;btn.dataset.s="1";btn.disabled=true;btn.style.opacity="0.6";btn.textContent="Salvando...";
        try{
          if(!S.schedule)S.schedule={};
          const savedIds=[];
          // salvar cada treino único uma vez
          for(let wi=0;wi<wks.length;wi++){
            const w=wks[wi];
            const muscles=[...new Set(w.exercises.map(e=>e.group))];
            const wk={name:w.name,letter:w.letter,muscles,exercises:w.exercises};
            const id=await saveWorkout(wk);
            S.workouts.push({id,...wk});
            savedIds[wi]=id;
          }
          // alocar nos dias
          for(const dm of res.dayMap){
            const w=wks[dm.wkIndex];const id=savedIds[dm.wkIndex];
            S.schedule[dm.day]={id,name:w.name,letter:w.letter};
          }
          await saveSchedule(S.schedule);
          S.aiwExpanded={};
          toast("Plano salvo e alocado na sua semana!","success");
          closeModal(true);
        }catch(e){btn.dataset.s="0";btn.disabled=false;btn.style.opacity="1";btn.textContent="✓ Salvar plano";toast("Erro ao salvar. Tente novamente.","error");}
      };
      return;
    }
    // Question steps
    const step=steps[S.aiwStep];
    const isLast=S.aiwStep===steps.length-1;
    d2.innerHTML=`<div class="modal-handle"></div><div class="modal-hdr"><div><div class="modal-sub">PERGUNTA ${S.aiwStep+1} DE ${steps.length+1}</div><div class="modal-title">${step.q}</div></div><button class="close-x" id="bX">✕</button></div>
      <div style="display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;padding:2px">
        ${step.opts.map(([v,label])=>`<button class="aiw-opt" data-v="${v}" style="padding:16px;background:${S.aiwData[step.key]===v?"rgba(255,107,0,0.15)":"var(--bg2)"};border:1.5px solid ${S.aiwData[step.key]===v?"var(--orange)":"var(--border)"};border-radius:14px;color:var(--text);font-weight:600;font-size:15px;text-align:left;cursor:pointer">${label}</button>`).join("")}
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        ${S.aiwStep>0?`<button class="btn-sec" id="bBack" style="flex:1;padding:13px">← Voltar</button>`:""}
        <button class="btn-primary" id="bNext" style="flex:2;padding:13px">${isLast?"Falar sobre lesões →":"Próximo →"}</button>
      </div>`;
    d2.querySelector("#bX").onclick=closeModal;
    d2.querySelectorAll(".aiw-opt").forEach(b=>b.onclick=()=>{S.aiwData[step.key]=b.dataset.v;render();});
    d2.querySelector("#bBack")?.addEventListener("click",()=>{S.aiwStep--;render();});
    d2.querySelector("#bNext")?.addEventListener("click",()=>{
      if(!S.aiwData[step.key]){toast("Escolha uma opção para continuar.");return;}
      if(isLast){renderDayPicker();}else{S.aiwStep++;render();}
    });
  };

  const renderDayPicker=()=>{
    const nDays=parseInt(S.aiwData.days)||3;
    if(!S.aiwData.selectedDays)S.aiwData.selectedDays=[];
    const dayNames=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
    const sel=S.aiwData.selectedDays;
    d2.innerHTML=`<div class="modal-handle"></div><div class="modal-hdr"><div><div class="modal-sub">EM QUAIS DIAS?</div><div class="modal-title">Escolha ${nDays} ${nDays===1?"dia":"dias"}</div></div><button class="close-x" id="bX">✕</button></div>
      <div style="font-size:13px;color:var(--text3);margin-bottom:14px">Selecione os dias da semana em que você vai treinar. Os treinos já serão alocados nesses dias.</div>
      <div class="aiw-days">
        ${dayNames.map((dn,i)=>`<button class="aiw-day ${sel.includes(i)?"aiw-day-on":""}" data-day="${i}">${dn}</button>`).join("")}
      </div>
      <div class="aiw-day-count">${sel.length}/${nDays} selecionados</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn-sec" id="bBack" style="flex:1;padding:13px">← Voltar</button>
        <button class="btn-primary" id="bToInjury" style="flex:2;padding:13px">Continuar →</button>
      </div>`;
    d2.querySelector("#bX").onclick=closeModal;
    d2.querySelector("#bBack").onclick=()=>{render();};
    d2.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
      const day=parseInt(b.dataset.day);
      const i=sel.indexOf(day);
      if(i>=0)sel.splice(i,1);
      else{if(sel.length>=nDays){toast(`Você já escolheu ${nDays} dias. Desmarque um para trocar.`);return;}sel.push(day);}
      renderDayPicker();
    });
    d2.querySelector("#bToInjury").onclick=()=>{
      if(sel.length!==nDays){toast(`Escolha exatamente ${nDays} ${nDays===1?"dia":"dias"}.`);return;}
      sel.sort((a,b)=>a-b);
      renderInjuries();
    };
  };

  const renderInjuries=()=>{
    d2.innerHTML=`<div class="modal-handle"></div><div class="modal-hdr"><div><div class="modal-sub">PERGUNTA ${steps.length+1} DE ${steps.length+1}</div><div class="modal-title">Tem alguma lesão ou limitação?</div></div><button class="close-x" id="bX">✕</button></div>
      <div style="font-size:13px;color:#888;margin-bottom:10px">Opcional. Ex: "dor no ombro", "lesão no joelho", "hérnia". A IA vai evitar exercícios que possam te machucar.</div>
      <textarea id="aiwInjury" placeholder="Deixe em branco se não tiver nenhuma..." style="width:100%;min-height:80px;padding:14px;background:var(--bg3);border:1px solid var(--border-soft);border-radius:12px;color:var(--text);font-size:15px;outline:none;resize:vertical">${S.aiwData.injury||""}</textarea>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn-sec" id="bBack" style="flex:1;padding:13px">← Voltar</button>
        <button class="btn-primary" id="bGen" style="flex:2;padding:13px">🤖 Gerar treino</button>
      </div>`;
    d2.querySelector("#bX").onclick=closeModal;
    d2.querySelector("#bBack").onclick=()=>{renderDayPicker();};
    d2.querySelector("#bGen").onclick=()=>{S.aiwData.injury=d2.querySelector("#aiwInjury").value.trim();generateWorkout();};
  };

  const generateWorkout=async()=>{
    // Limit check (free plan)
    if(usesLeft("aiWorkout")<=0){
      S.aiwLoading=false;
      showPremiumGate("Você atingiu o limite de "+PLAN_LIMITS.free.aiWorkoutsPerWeek+" treinos com IA por semana do plano grátis.");
      return;
    }
    consumeUse("aiWorkout");
    S.aiwLoading=true;render();
    const dt=S.aiwData;
    const nDays=parseInt(dt.days)||(dt.selectedDays?dt.selectedDays.length:3);
    const goalMap={hipertrofia:"hipertrofia (ganho de massa muscular)",emagrecer:"emagrecimento",forca:"força máxima",resistencia:"resistência e condicionamento"};
    const equipMap={academia:"academia completa (máquinas, barras, halteres, polias)",halteres:"apenas halteres",casa:"apenas peso do corpo (em casa, sem equipamentos)",barra:"barra e anilhas"};
    const focusMap={fullbody:"corpo todo em cada treino (full body)",abc:"divisao ABC (A: peito/triceps, B: costas/biceps, C: pernas/ombro) ou similar conforme o numero de dias",push_pull_legs:"divisao Push/Pull/Legs (empurrar / puxar / pernas)",upper_lower:"divisao Superior/Inferior (upper/lower)"};
    const validGroups="peito, costas, pernas, ombros, biceps, triceps, abdomen, gluteos, trapezio, antebraco";
    const prompt=`Voce e um personal trainer experiente. Monte um PLANO de treino semanal de musculacao personalizado em portugues do Brasil, com EXATAMENTE ${nDays} treino(s) (um para cada dia de treino).
Perfil do aluno:
- Objetivo: ${goalMap[dt.goal]||dt.goal}
- Nivel: ${dt.level}
- Tempo disponivel por treino: ${dt.time} minutos
- Equipamento: ${equipMap[dt.equip]||dt.equip}
- Tipo de divisao: ${focusMap[dt.focus]||dt.focus}
- Dias de treino por semana: ${nDays}
- Lesoes/limitacoes: ${dt.injury||"nenhuma"}
Regras: gere ${nDays} treino(s) distintos e complementares (cobrindo o corpo ao longo da semana sem sobrecarregar o mesmo grupo em dias seguidos). Cada treino deve ter um "name" curto e descritivo (ex: "Treino A - Peito e Triceps") e uma "letter" de 1-2 letras (A, B, C...). Escolha exercicios compativeis com o tempo (cerca de 1 exercicio a cada 6-8 min). Respeite o equipamento. Evite exercicios que agravem as lesoes. Ajuste series/reps/descanso ao objetivo (hipertrofia 8-12 reps descanso 60-90s; forca 3-6 reps descanso 120-180s; emagrecer/resistencia 12-20 reps descanso 30-45s). Para cada exercicio defina "group" usando SOMENTE um destes valores: ${validGroups}. Responda em portugues.`;
    try{
      const resp=await fetch("https://boltfit-ia.vitortorresdarosa.workers.dev",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{parts:[{text:prompt}]}],
          generationConfig:{
            temperature:0.5,maxOutputTokens:2048,thinkingConfig:{thinkingBudget:0},
            responseMimeType:"application/json",
            responseSchema:{type:"OBJECT",properties:{
              workouts:{type:"ARRAY",items:{type:"OBJECT",properties:{
                name:{type:"STRING"},letter:{type:"STRING"},desc:{type:"STRING"},
                exercises:{type:"ARRAY",items:{type:"OBJECT",properties:{
                  name:{type:"STRING"},group:{type:"STRING"},sets:{type:"NUMBER"},reps:{type:"STRING"},rest:{type:"NUMBER"},muscles:{type:"STRING"}
                },required:["name","group","sets","reps","rest"]}}
              },required:["name","exercises"]}}
            },required:["workouts"]}
          }
        })
      });
      if(!resp.ok){
        if(resp.status===429)throw new Error("Limite de uso da IA atingido. Aguarde 1 minuto.");
        throw new Error("Falha na IA ("+resp.status+").");
      }
      const data=await resp.json();
      let txt=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
      txt=txt.replace(/```json|```/g,"").trim();
      let result=null;
      try{result=JSON.parse(txt);}catch(e){
        const s=txt.indexOf("{");if(s>=0){let dep=0,end=-1;for(let i=s;i<txt.length;i++){if(txt[i]==="{")dep++;else if(txt[i]==="}"){dep--;if(dep===0){end=i;break;}}}if(end>s){try{result=JSON.parse(txt.slice(s,end+1));}catch(e2){}}}
      }
      // aceitar tanto {workouts:[...]} quanto {exercises:[...]} (compat)
      let workouts=result.workouts;
      if(!workouts&&result.exercises)workouts=[{name:result.name||"Treino IA",letter:(result.name||"IA")[0],exercises:result.exercises}];
      if(!workouts||!workouts.length)throw new Error("A IA respondeu de forma incompleta. Tente novamente.");
      const valid=["peito","costas","pernas","ombros","biceps","triceps","abdomen","gluteos","trapezio","antebraco"];
      const letters=["A","B","C","D","E","F"];
      workouts=workouts.map((w,wi)=>({
        name:w.name||("Treino "+letters[wi]),
        letter:(w.letter||letters[wi]||"A").slice(0,2).toUpperCase(),
        desc:w.desc||"",
        exercises:(w.exercises||[]).map((ex,i)=>({
          id:"aiw"+Date.now()+"_"+wi+"_"+i,
          name:ex.name,group:valid.includes(ex.group)?ex.group:"peito",
          sets:Number(ex.sets)||3,reps:ex.reps||"10-12",rest:Number(ex.rest)||60,muscles:ex.muscles||""
        }))
      }));
      // alocar nos dias selecionados (ordem)
      const days=(S.aiwData.selectedDays||[]).slice().sort((a,b)=>a-b);
      S.aiwResult={workouts,dayMap:days.map((d,i)=>({day:d,wkIndex:i%workouts.length}))};
      S.aiwLoading=false;render();
    }catch(err){
      S.aiwLoading=false;
      toast((err&&err.message)?err.message:"Erro ao gerar treino. Tente novamente.","error");
      render();
    }
  };

  render();
  return d;
}

// ─── COACH IA (chat fitness interno) ───
function rCoachModal(){
  const d=D("overlay");
  d.innerHTML=`<div class="modal-sheet"></div>`;
  const d2=d.querySelector(".modal-sheet");
  d.onclick=e=>{if(e.target===d)closeModal();};
  if(!S.coachMsgs)S.coachMsgs=[{role:"assistant",text:"E aí! 👋 Sou seu coach de treino e nutrição. Pode perguntar sobre exercícios, técnica, substituições, dieta, lesões... Como posso ajudar?"}];

  const suggestions=["Qual exercício substitui leg press?","Posso treinar peito com dor no ombro?","Quantas vezes treinar por semana?","O que comer antes do treino?"];

  const render=()=>{
    const left=usesLeft("coach");
    d2.innerHTML=`<div class="modal-handle"></div>
      <div class="modal-hdr"><div><div class="modal-title">💬 Coach IA</div><div class="modal-sub">${isPremium()?"Premium · ilimitado":left+" perguntas restantes hoje"}</div></div><button class="close-x" id="bX">✕</button></div>
      <div id="coachScroll" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px;min-height:200px;max-height:55vh">
        ${S.coachMsgs.map(m=>m.role==="assistant"
          ?`<div style="align-self:flex-start;max-width:85%;background:var(--bg3);border-radius:14px;border-top-left-radius:4px;padding:11px 13px;font-size:14px;line-height:1.5;color:var(--text);white-space:pre-wrap">${m.text}</div>`
          :`<div style="align-self:flex-end;max-width:85%;background:var(--orange);border-radius:14px;border-top-right-radius:4px;padding:11px 13px;font-size:14px;line-height:1.5;color:#fff;white-space:pre-wrap">${m.text}</div>`
        ).join("")}
        ${S.coachLoading?`<div style="align-self:flex-start;background:var(--bg3);border-radius:14px;padding:11px 13px;font-size:14px;color:#888">digitando<span class="dots">...</span></div>`:""}
      </div>
      ${S.coachMsgs.length<=1?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px">${suggestions.map(s=>`<button class="coach-sug" data-q="${s.replace(/"/g,"&quot;")}" style="font-size:12px;padding:7px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:16px;color:var(--text2);cursor:pointer">${s}</button>`).join("")}</div>`:""}
      <div style="display:flex;gap:8px;margin-top:10px;align-items:flex-end">
        <textarea id="coachInp" placeholder="Pergunte algo..." rows="1" style="flex:1;padding:12px;background:var(--bg3);border:1px solid var(--border-soft);border-radius:12px;color:var(--text);font-size:15px;outline:none;resize:none;max-height:100px"></textarea>
        <button id="coachSend" style="width:48px;height:48px;background:var(--orange);border:none;border-radius:12px;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0">➤</button>
      </div>`;
    d2.querySelector("#bX").onclick=closeModal;
    const scroll=d2.querySelector("#coachScroll");if(scroll)scroll.scrollTop=scroll.scrollHeight;
    d2.querySelectorAll(".coach-sug").forEach(b=>b.onclick=()=>send(b.dataset.q));
    d2.querySelector("#coachSend").onclick=()=>{const inp=d2.querySelector("#coachInp");send(inp.value);};
    const inp=d2.querySelector("#coachInp");
    if(inp)inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(inp.value);}};
  };

  const send=async(text)=>{
    text=(text||"").trim();
    if(!text||S.coachLoading)return;
    if(usesLeft("coach")<=0){showPremiumGate("Você atingiu o limite de "+PLAN_LIMITS.free.coachPerDay+" perguntas ao Coach IA por dia do plano grátis.");return;}
    consumeUse("coach");
    S.coachMsgs.push({role:"user",text});
    S.coachLoading=true;render();
    // Build context from profile
    const p=S.profile||{};
    const ctx=`Perfil do usuario: ${p.age||"?"} anos, ${p.weight||"?"}kg, ${p.height||"?"}cm, objetivo: ${({lose:"emagrecer",maintain:"manutencao",gain:"ganhar massa"})[p.goal]||"?"}, divisao de treino: ${p.split||"?"}.`;
    const history=S.coachMsgs.slice(-8).map(m=>`${m.role==="user"?"Usuario":"Coach"}: ${m.text}`).join("\n");
    const prompt=`Voce e um personal trainer e nutricionista experiente, simpatico e direto, respondendo em portugues do Brasil. Responda de forma clara e pratica, sem enrolacao, como um coach de verdade no WhatsApp. Use no maximo 4 frases curtas, a nao ser que a pergunta exija mais detalhes. Se a pergunta for sobre dor ou lesao seria, recomende procurar um medico/fisioterapeuta. Se a pergunta nao tiver nada a ver com treino, nutricao ou saude, redirecione gentilmente para esses temas.\n\n${ctx}\n\nConversa ate agora:\n${history}\n\nResponda a ultima mensagem do usuario.`;
    try{
      const resp=await fetch("https://boltfit-ia.vitortorresdarosa.workers.dev",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.6,maxOutputTokens:600,thinkingConfig:{thinkingBudget:0}}})
      });
      if(!resp.ok){
        if(resp.status===429)throw new Error("Limite de uso da IA atingido. Aguarde 1 minuto.");
        throw new Error("Falha na IA ("+resp.status+").");
      }
      const data=await resp.json();
      let txt=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
      txt=txt.trim()||"Desculpe, não consegui responder. Tente reformular a pergunta.";
      S.coachMsgs.push({role:"assistant",text:txt});
    }catch(err){
      S.coachMsgs.push({role:"assistant",text:"⚠️ "+((err&&err.message)||"Erro ao responder. Tente novamente.")});
    }
    S.coachLoading=false;render();
  };

  render();
  return d;
}

      <div style="padding:6px 0 16px">

        <div style="font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:600">Toque para adicionar uma preferência:</div>

        <div style="font-size:13px;color:var(--text3);margin-bottom:8px">Ou escreva você mesmo (opcional):</div>

      <button class="btn-primary" id="bGenDiet" style="width:100%;padding:14px;background:linear-gradient(135deg,#FF6B00,#FF8C42)">🤖 Gerar minha dieta</button>`;
    d2.querySelector("#bX").onclick=closeModal;
    // Chips append to textarea
    d2.querySelectorAll(".diet-ex-chip").forEach(b=>b.onclick=()=>{
      const ta=d2.querySelector("#dietPref");const v=b.dataset.ex;
      const cur=ta.value.trim();
      if(cur.toLowerCase().includes(v.toLowerCase()))return;
      ta.value=cur?cur+", "+v:v;
      b.style.background="var(--orange)";b.style.color="#fff";b.style.borderColor="var(--orange)";
    });
    d2.querySelector("#bGenDiet").onclick=()=>{S.dietPref=(d2.querySelector("#dietPref").value||"").trim();generateDiet();};
  };

  const addMealToDiary=(meal)=>{
    const catMap={"café da manhã":"cafe","cafe da manha":"cafe","almoço":"almoco","almoco":"almoco","lanche":"lanche","lanche da tarde":"lanche","jantar":"jantar","ceia":"ceia"};
    const key=catMap[(meal.name||"").toLowerCase()]||"sem_categoria";
    (meal.items||[]).forEach(it=>{
      const ni=S.foods.length;
      const grams=parseFloat(String(it.qty||"").replace(/[^0-9.]/g,""))||100;
      // cal/p/c/f da IA são para a porção (qty), então serving=grams para o cálculo bater
      S.foods.push({n:it.food,cal:Number(it.cal)||0,p:Number(it.p)||0,c:Number(it.c)||0,f:Number(it.f)||0,grams,serving:grams,at:new Date().toISOString()});
      if(!S.mealCat)S.mealCat={};
      S.mealCat[ni]=key;
    });
  };

  const generateDiet=async()=>{
    if(usesLeft("aiWorkout")<=0&&!isPremium()){
      // reuse aiWorkout weekly limit bucket? No — diet is premium-flavored. Use its own gentle gate:
    }
    S.dietLoading=true;render();
    const p=S.profile||{};
    const goal=({lose:"emagrecimento (deficit calorico)",maintain:"manutencao",gain:"ganho de massa muscular (superavit)"})[p.goal]||"saude";
    const cal=S.targetCal||2000;
    const wkg=parseFloat(p.weight)||75;
    // Metas de macro: proteína 1.8-2.2g/kg, gordura baixa-moderada (~0.8g/kg), resto em carbo
    const protMeta=Math.round(wkg*2);
    const fatMeta=Math.round(wkg*0.8);
    const carbMeta=Math.max(0,Math.round((cal-(protMeta*4)-(fatMeta*9))/4));
    const prompt=`Voce e um nutricionista esportivo. Monte um plano alimentar de UM dia em portugues do Brasil.

REGRAS OBRIGATORIAS (siga rigorosamente):
1. META CALORICA: o TOTAL do dia deve ficar entre ${cal-10} e ${cal} kcal. NUNCA acima de ${cal}. NUNCA abaixo de ${cal-10}. Essa precisao e CRITICA. Ajuste as quantidades (em gramas) dos ultimos itens das ultimas refeicoes para encaixar EXATAMENTE nessa faixa. Faca as contas: some todas as calorias antes de responder e confirme que o total esta entre ${cal-10} e ${cal}.
2. PROTEINA: alvo de aproximadamente ${protMeta}g (margem +-10g). Use fontes magras: frango, ovos, peixe, carne magra, whey, iogurte, queijo cottage.
3. CARBOIDRATOS: alvo de ${carbMeta}g. Use arroz, batata, aveia, frutas, pao, mandioca.
4. GORDURA: alvo baixo, ~${fatMeta}g. NAO abuse de oleos, castanhas, manteiga ou frituras, a nao ser que o usuario peca.
5. Distribua de forma saudavel e equilibrada entre as refeicoes.
6. Use quantidades em gramas REALISTAS e PRECISAS (ex: 130g, 145g, 165g) para conseguir bater a meta calorica exata. Nao use so numeros redondos.

Perfil: objetivo de ${goal}, peso ${wkg}kg, meta de ${cal} kcal/dia.
Distribua em: Cafe da Manha, Almoco, Lanche da Tarde, Jantar e Ceia (se fizer sentido).
Use alimentos comuns e baratos do Brasil. ${S.dietPref?("Preferencias/restricoes do usuario (RESPEITE): "+S.dietPref+".") : ""}

Para cada item informe valores nutricionais REAIS e PRECISOS (baseados na tabela TACO/USDA): food (nome), qty (quantidade ex '130g' ou '2 unidades'), cal (kcal da porcao), p (proteina g), c (carbo g), f (gordura g). 
ATENCAO CRITICA: os valores devem ser corretos. Exemplos de referencia por 100g: arroz cozido ~128kcal/2.5p/28c, feijao cozido ~76kcal/4.8p/14c, frango grelhado ~165kcal/31p/0c, ovo ~78kcal/6p (unidade), batata cozida ~86kcal/2p/20c, aveia ~389kcal/17p/66c, pao frances ~270kcal/9p/55c, banana ~89kcal/1.1p/23c. 
ANTES DE RESPONDER: some todas as calorias e verifique se o total esta entre ${cal-10} e ${cal} kcal. Se estiver fora, AJUSTE as gramaturas. Responda em portugues.`;
    try{
      const resp=await fetch("https://boltfit-ia.vitortorresdarosa.workers.dev",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{
          temperature:0.5,maxOutputTokens:2048,thinkingConfig:{thinkingBudget:0},
          responseMimeType:"application/json",
          responseSchema:{type:"OBJECT",properties:{
            meals:{type:"ARRAY",items:{type:"OBJECT",properties:{
              name:{type:"STRING"},
              items:{type:"ARRAY",items:{type:"OBJECT",properties:{food:{type:"STRING"},qty:{type:"STRING"},cal:{type:"NUMBER"},p:{type:"NUMBER"},c:{type:"NUMBER"},f:{type:"NUMBER"}},required:["food","cal"]}}
            },required:["name","items"]}},
            tips:{type:"STRING"}
          },required:["meals"]}
        }})
      });
      if(!resp.ok){if(resp.status===429)throw new Error("Limite de uso da IA. Aguarde 1 minuto.");throw new Error("Falha na IA ("+resp.status+").");}
      const data=await resp.json();
      let txt=data?.candidates?.[0]?.content?.parts?.map(x=>x.text||"").join("")||"";
      txt=txt.replace(/```json|```/g,"").trim();
      let result=null;
      try{result=JSON.parse(txt);}catch(e){const s=txt.indexOf("{");if(s>=0){let dep=0,end=-1;for(let i=s;i<txt.length;i++){if(txt[i]==="{")dep++;else if(txt[i]==="}"){dep--;if(dep===0){end=i;break;}}}if(end>s){try{result=JSON.parse(txt.slice(s,end+1));}catch(e2){}}}}
      if(!result||!result.meals)throw new Error("A IA respondeu de forma incompleta. Tente novamente.");

      // ─── AJUSTE FINO: deixar o total dentro de [meta-10, meta] kcal ───
      const meta=S.targetCal||2000;
      const tolLow=meta-10, tolHigh=meta;
      // 1) Soma total
      const sumCal=()=>result.meals.reduce((a,m)=>a+(m.items||[]).reduce((x,it)=>x+(Number(it.cal)||0),0),0);
      let total=sumCal();

      // 2) Se passou da meta, reduz proporcionalmente os ULTIMOS itens até caber.
      if(total>tolHigh){
        // Lista plana de itens com referência (para ajustar in-place)
        const flat=[];
        result.meals.forEach((m,mi)=>(m.items||[]).forEach((it,ii)=>flat.push({m,mi,it,ii})));
        // Tenta reduzir o último item (e os anteriores se necessário) proporcionalmente
        for(let i=flat.length-1;i>=0&&total>tolHigh;i--){
          const it=flat[i].it;
          const itemCal=Number(it.cal)||0;
          if(itemCal<=0)continue;
          const excess=total-tolHigh+5;// puxa um pouco abaixo do teto p/ segurança
          if(excess<itemCal*0.95){
            // reduz proporcionalmente esse item
            const factor=Math.max(0.05,(itemCal-excess)/itemCal);
            it.cal=Math.round(itemCal*factor);
            it.p=Math.round((Number(it.p)||0)*factor*10)/10;
            it.c=Math.round((Number(it.c)||0)*factor*10)/10;
            it.f=Math.round((Number(it.f)||0)*factor*10)/10;
            // ajusta a quantidade em gramas no qty se for em g
            const qm=String(it.qty||"").match(/([\d.]+)\s*g/i);
            if(qm){const newG=Math.max(5,Math.round(parseFloat(qm[1])*factor));it.qty=String(it.qty).replace(/[\d.]+\s*g/i,newG+"g");}
            total=sumCal();
          }else{
            // item inteiro precisa sair
            total-=itemCal;
            flat[i].m.items.splice(flat[i].ii,1);
            // após splice, índices ii ficam inconsistentes, mas como vamos de trás pra frente está OK
          }
        }
      }

      // 3) Se ficou muito abaixo, AUMENTA o último item carbo-friendly ou cria um pequeno snack
      if(total<tolLow){
        const flat=[];
        result.meals.forEach((m)=>(m.items||[]).forEach((it)=>flat.push({m,it})));
        // Tenta aumentar o último item (geralmente carbo da última refeição)
        for(let i=flat.length-1;i>=0&&total<tolLow;i--){
          const it=flat[i].it;
          const itemCal=Number(it.cal)||0;
          if(itemCal<=0)continue;
          const deficit=tolHigh-total-2;// vai pro topo da faixa
          const maxBoost=itemCal*1.8;// no máximo +80% no mesmo item p/ não ficar surreal
          const add=Math.min(deficit,maxBoost);
          if(add<=0)continue;
          const factor=(itemCal+add)/itemCal;
          it.cal=Math.round(itemCal*factor);
          it.p=Math.round((Number(it.p)||0)*factor*10)/10;
          it.c=Math.round((Number(it.c)||0)*factor*10)/10;
          it.f=Math.round((Number(it.f)||0)*factor*10)/10;
          const qm=String(it.qty||"").match(/([\d.]+)\s*g/i);
          if(qm){const newG=Math.round(parseFloat(qm[1])*factor);it.qty=String(it.qty).replace(/[\d.]+\s*g/i,newG+"g");}
          total=sumCal();
        }
        // se ainda assim faltar mais que 25 kcal, adiciona uma fruta na Ceia ou Lanche da Tarde
        if(total<tolLow-25){
          const deficit=tolHigh-total-3;
          // calorias por grama de banana: ~0.89 → grams = deficit/0.89
          const grams=Math.max(30,Math.min(220,Math.round(deficit/0.89)));
          const snack={food:"Banana",qty:grams+"g",cal:Math.round(grams*0.89),p:Math.round(grams*0.011*10)/10,c:Math.round(grams*0.23*10)/10,f:Math.round(grams*0.003*10)/10};
          // tenta adicionar na Ceia, senão Lanche da Tarde, senão cria
          let target=result.meals.find(m=>/ceia/i.test(m.name||""));
          if(!target)target=result.meals.find(m=>/lanche/i.test(m.name||""));
          if(!target){target={name:"Lanche extra",items:[]};result.meals.push(target);}
          target.items=target.items||[];
          target.items.push(snack);
          total=sumCal();
        }
      }

      S.dietResult=result;S.dietLoading=false;render();
    }catch(err){
      S.dietLoading=false;toast((err&&err.message)||"Erro ao gerar dieta.","error");render();
    }
  };

  render();
  return d;
}

function rMonthCalModal(){
  const d=D("overlay");
  d.innerHTML=`<div class="modal-sheet"></div>`;
  const d2=d.querySelector(".modal-sheet");
  d.onclick=e=>{if(e.target===d)closeModal();};
  const monthNames=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const wdShort=["D","S","T","Q","Q","S","S"];
  const todayKey=new Date().toISOString().split("T")[0];
  const sel=new Date((S.calDate||todayKey)+"T12:00:00");
  // View month/year state held on S.calViewYM
  if(!S.calViewYM)S.calViewYM={y:sel.getFullYear(),m:sel.getMonth()};
  const render=(slideDir)=>{
    const{y,m}=S.calViewYM;
    const first=new Date(y,m,1);
    const startWd=first.getDay();
    const daysInMonth=new Date(y,m+1,0).getDate();
    const cells=[];
    for(let i=0;i<startWd;i++)cells.push(null);
    for(let dn=1;dn<=daysInMonth;dn++)cells.push(dn);
    const grid=cells.map(dn=>{
      if(dn===null)return `<div></div>`;
      const k=`${y}-${String(m+1).padStart(2,"0")}-${String(dn).padStart(2,"0")}`;
      const isSel=k===S.calDate;const isTd=k===todayKey;const hasData=S.history&&S.history[k]&&typeof S.history[k].cal==="number"&&S.history[k].cal>0;
      return `<button class="mc-day ${isSel?"mc-day-sel":""} ${isTd?"mc-day-today":""}" data-mcd="${k}">${dn}${hasData?`<span class="mc-dot"></span>`:""}</button>`;
    }).join("");
    d2.innerHTML=`<div class="modal-handle"></div>
      <div class="modal-hdr"><div class="modal-title">📅 Calendário</div><button class="close-x" id="bX">✕</button></div>
      <div style="padding:2px">
        <div class="mc-nav">
          <button class="mc-arrow" id="bPrevM">‹</button>
          <div style="display:flex;gap:8px;align-items:center">
            <select id="mcMonth" class="mc-select">${monthNames.map((mn,i)=>`<option value="${i}" ${i===m?"selected":""}>${mn}</option>`).join("")}</select>
            <select id="mcYear" class="mc-select">${Array.from({length:7},(_, i)=>new Date().getFullYear()-5+i).map(yy=>`<option value="${yy}" ${yy===y?"selected":""}>${yy}</option>`).join("")}</select>
          </div>
          <button class="mc-arrow" id="bNextM">›</button>
        </div>
        <div class="mc-grid mc-grid-wd">${wdShort.map(w=>`<div class="mc-wd">${w}</div>`).join("")}</div>
        <div class="mc-grid">${grid}</div>
        <button class="btn-sec" id="bToday" style="width:100%;margin-top:14px">Ir para hoje</button>
      </div>`;
    d2.querySelector("#bX").onclick=closeModal;
    d2.querySelector("#bPrevM").onclick=()=>{let nm=m-1,ny=y;if(nm<0){nm=11;ny--;}S.calViewYM={y:ny,m:nm};render();};
    d2.querySelector("#bNextM").onclick=()=>{let nm=m+1,ny=y;if(nm>11){nm=0;ny++;}S.calViewYM={y:ny,m:nm};render();};
    d2.querySelector("#mcMonth").onchange=e=>{S.calViewYM={y,m:parseInt(e.target.value)};render();};
    d2.querySelector("#mcYear").onchange=e=>{S.calViewYM={y:parseInt(e.target.value),m};render();};
    d2.querySelector("#bToday").onclick=()=>{S.calViewYM=null;switchCalDate(todayKey);};
    d2.querySelectorAll("[data-mcd]").forEach(b=>b.onclick=()=>{S.calViewYM=null;switchCalDate(b.dataset.mcd);});
    if(slideDir){const g=d2.querySelector(".mc-grid:not(.mc-grid-wd)");if(g)g.classList.add(slideDir==="left"?"mc-slide-l":"mc-slide-r");}
  };
  // Deslizar com o dedo para trocar de mês
  let _tx=0,_ty=0;
  d2.addEventListener("touchstart",e=>{_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
  d2.addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-_tx,dy=e.changedTouches[0].clientY-_ty;
    if(Math.abs(dx)>52&&Math.abs(dx)>Math.abs(dy)*1.4){
      const{y,m}=S.calViewYM;let nm=m+(dx<0?1:-1),ny=y;
      if(nm<0){nm=11;ny--;}if(nm>11){nm=0;ny++;}
      S.calViewYM={y:ny,m:nm};FX.tap();render(dx<0?"left":"right");
    }
  },{passive:true});
  render();
  return d;
}

function foodUnit(name){
  // Alimentos contáveis: passos de 1 unidade; mostra gramas ao lado.
  const n=(name||"").toLowerCase();
  const U=(g,sing,plur)=>({g,sing,plur:plur||(sing+"s")});
  if(/\bovo|ovos\b/.test(n)&&!/clara|gema|colher|p[óo]/.test(n))return U(50,"unidade","unidades");
  if(/p[ãa]o franc[êe]s|p[ãa]ozinho|p[ãa]o de forma|p[ãa]o integral|p[ãa]o de queijo|p[ãa]o sirio|p[ãa]o careca|baguete|bisnaguinha/.test(n))return U(50,"unidade","unidades");
  if(/banana/.test(n))return U(100,"unidade","unidades");
  if(/ma[çc][ãa]\b/.test(n))return U(130,"unidade","unidades");
  if(/laranja\b/.test(n))return U(130,"unidade","unidades");
  if(/\btangerina|mexerica|bergamota\b/.test(n))return U(110,"unidade","unidades");
  if(/\bpera\b/.test(n))return U(130,"unidade","unidades");
  if(/\bkiwi\b/.test(n))return U(75,"unidade","unidades");
  if(/\bovo de codorna/.test(n))return U(10,"unidade","unidades");
  if(/fatia|torrada/.test(n))return U(25,"fatia","fatias");
  if(/bolacha|biscoito|cookie/.test(n)&&!/pacote/.test(n))return U(8,"unidade","unidades");
  return null;
}
function calcAdj(f){
  // base = porção de referência dos macros. Os valores cal/p/c/f são SEMPRE
  // relativos a `serving` gramas. Se serving estiver ausente, assume 100g.
  const base=(f.serving&&f.serving>0)?f.serving:100;
  const grams=(f.grams&&f.grams>0)?f.grams:base;
  const ratio=grams/base;
  return {
    grams,
    cal:Math.round((f.cal||0)*ratio),
    p:+(((f.p||0)*ratio).toFixed(1)),
    c:+(((f.c||0)*ratio).toFixed(1)),
    f:+(((f.f||0)*ratio).toFixed(1)),
  };
}

function updateCalTotals(d){
  let totalCal=0,totalP=0,totalC=0,totalF=0;
  S.foods.forEach(f=>{const a=calcAdj(f);totalCal+=a.cal;totalP+=a.p;totalC+=a.c;totalF+=a.f;});
  const cal=S.targetCal||0;
  const pct=cal>0?Math.min((totalCal/cal)*100,100):0;
  const ring84=2*Math.PI*84;
  const mp=Math.round(cal*0.3/4),mc=Math.round(cal*0.45/4),mf=Math.round(cal*0.25/9);
  const ringEl=d.querySelector("#calRingCircle");
  const numEl=d.querySelector("#calTotalNum");
  if(ringEl)ringEl.style.strokeDashoffset=ring84*(1-pct/100);
  if(numEl)numEl.textContent=Math.round(totalCal);
  const remainEl=d.querySelector("#calRemain");
  if(remainEl){const rem=Math.round(cal-totalCal);remainEl.textContent=rem>0?`faltam ${rem}`:rem===0?"meta atingida 🎯":`${-rem} acima`;}
  // Mini-anéis de macros
  const Rm=26,Cm=2*Math.PI*Rm;
  const setMacro=(letter,val,goal,c1)=>{
    const mpct=goal>0?Math.min((val/goal)*100,100):0;
    const arc=d.querySelector(`.dash-macro-arc[data-macro="${letter}"]`);
    if(arc)arc.style.strokeDashoffset=Cm*(1-mpct/100);
    const pctEl=arc?arc.closest(".dash-macro-ring")?.querySelector(".dash-macro-pct"):null;
    if(pctEl)pctEl.textContent=Math.round(mpct)+"%";
    const valEl=d.querySelector(`#macroval-${letter}`);
    if(valEl)valEl.innerHTML=Math.round(val)+`<span class="dash-macro-goal">/${goal}g</span>`;
  };
  setMacro("P",totalP,mp,"#4B9EFF");
  setMacro("C",totalC,mc,"#FF8C42");
  setMacro("G",totalF,mf,"#22D3A5");
}

async function switchCalDate(dateKey){
  if(S.calDate===dateKey&&S.modal!=="monthCal")return;
  const fromMonthModal=(S.modal==="monthCal");
  S.calDate=dateKey;
  S._calGoalToday=false; // reset flag de meta atingida ao mudar de dia
  S._calLastTotal=0;
  if(fromMonthModal){S.modal=null;S.tab="calorias";r();return;}
  S.tab="calorias";

  // Atualização CIRÚRGICA do carrossel — sem rerender da tela inteira
  const dayNamesShort=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const monthNames=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const todayKey=new Date().toISOString().split("T")[0];
  const carEl=document.querySelector("#calCarousel");
  const monthLblEl=document.querySelector(".cal-month-lbl");
  const titleSpan=document.querySelector("[data-meals-title] > span");
  if(carEl){
    const selDate=new Date(dateKey+"T12:00:00");
    if(monthLblEl)monthLblEl.textContent=`${monthNames[selDate.getMonth()]} ${selDate.getFullYear()}`;
    const carouselDays=[];
    for(let off=-4;off<=4;off++){const dd=new Date(selDate);dd.setDate(selDate.getDate()+off);carouselDays.push(dd);}
    carEl.innerHTML=carouselDays.map(dd=>{const k=dd.toISOString().split("T")[0];const isSel=k===dateKey;const isTd=k===todayKey;return `<button class="cal-day ${isSel?"cal-day-sel":""} ${isTd?"cal-day-today":""}" data-caldate="${k}"><span class="cal-day-wd">${dayNamesShort[dd.getDay()]}</span><span class="cal-day-num">${dd.getDate()}</span>${isTd?`<span class="cal-day-dot"></span>`:""}</button>`;}).join("");
    carEl.querySelectorAll("[data-caldate]").forEach(b=>b.onclick=()=>switchCalDate(b.dataset.caldate));
    const sel=carEl.querySelector(".cal-day-sel");
    if(sel){carEl.scrollLeft=sel.offsetLeft-carEl.clientWidth/2+sel.clientWidth/2;}
    if(titleSpan){const mealsTitle=dateKey===todayKey?"REFEIÇÕES DE HOJE":`REFEIÇÕES · ${selDate.getDate()} ${monthNames[selDate.getMonth()].slice(0,3).toUpperCase()}`;titleSpan.textContent=mealsTitle;}
  }

  // Carrega dados em background
  let foods=[],mealCat={},mealCatNames={},waterMl=0,waterHistory=[];
  try{foods=await loadFoods(dateKey);mealCat=S.mealCat||{};mealCatNames=S.mealCatNames||{};}catch(e){}
  try{const w=await loadWater(dateKey);waterMl=w.ml;waterHistory=w.history;}catch(e){}
  if(S.calDate!==dateKey)return;
  S.foods=foods;S.mealCat=mealCat;S.mealCatNames=mealCatNames;
  S.waterMl=waterMl;S.waterHistory=waterHistory;
  // Atualiza só os elementos numéricos in-place
  updateCaloriasNumbersInPlace();
}

// Atualiza valores numéricos + lista de refeições + água, sem rerender geral
function updateCaloriasNumbersInPlace(){
  const tabPage=document.querySelector(".tab-page");
  if(!tabPage){r();return;}
  const cal=S.targetCal||0;
  const mp=Math.round(cal*0.3/4),mc2=Math.round(cal*0.45/4),mf2=Math.round(cal*0.25/9);
  let totalCal=0,totalP=0,totalC=0,totalF=0;
  S.foods.forEach(f=>{const a=calcAdj(f);totalCal+=a.cal;totalP+=a.p;totalC+=a.c;totalF+=a.f;});
  const pct=cal>0?Math.min((totalCal/cal)*100,100):0;
  // FX: bater meta de calorias pela primeira vez no dia (entre 95-105% da meta)
  const todayKey=new Date().toISOString().split("T")[0];
  if(S.calDate===todayKey&&cal>0&&!S._calGoalToday){
    const prevTotal=Number(S._calLastTotal)||0;
    if(prevTotal<cal*0.95&&totalCal>=cal*0.95&&totalCal<=cal*1.05){
      S._calGoalToday=true;
      try{FX.achievement();}catch(e){}
    }
  }
  S._calLastTotal=totalCal;
  // Anel principal — raio 84 (premium)
  const ring=tabPage.querySelector("#calRingCircle");
  if(ring){const R=84;ring.setAttribute("stroke-dashoffset",2*Math.PI*R*(1-pct/100));}
  const numEl=tabPage.querySelector("#calTotalNum");
  if(numEl)numEl.textContent=Math.round(totalCal);
  const remainEl=tabPage.querySelector("#calRemain");
  if(remainEl){const rem=Math.round(cal-totalCal);remainEl.textContent=rem>0?`faltam ${rem}`:rem===0?"meta atingida 🎯":`${-rem} acima`;}
  // Macros — mini-anéis
  const Rm=26,Cm=2*Math.PI*Rm;
  const setMacroRing=(letter,val,goal)=>{
    const mpct=goal>0?Math.min((val/goal)*100,100):0;
    const arc=tabPage.querySelector(`.dash-macro-arc[data-macro="${letter}"]`);
    if(arc)arc.style.strokeDashoffset=Cm*(1-mpct/100);
    const pctEl=arc?arc.closest(".dash-macro-ring")?.querySelector(".dash-macro-pct"):null;
    if(pctEl)pctEl.textContent=Math.round(mpct)+"%";
    const valEl=tabPage.querySelector(`#macroval-${letter}`);
    if(valEl)valEl.innerHTML=Math.round(val)+`<span class="dash-macro-goal">/${goal}g</span>`;
  };
  setMacroRing("P",totalP,mp);
  setMacroRing("C",totalC,mc2);
  setMacroRing("G",totalF,mf2);
  // Água (reconstrói o card)
  const w=tabPage.querySelector("[data-water-card]");
  if(w){
    const tmp=document.createElement("div");tmp.innerHTML=renderWaterCard();
    const newW=tmp.firstElementChild;
    w.replaceWith(newW);
    rebindWaterHandlers(tabPage);
  }
  // Lista de refeições + título (com botão Limpar)
  const titleEl=tabPage.querySelector("[data-meals-title]");
  if(titleEl){
    const todayKey=new Date().toISOString().split("T")[0];
    const monthNames=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    const selDate=new Date((S.calDate||todayKey)+"T12:00:00");
    const mealsTitle=S.calDate===todayKey?"REFEIÇÕES DE HOJE":`REFEIÇÕES · ${selDate.getDate()} ${monthNames[selDate.getMonth()].slice(0,3).toUpperCase()}`;
    titleEl.innerHTML=mealsTitleHTML(mealsTitle);
    rebindMealsHeaderHandlers(tabPage);
  }
  const foodsListEl=tabPage.querySelector("#foodsList");
  if(foodsListEl){
    foodsListEl.innerHTML=buildFoodsListHTML();
    rebindFoodsHandlers(tabPage);
  }

function rebindWaterHandlers(scope){
  const refreshWaterCard=()=>{const w=scope.querySelector("[data-water-card]");if(w){const tmp=document.createElement("div");tmp.innerHTML=renderWaterCard();w.replaceWith(tmp.firstElementChild);rebindWaterHandlers(scope);}};
  const addWater=ml=>{
    if(!ml||ml<=0)return;
    const goal=computeWaterGoal();
    const beforeMl=Number(S.waterMl)||0;
    S.waterMl=beforeMl+ml;
    S.waterHistory=normalizeWaterHistory(S.waterHistory);
    S.waterHistory.push({ml,at:new Date().toISOString()});
    saveWater(S.waterMl,S.waterHistory);
    if(beforeMl<goal&&S.waterMl>=goal)FX.success();else FX.waterDrop();
    refreshWaterCard();
  };
  scope.querySelectorAll(".water-btn[data-water]").forEach(b=>b.onclick=()=>{addWater(parseInt(b.dataset.water,10)||0);});
  // Quantidade manual em ml
  scope.querySelector("#bWaterManual")?.addEventListener("click",()=>{
    FX.tap();
    const ov=document.createElement("div");
    ov.className="cfm-ov";
    ov.innerHTML=`<div class="cfm-box" style="max-width:300px"><div class="cfm-title" style="margin-bottom:6px">Quantidade de água</div><div class="cfm-msg" style="margin-bottom:14px">Digite quantos ml você bebeu</div><div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><input id="wmInp" type="number" inputmode="numeric" placeholder="Ex: 250" style="flex:1;padding:13px;background:var(--bg3);border:1.5px solid var(--orange);border-radius:12px;color:var(--text);font-size:18px;font-weight:700;text-align:center;outline:none"/><span style="font-weight:700;color:var(--text2)">ml</span></div><div style="display:flex;gap:9px"><button class="cfm-cancel" id="wmCancel" style="flex:1">Cancelar</button><button class="cfm-ok" id="wmOk" style="flex:1">Adicionar</button></div></div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector("#wmInp");inp.focus();
    const close=()=>ov.remove();
    ov.onclick=e=>{if(e.target===ov)close();};
    ov.querySelector("#wmCancel").onclick=close;
    ov.querySelector("#wmOk").onclick=()=>{const v=parseInt(inp.value,10)||0;if(v>0){addWater(v);}close();};
    inp.onkeydown=e=>{if(e.key==="Enter")ov.querySelector("#wmOk").click();};
  });
  // Excluir um registro de água específico
  scope.querySelectorAll("[data-waterdel]").forEach(b=>b.onclick=()=>{
    const i=parseInt(b.dataset.waterdel,10);
    const h=normalizeWaterHistory(S.waterHistory);
    if(i<0||i>=h.length)return;
    const removed=h.splice(i,1)[0];
    S.waterHistory=h;
    S.waterMl=Math.max(0,(Number(S.waterMl)||0)-(removed.ml||0));
    saveWater(S.waterMl,S.waterHistory);
    FX.undo();
    refreshWaterCard();
  });
  scope.querySelector("#bWaterInfo")?.addEventListener("click",()=>{FX.open();S.modal="waterInfo";r();});
}

// Converte o histórico de água (pode ser array de números antigo OU objetos) para {ml,at}.
function normalizeWaterHistory(h){
  if(!Array.isArray(h))return [];
  return h.map(e=>typeof e==="number"?{ml:e,at:null}:{ml:Number(e.ml)||0,at:e.at||null});
}
// Formata um ISO/timestamp para "14:32".
function fmtLogTime(iso){try{const d=new Date(iso);return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}catch(e){return "";}}
function renderWaterCard(){
  const ml=Number(S.waterMl)||0;
  const goal=computeWaterGoal();
  const liters=(ml/1000).toFixed(ml>=1000?2:1);
  const goalL=(goal/1000).toFixed(1);
  const pct=Math.min((ml/goal)*100,100);
  // 8 "copos" visuais (cada um = goal/8 ml) p/ progresso intuitivo
  const cupSize=goal/8;
  const filledCups=Math.min(8,Math.floor(ml/cupSize));
  const partialCup=Math.min(1,(ml-filledCups*cupSize)/cupSize);
  const cups=[];
  for(let i=0;i<8;i++){
    let fill=0;
    if(i<filledCups)fill=1;
    else if(i===filledCups)fill=partialCup;
    cups.push(`<div class="water-cup"><div class="water-cup-fill" style="height:${fill*100}%"></div></div>`);
  }
  const status=pct>=100?"Meta atingida 🎉":pct>=75?"Quase lá":pct>=40?"Boa hidratação":pct>0?"Continue bebendo":"Comece a se hidratar";
  return `<div class="water-sec" data-water-card>
    <div class="water-sec-hdr">
      <div style="display:flex;align-items:center;gap:9px;min-width:0">
        <div class="water-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
        <div>
          <div class="dash-sec-lbl" style="color:#4FC3F7;margin:0">HIDRATAÇÃO</div>
          <div class="water-sec-amount"><span class="water-amount-v">${liters}</span><span class="water-amount-u">L</span><span class="water-sec-goal">de ${goalL}L</span></div>
        </div>
        <button id="bWaterInfo" title="Por que beber água?" class="water-info-btn">i</button>
      </div>
      <div class="water-status">${status}</div>
    </div>
    <div class="water-cups">${cups.join("")}</div>
    <div class="water-actions">
      <button class="water-btn" data-water="200">+200ml</button>
      <button class="water-btn" data-water="300">+300ml</button>
      <button class="water-btn" data-water="500">+500ml</button>
      <button class="water-btn water-btn-manual" id="bWaterManual" title="Quantidade personalizada">＋ml</button>
    </div>
    ${(()=>{const h=normalizeWaterHistory(S.waterHistory);if(!h.length)return "";return `<div class="water-log">${h.map((e,i)=>`<div class="water-log-row"><span class="water-log-ml">💧 ${e.ml}ml</span><span class="water-log-at">${e.at?fmtLogTime(e.at):""}</span><button class="water-log-del" data-waterdel="${i}" aria-label="Remover">×</button></div>`).join("")}</div>`;})()}
  </div>`;
}

function rCalorias(){
  const d=D("tab-page");

  S.foods.forEach(f=>{const a=calcAdj(f);totalCal+=a.cal;totalP+=a.p;totalC+=a.c;totalF+=a.f;});

      </div>
      <div class="cal-carousel" id="calCarousel">
        ${carouselDays.map(dd=>{const k=dd.toISOString().split("T")[0];const isSel=k===S.calDate;const isTd=k===todayKey;return `<button class="cal-day ${isSel?"cal-day-sel":""} ${isTd?"cal-day-today":""}" data-caldate="${k}"><span class="cal-day-wd">${dayNamesShort[dd.getDay()]}</span><span class="cal-day-num">${dd.getDate()}</span>${isTd?`<span class="cal-day-dot"></span>`:""}</button>`;}).join("")}
      </div>

  d.innerHTML=`
    <div class="tab-hdr"><div class="tab-title">Calorias</div></div>
    ${carouselHTML}

    <div class="dash">
      <div class="dash-glow"></div>

      <!-- ANEL DE CALORIAS -->
      <div class="dash-ring-section">
        <div class="cal-ring">
          <svg width="200" height="200" viewBox="0 0 200 200" style="transform:rotate(-90deg)">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">

            <circle id="calRingCircle" cx="100" cy="100" r="84" fill="none" stroke="url(#ringGrad)" stroke-width="15"
              stroke-dasharray="${2*Math.PI*84}" stroke-dashoffset="${2*Math.PI*84*(1-pct/100)}"
              stroke-linecap="round" style="transition:stroke-dashoffset 0.9s cubic-bezier(0.34,1.2,0.64,1)"/>
