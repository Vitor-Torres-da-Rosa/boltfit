// Apply light/dark theme
function applyTheme(){
  const isLight=S.darkMode===false;
  const root=document.documentElement;
  if(isLight){
    root.style.setProperty('--bg','#F5F5F5');
    root.style.setProperty('--bg2','#EBEBEB');
    root.style.setProperty('--bg3','#E0E0E0');
    root.style.setProperty('--bg4','#D5D5D5');
    root.style.setProperty('--text','#111111');
    root.style.setProperty('--text2','#444444');
    root.style.setProperty('--text3','#888888');
    root.style.setProperty('--border','#CCCCCC');
  }else{
    root.style.setProperty('--bg','#0D0D0D');
    root.style.setProperty('--bg2','#141414');
    root.style.setProperty('--bg3','#1C1C1C');
    root.style.setProperty('--bg4','#232323');
    root.style.setProperty('--text','#FFFFFF');
    root.style.setProperty('--text2','#AAAAAA');
    root.style.setProperty('--text3','#555555');
    root.style.setProperty('--border','#2A2A2A');
  }
}

async function authOk(user){
  S.user=user;

    const p=await loadProfile();

      S.phase='home';

  }catch(e){S.phase='onboard';}
  r();
}

function rOnboard(){

function obContent(step){

    </div>`;}

    const acts=[{v:'sed',e:'🪑',n:'Sedentário',d:'Trabalho de escritório'},{v:'light',e:'🚶',n:'Levemente ativo',d:'1-3 dias/semana'},{v:'mod',e:'🏃',n:'Moderado',d:'3-5 dias/semana'},{v:'active',e:'⚡',n:'Muito ativo',d:'6-7 dias intenso'},{v:'very',e:'🔥',n:'Extremamente ativo',d:'Atleta profissional'}];
    body=`<div class="opt-list">${acts.map(a=>`<div class="opt-row ${d.activity===a.v?'sel':''}" data-act="${a.v}"><span style="font-size:22px">${a.e}</span><div><div class="opt-row-name">${a.n}</div><div class="opt-row-desc">${a.d}</div></div></div>`).join('')}</div>`;}
  else if(step===4){body=`
    <div class="g3">
      <div class="opt-card ${d.goal==='lose'?'sel':''}" data-goal="lose" style="padding:18px 8px"><div style="font-size:44px">🫃</div><div style="font-weight:700;font-size:12px;margin-top:6px">EMAGRECER</div><div style="font-size:11px;color:#888">Déficit ~400 kcal</div></div>
      <div class="opt-card ${d.goal==='maintain'?'sel':''}" data-goal="maintain" style="padding:18px 8px"><div style="font-size:44px">❤️</div><div style="font-weight:700;font-size:12px;margin-top:6px">SAÚDE</div><div style="font-size:11px;color:#888">Manutenção</div></div>
      <div class="opt-card ${d.goal==='gain'?'sel':''}" data-goal="gain" style="padding:18px 8px"><div style="font-size:44px">💪</div><div style="font-weight:700;font-size:12px;margin-top:6px">GANHAR MASSA</div><div style="font-size:11px;color:#888">Superávit ~350 kcal</div></div>
    </div>`;}
  else if(step===5){body=`
    <div class="week-sel">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((w,i)=>`<button class="wpill ${d.trainDays.includes(i)?'sel':''}" data-day="${i}">${w}</button>`).join('')}</div>
    <p style="color:#888;font-size:13px;margin-top:12px">${d.trainDays.length} dia(s) selecionado(s)</p>`;}
  else if(step===6){
    const splits=['AB','ABC','ABCD','ABCDE','Full Body','Upper/Lower'];
    body=`<div class="g2">${splits.map(sp=>`<div class="opt-card ${d.split===sp?'sel':''}" data-split="${sp}" style="padding:14px"><div style="font-size:18px;font-weight:800">${sp}</div></div>`).join('')}</div>`;}
  return header+body;
}
function bindOb(d,step){
  d.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{S.onboard.data.sex=b.dataset.sex;d.querySelectorAll('[data-sex]').forEach(x=>x.classList.toggle('sel',x===b));});
  d.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{S.onboard.data.activity=b.dataset.act;d.querySelectorAll('[data-act]').forEach(x=>x.classList.toggle('sel',x===b));});
  d.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{S.onboard.data.goal=b.dataset.goal;d.querySelectorAll('[data-goal]').forEach(x=>x.classList.toggle('sel',x===b));});
  d.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>{S.onboard.data.split=b.dataset.split;d.querySelectorAll('[data-split]').forEach(x=>x.classList.toggle('sel',x===b));});
  d.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
    const i=parseInt(b.dataset.day);
    if(S.onboard.data.trainDays.includes(i))S.onboard.data.trainDays=S.onboard.data.trainDays.filter(x=>x!==i);
    else S.onboard.data.trainDays.push(i);
    b.classList.toggle('sel');
    const p=d.querySelector('p[style*="color:#888"]');if(p)p.textContent=`${S.onboard.data.trainDays.length} dia(s) selecionado(s)`;
  });
}
function collectOb(d,step){
  const v=id=>d.querySelector('#'+id)?.value||'';
  if(step===1&&v('f_age'))S.onboard.data.age=v('f_age');
  if(step===2){if(v('f_weight'))S.onboard.data.weight=v('f_weight');if(v('f_height'))S.onboard.data.height=v('f_height');}
}
function computeTMB(){
  const p=S.profile||S.onboard?.data;if(!p)return;
  const w=parseFloat(p.weight),h=parseFloat(p.height),a=parseFloat(p.age);if(!w||!h||!a)return;
  let bmr=p.sex==='M'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
  const acts={sed:1.2,light:1.375,mod:1.55,active:1.725,very:1.9};
  const tdee=bmr*(acts[p.activity]||1.55);
  S.tmb=Math.round(bmr);
  S.targetCal=p.goal==='lose'?Math.round(tdee-400):p.goal==='gain'?Math.round(tdee+350):Math.round(tdee);
  if(S.profile){S.profile.tmb=S.tmb;S.profile.targetCal=S.targetCal;}
}

function bindTab(d){
  // Agenda
  d.querySelector('#bAddFood')?.addEventListener('click',()=>{S.modal='food';r();});
  d.querySelectorAll('[data-assignday]').forEach(b=>b.onclick=()=>{S.modalCtx={day:parseInt(b.dataset.assignday)};S.modal='assignWorkout';r();});
  d.querySelectorAll('[data-editday]').forEach(b=>b.onclick=()=>{S.modalCtx={day:parseInt(b.dataset.editday)};S.modal='assignWorkout';r();});
  d.querySelectorAll('[data-playid]').forEach(b=>b.onclick=()=>{
    const w=S.workouts.find(x=>x.id===b.dataset.playid);
    if(w)startSession(w.exercises||[]);
  });
  // Treinos
  d.querySelector('#bNewWorkout')?.addEventListener('click',()=>{S.modal='newWorkout';S.modalCtx={};r();});
  d.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!confirm('Excluir treino?'))return;await deleteWorkout(b.dataset.del);S.workouts=S.workouts.filter(w=>w.id!==b.dataset.del);r();});
  d.querySelectorAll('[data-wid]').forEach(row=>row.onclick=e=>{
    if(e.target.closest('[data-del]'))return;
    const w=S.workouts.find(x=>x.id===row.dataset.wid);
    if(w){S.modal='addExercises';S.modalCtx={workout:w};r();}
  });
  // Exercicios - click for detail
  d.querySelectorAll('[data-exdetail]').forEach(row=>row.onclick=()=>{
    const ex=ALL_EX.find(e=>e.id===row.dataset.exdetail);
    if(ex){S.modal='exDetail';S.modalCtx={ex};r();}
  });
  const es=d.querySelector('#exSearch');if(es){es.oninput=e=>{S.exFilter=e.target.value;r();};}
  d.querySelectorAll('[data-mg]').forEach(b=>b.onclick=()=>{S.exGroup=b.dataset.mg;r();});
  // Perfil
  d.querySelector('#bSignOut')?.addEventListener('click',()=>{if(confirm('Sair da conta?'))signOut(auth).then(()=>{S={...S,user:null,profile:null,phase:'login',foods:[],workouts:[],schedule:{}};r();});});
  d.querySelector('#bEditProfile')?.addEventListener('click',()=>{S.phase='onboard';S.onboard={step:1,data:{...S.profile}};r();});
  d.querySelector('#bDarkToggle')?.addEventListener('click',()=>{
    S.darkMode=!(S.darkMode!==false);
    applyTheme();r();
  });
  d.querySelector('#bNotifSettings')?.addEventListener('click',async()=>{
    if(!('Notification' in window)){alert('Seu navegador não suporta notificações.');return;}
    const perm=await Notification.requestPermission();
    if(perm==='granted'){new Notification('BoltFit ⚡',{body:'Notificações ativadas! Te lembraremos de treinar.',icon:'/manifest.json'});}
    else if(perm==='denied'){alert('Notificações bloqueadas. Habilite nas configurações do navegador.');}
  });
}

function rAddExercisesModal(){
  const w=S.modalCtx?.workout;if(!w)return D('');

  let localFilter='';
  let localGroup='';
  const getFiltered=()=>ALL_EX.filter(e=>{
    const gOk=!localGroup||e.group===localGroup;

  });
  const d=D('overlay');
  const render=()=>{
    const f=getFiltered();
    d.innerHTML=`<div class="modal-sheet modal-full">
      <div class="modal-handle"></div>
      <div class="modal-hdr">
        <div>
          <div class="modal-title">Adicionar exercício</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">${w.name}</div>
        </div>
        <button class="close-x" id="bClose2">✕</button>
      </div>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>

        <button class="mf ${!localGroup?'mf-active':''}" data-lg="">Todos</button>
        ${MUSCLE_GROUPS.map(mg=>`<button class="mf ${localGroup===mg.id?'mf-active':''}" data-lg="${mg.id}" style="${localGroup===mg.id?`color:${mg.color};background:${mg.bg};border-color:${mg.color}`:''}">${mg.name}</button>`).join('')}
      </div>
      ${picked.length>0?`<div class="picked-bar"><span style="font-size:12px;color:var(--text3)">${picked.length} selecionado(s):</span>${picked.map((e,i)=>`<span class="picked-pill">${i+1}.${e.name.split(' ')[0]}</span>`).join('')}</div>`:''}
      <div class="ex-add-list">
        ${f.map(e=>{
          const isPicked=picked.find(p=>p.id===e.id);
          const mc=MUSCLE_COLORS[e.group]||{name:e.group,color:'#888',bg:'rgba(136,136,136,0.15)'};
          return `<div class="ex-add-row">
            <div class="ex-add-thumb">
              <img src="${gifUrl(e.id)}" alt="${e.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:10px" onerror="this.style.display='none';this.parentNode.style.background='var(--bg3)'"/>
            </div>
            <div class="ex-add-info">
              <div class="ex-add-name">${e.name}</div>
              <div class="ex-add-tags"><span class="ex-tag" style="color:${mc.color};background:${mc.bg}">${mc.name}</span><span class="ex-add-eq"> · ${e.eq}</span></div>
            </div>
            <button class="ex-add-btn ${isPicked?'ex-added':''}" data-eid="${e.id}">${isPicked?'✓':'+' }</button>
          </div>`;
        }).join('')}
      </div>
      <div style="padding:12px 0 0"><button class="btn-primary" id="bSaveEx" style="${picked.length===0?'opacity:0.5':''}">Salvar (${picked.length} exercício${picked.length!==1?'s':''})</button></div>
    </div>`;
    d.querySelector('#bClose2').onclick=()=>{S.modal=null;S.modalCtx=null;r();};
    d.onclick=e=>{if(e.target===d){S.modal=null;S.modalCtx=null;r();}};
    const ps=d.querySelector('#exPSearch');
    if(ps){ps.oninput=e=>{localFilter=e.target.value;render();};setTimeout(()=>ps.focus(),100);}
    d.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{localGroup=b.dataset.lg;render();});
    d.querySelectorAll('[data-eid]').forEach(btn=>btn.onclick=e=>{
      e.stopPropagation();
      const id=btn.dataset.eid;const ex=ALL_EX.find(e=>e.id===id);if(!ex)return;
      if(picked.find(p=>p.id===id))picked=picked.filter(p=>p.id!==id);else picked.push(ex);
      render();
    });
    d.querySelector('#bSaveEx').onclick=async()=>{
      w.exercises=picked;
      const updated={...w};
      await setDoc(doc(db,'users',uid(),'workouts',w.id),updated);
      S.workouts=S.workouts.map(x=>x.id===w.id?updated:x);
      S.modal=null;S.modalCtx=null;r();
    };
  };
  render();
  return d;
}

    if(!S.schedule)S.schedule={};
    S.schedule[day]={id:w.id,name:w.name,letter:w.letter||w.name[0]};
    await saveSchedule(S.schedule);S.modal=null;r();
  });
  return d;
}

// ── SESSION ──
function startSession(exercises){
  if(!exercises?.length)return alert('Adicione exercícios ao treino primeiro!');
  clearInterval(restTimer);
  S.session={exercises,idx:0,sets:exercises.map(e=>Array.from({length:e.sets||3},()=>({reps:String(e.reps||'10').split('-')[0],weight:e.weight||0,done:false}))),restActive:false,restLeft:0,restTotal:0};
  r();
}
function rSession(){
  const{exercises,idx,sets}=S.session;
  const ex=exercises[idx];
  if(!ex){
    clearInterval(restTimer);
    const d=D('full-page');
    d.innerHTML=`<div class="session-done"><div style="font-size:80px">🏆</div><div class="done-title">TREINO CONCLUÍDO!</div><div class="done-sub">${exercises.length} exercícios · ${sets.flat().filter(s=>s.done).length} séries</div><button class="btn-primary" id="bEnd" style="max-width:260px;margin:0 auto">Finalizar</button></div>`;
    d.querySelector('#bEnd').onclick=()=>{S.session=null;r();};
    return d;
  }
  const mc=MUSCLE_COLORS[ex.group]||{color:'var(--orange)'};
  const prog=Math.round((idx/exercises.length)*100);
  const d=D('full-page');
  d.innerHTML=`
    <div class="session-wrap">
      <div class="session-header">
        <button class="back-x" id="bExitSession">✕</button>
        <div style="flex:1">
          <div class="session-eyebrow">EXERCÍCIO ${idx+1}/${exercises.length}</div>
          <div class="session-title">${ex.name}</div>
        </div>
      </div>
      <div class="session-prog"><div class="session-prog-fill" style="width:${prog}%"></div></div>
      <div class="session-body">
        <div class="ex-hero-box">
          <div class="ex-hero-media">
            <div class="ex-hero-gif">
              <img src="${gifUrl(ex.id)}" alt="${ex.name}" style="width:100%;height:100%;object-fit:cover;border-radius:14px" onerror="this.parentNode.innerHTML='<div style=\'display:flex;align-items:center;justify-content:center;height:100%;font-size:40px;color:var(--text3)\'>🏋️</div>'"/>
            </div>
            <div class="ex-hero-muscle-map">
              ${muscleSVG(ex.group)}
            </div>
          </div>
          <div class="ex-hero-name">${ex.name}</div>
          <div class="ex-hero-muscles" style="color:${mc.color}">${ex.muscles_pt||ex.group}</div>
        </div>
        <div class="ex-3stats">
          <div class="ex-stat"><div class="es-val">${sets[idx].length}</div><div class="es-lbl">SÉRIES</div></div>
          <div class="ex-stat"><div class="es-val">${ex.reps||'10'}</div><div class="es-lbl">REPS</div></div>
          <div class="ex-stat"><div class="es-val">${ex.rest||60}s</div><div class="es-lbl">DESCANSO</div></div>
        </div>
        ${S.session.restActive?`
          <div class="rest-card">
            <div class="rest-label">DESCANSO</div>
            <div class="rest-val" id="rVal">${fmt(S.session.restLeft)}</div>
            <div class="rest-bar"><div class="rest-fill" id="rFill" style="width:${((S.session.restTotal-S.session.restLeft)/S.session.restTotal)*100}%"></div></div>
            <button class="btn-sec" id="bSkipRest" style="margin-top:10px;width:100%">Pular descanso</button>
          </div>`:``}
        <div class="sets-block">
          <div class="sets-hdr"><span>SÉRIE</span><span>REPS</span><span>PESO (kg)</span><span></span></div>
          ${sets[idx].map((s,si)=>`
            <div class="set-row">
              <div class="set-n">S${si+1}</div>
              <input class="set-inp" data-si="${si}" data-f="reps" type="number" value="${s.reps}"/>
              <input class="set-inp" data-si="${si}" data-f="weight" type="number" value="${s.weight}"/>
              <div class="set-chk ${s.done?'chk-done':''}" data-si="${si}">${s.done?'✓':''}</div>
            </div>`).join('')}
          <div class="set-controls">
            <button class="set-ctrl-btn" id="bAddSet">+ Adicionar série</button>
            ${sets[idx].length>1?`<button class="set-ctrl-btn set-ctrl-del" id="bRemSet">- Remover série</button>`:''}
          </div>
        </div>
        <div class="session-acts">
          ${sets[idx].every(s=>s.done)?`<button class="btn-primary" id="bNextEx">${idx<exercises.length-1?'Próximo exercício →':'Finalizar treino 🏆'}</button>`:''}
          <button class="btn-sec" id="bSkipEx" style="width:100%">Pular exercício</button>
        </div>
      </div>
    </div>`;
  d.querySelector('#bExitSession').onclick=()=>{if(confirm('Sair do treino?')){clearInterval(restTimer);S.session=null;r();}};
  d.querySelectorAll('.set-inp').forEach(inp=>inp.oninput=e=>{S.session.sets[idx][parseInt(inp.dataset.si)][inp.dataset.f]=e.target.value;});
  d.querySelectorAll('.set-chk').forEach(btn=>btn.onclick=()=>{
    const si=parseInt(btn.dataset.si);
    S.session.sets[idx][si].done=!S.session.sets[idx][si].done;
    if(S.session.sets[idx][si].done&&!S.session.restActive){
      clearInterval(restTimer);S.session.restActive=true;
      S.session.restLeft=ex.rest||60;S.session.restTotal=ex.rest||60;
      restTimer=setInterval(()=>{
        S.session.restLeft--;
        const rv=document.getElementById('rVal'),rf=document.getElementById('rFill');
        if(rv)rv.textContent=fmt(S.session.restLeft);
        if(rf)rf.style.width=`${((S.session.restTotal-S.session.restLeft)/S.session.restTotal)*100}%`;
        if(S.session.restLeft<=0){clearInterval(restTimer);S.session.restActive=false;r();}
      },1000);
    }
    r();
  });
  const bn=d.querySelector('#bNextEx');if(bn)bn.onclick=()=>{clearInterval(restTimer);S.session.restActive=false;S.session.idx++;r();};
  const bse=d.querySelector('#bSkipEx');if(bse)bse.onclick=()=>{clearInterval(restTimer);S.session.restActive=false;S.session.idx++;r();};
  const bsr=d.querySelector('#bSkipRest');if(bsr)bsr.onclick=()=>{clearInterval(restTimer);S.session.restActive=false;r();};
  const bAddSet=d.querySelector('#bAddSet');if(bAddSet)bAddSet.onclick=()=>{
    const last=S.session.sets[idx][S.session.sets[idx].length-1];
    S.session.sets[idx].push({reps:last?.reps||'10',weight:last?.weight||0,done:false});r();
  };
  const bRemSet=d.querySelector('#bRemSet');if(bRemSet)bRemSet.onclick=()=>{
    if(S.session.sets[idx].length>1){S.session.sets[idx].pop();r();}
  };
  return d;
}
function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}

// ── UTILS ──
function D(cls){const e=document.createElement('div');e.className=cls;return e;}

// ── BOOT ──
applyTheme();
r();
(async()=>{
  try{const res=await getRedirectResult(auth);if(res?.user)await authOk(res.user);}catch(e){}
  onAuthStateChanged(auth,async user=>{
    if(S.phase==='home'||S.phase==='onboard')return;
    if(user)await authOk(user);else{S.phase='login';r();}
  });
  setTimeout(()=>{if(S.phase==='splash'){S.phase='login';r();}},4000);
})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
