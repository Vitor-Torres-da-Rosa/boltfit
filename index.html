  d.querySelectorAll("[data-addcat]").forEach(b=>b.onclick=()=>{FX.tap();S.pendingMealCat=b.dataset.addcat;S.foodModalMode="add";S.foodAddStep="picker";S.modal="food";r();});
  d.querySelectorAll("[data-newcat]").forEach(b=>b.onclick=()=>{FX.tap();S.pendingMealCat=b.dataset.newcat;S.foodModalMode="add";S.foodAddStep="picker";S.modal="food";r();});
  d.querySelectorAll(".meal-rename-btn").forEach(btn=>btn.onclick=async e=>{
    e.stopPropagation();
    const catId=btn.dataset.rename;
    const current=btn.dataset.current;
    // Custom modal instead of ugly prompt()
    const ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px";
    ov.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:360px">
      <div style="font-weight:800;font-size:18px;margin-bottom:4px;color:var(--text)">Renomear refeição</div>
      <div style="font-size:13px;color:var(--text3);margin-bottom:16px">Digite o novo nome desta categoria</div>
      <input id="rcInp" value="${(current||"").replace(/"/g,"&quot;")}" style="width:100%;padding:14px;background:var(--bg3);border:1.5px solid var(--orange);border-radius:12px;color:var(--text);font-size:16px;font-weight:600;outline:none;margin-bottom:18px"/>
      <div style="display:flex;gap:10px">
        <button id="rcCancel" style="flex:1;padding:13px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-weight:700;cursor:pointer">Cancelar</button>
        <button id="rcOk" style="flex:1;padding:13px;background:var(--orange);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer">Salvar</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector("#rcInp");
    inp.focus();inp.select();
    ov.onclick=ev=>{if(ev.target===ov)ov.remove();};
    ov.querySelector("#rcCancel").onclick=()=>ov.remove();
    ov.querySelector("#rcOk").onclick=async()=>{
      const newName=inp.value;
      if(newName&&newName.trim()){
        if(!S.mealCatNames)S.mealCatNames={};
        S.mealCatNames[catId]=newName.trim();
        await saveFoods(S.foods);
        ov.remove();
        r();
      }else{ov.remove();}
    };
    inp.onkeydown=ev=>{if(ev.key==="Enter")ov.querySelector("#rcOk").click();};
  });

  // Delete food
  d.querySelectorAll(".fi-del").forEach(b=>b.onclick=async()=>{
    const i=parseInt(b.dataset.fi);
    S.foods.splice(i,1);
    // Rebuild mealCat with shifted indices
    const newMC={};
    Object.entries(S.mealCat||{}).forEach(([k,v])=>{
      const ki=parseInt(k);
      if(ki<i)newMC[ki]=v;
      else if(ki>i)newMC[ki-1]=v;
    });
    S.mealCat=newMC;
    await saveFoods(S.foods);
    r();
  });

  // Grams update — NO re-render, update inline + update totals
  const updateRow=(i)=>{
    const f=S.foods[i];if(!f)return;
    const a=calcAdj(f);
    const inp=d.querySelector(`.fi-grams[data-fi="${i}"]`);
    const calEl=d.querySelector(`#fical_${i}`);
    const macEl=d.querySelector(`#fimac_${i}`);
    const u=foodUnit(f.n);
    if(inp){
      if(u){const units=Math.max(1,Math.round(a.grams/u.g));inp.value=units;const lbl=inp.parentElement.querySelector("span");if(lbl)lbl.textContent=`${units===1?u.sing:u.plur} · ${a.grams}g`;}
      else inp.value=a.grams;
    }
    if(calEl)calEl.textContent=a.cal+" kcal";
    if(macEl)macEl.textContent=`P:${a.p}g · C:${a.c}g · G:${a.f}g`;
    // Update group calorie header
    const mc=S.mealCat?.[i]||"sem_categoria";
    const groupItems=S.foods.map((f2,i2)=>({f:f2,i:i2})).filter(x=>(S.mealCat?.[x.i]||"sem_categoria")===mc);
    const groupCal=groupItems.reduce((s,{f:f2})=>s+calcAdj(f2).cal,0);
    const groupHdrEls=d.querySelectorAll(`[data-mcid="${mc}"] span:last-child`);
    groupHdrEls.forEach(el=>el.textContent=groupCal+" kcal");
    updateCalTotals(d);
  };

  d.querySelectorAll(".fi-grams").forEach(inp=>inp.addEventListener("input",async e=>{
    const i=parseInt(inp.dataset.fi);
    const ug=parseFloat(inp.dataset.unit);
    const v=parseFloat(e.target.value)||1;
    S.foods[i].grams=ug?Math.max(1,Math.round(v))*ug:(v||1);
    updateRow(i);
    await saveFoods(S.foods);
  }));
  d.querySelectorAll(".fi-grams-btn").forEach(btn=>btn.addEventListener("click",async()=>{
    const i=parseInt(btn.dataset.fi);const dir=parseInt(btn.dataset.dir);
    const ug=parseFloat(btn.dataset.unit);
    const cur=S.foods[i].grams||S.foods[i].serving||100;
    if(ug){const units=Math.max(1,Math.round(cur/ug)+dir);S.foods[i].grams=units*ug;}
    else S.foods[i].grams=Math.max(1,cur+(dir*10));
    updateRow(i);
    await saveFoods(S.foods);
  }));
  return d;
}

function rExercicios(){
  const d=D("tab-page");
  if(!S.exEquip)S.exEquip="";
  if(S.exFilter===undefined)S.exFilter="";
  const eqIcon=eq=>({"Barra":"🏋️","Halteres":"💪","Polia":"🔗","Máquina":"⚙️","Peso Corporal":"🤸"})[eq]||"🏷️";
  const MGROUPS=Object.entries(MUSCLE_META).map(([id,v])=>{
    const list=ALL_EX.filter(e=>e.group===id);
    return {id,...v,count:list.length,cover:list[0]?gifUrl(list[0].id):""};
  });
  const EQUIPS=[...new Set(ALL_EX.map(e=>e.eq))];

  const filterList=()=>{
    const q=(S.exFilter||"").trim().toLowerCase();
    return ALL_EX.filter(e=>{
      const gOk=!S.exGroup||e.group===S.exGroup;
      const eqOk=!S.exEquip||e.eq===S.exEquip;
      const sOk=!q||e.name.toLowerCase().includes(q)||e.muscles.toLowerCase().includes(q);
      return gOk&&eqOk&&sOk;
    });
  };

  const rowHTML=(e,showGroup=true)=>{
    const m=MUSCLE_META[e.group]||{label:e.group,color:"#888",bg:"rgba(136,136,136,0.15)"};
    return `<div class="exv2-row" data-exd="${e.id}">
      <div class="exv2-thumb" style="--mc:${m.color}">
        <img src="${gifUrl(e.id)}" loading="lazy" alt="" onload="this.classList.add('ld')" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
        <div class="exv2-thumb-fb">${noImgHTML(true)}</div>
      </div>
      <div class="exv2-info">
        <div class="exv2-nm">${e.name}</div>
        <div class="exv2-mus">${e.muscles}</div>
        <div class="exv2-meta">
          ${showGroup?`<span class="exv2-pill" style="color:${m.color};background:${m.bg}">${m.label}</span>`:""}
          <span class="exv2-pill exv2-pill-eq">${eqIcon(e.eq)} ${e.eq}</span>
          <span class="exv2-pill exv2-pill-eq">${e.sets}×${e.reps}</span>
        </div>
      </div>
      <div class="exv2-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>`;
  };

  const gridHTML=()=>`
    <div class="exv2-sec-lbl">EXPLORAR POR GRUPO MUSCULAR</div>
    <div class="exv2-grid">
      ${MGROUPS.map((m,i)=>`<div class="exv2-card" data-mg="${m.id}" style="--mc:${m.color};animation-delay:${i*0.035}s">
        <img src="${m.cover}" loading="lazy" alt="" onload="this.classList.add('ld')" onerror="this.classList.remove('ld')"/>
        <div class="exv2-card-shade"></div>
        <div class="exv2-card-glow"></div>
        <div class="exv2-card-bottom">
          <div class="exv2-card-ttl">${m.label.charAt(0)+m.label.slice(1).toLowerCase()}</div>
          <div class="exv2-card-ct">${m.count} exercícios</div>
        </div>
      </div>`).join("")}
    </div>`;

  const headerHTML=()=>{
    const q=(S.exFilter||"").trim();
    if(S.exGroup&&!q){
      const m=MUSCLE_META[S.exGroup]||{label:S.exGroup,color:"#888",bg:"rgba(136,136,136,0.15)"};
      const total=ALL_EX.filter(e=>e.group===S.exGroup).length;
      return `<div class="exv2-grp-hdr">
        <button class="exv2-back" id="exBack" aria-label="Voltar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <div>
          <div class="exv2-grp-ttl" style="color:${m.color}">${m.label.charAt(0)+m.label.slice(1).toLowerCase()}</div>
          <div class="exv2-grp-sub">${total} ${total===1?"exercício":"exercícios"} disponíveis</div>
        </div>
        <div class="exv2-grp-ic" style="background:${m.bg}">${muscleSVG(S.exGroup,m.color)}</div>
      </div>`;
    }
    return `<div class="ex-hero" style="padding-bottom:4px">
      <div class="ex-hero-title">Exercícios</div>
      <div class="ex-hero-sub">${ALL_EX.length} movimentos · biblioteca completa</div>
    </div>`;
  };

  const bodyHTML=()=>{
    const q=(S.exFilter||"").trim();
    const browsing=S.exGroup||q;
    if(!browsing)return gridHTML();
    const list=filterList();
    const eqRow=`<div class="eqfilters" style="padding:0 0 12px">
      <button class="eqf ${!S.exEquip?"eqf-on":""}" data-eq="">Todos</button>
      ${EQUIPS.map(eq=>`<button class="eqf ${S.exEquip===eq?"eqf-on":""}" data-eq="${eq}">${eqIcon(eq)} ${eq}</button>`).join("")}
    </div>`;
    return `${eqRow}
      <div class="exv2-count">${list.length} ${list.length===1?"resultado":"resultados"}${q?` para "${q.replace(/</g,"&lt;")}"`:""}</div>
      ${list.length===0
        ?`<div class="empty" style="padding:48px 0;text-align:center"><div style="font-size:44px;opacity:0.5">🔍</div><p style="margin-top:10px;font-weight:700">Nenhum exercício encontrado</p><p style="font-size:13px;color:var(--text3);margin-top:4px">Tente outro termo ou remova os filtros</p><button class="eqf" id="exClear" style="margin-top:14px;color:var(--orange);border-color:var(--orange)">Limpar filtros</button></div>`
        :`<div class="list-body">${list.map(e=>rowHTML(e,!S.exGroup)).join("")}</div>`}`;
  };

  d.innerHTML=`
    <div id="exHead"></div>
    <div class="exv2-search-wrap">
      <div class="search-box exv2-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text3);flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-inp" id="exS" placeholder="Buscar exercício ou músculo..." value="${(S.exFilter||"").replace(/"/g,"&quot;")}" autocomplete="off"/>
        <button id="exSX" class="exv2-search-x" style="display:${S.exFilter?"flex":"none"}" aria-label="Limpar busca">✕</button>
      </div>
    </div>
    <div id="exBody" class="exv2-body"></div>`;

  const bind=()=>{
    d.querySelectorAll(".exv2-card").forEach(c=>c.onclick=()=>{FX.tap();S.exGroup=c.dataset.mg;S.exEquip="";paint();});
    d.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>{FX.tap();S.exEquip=b.dataset.eq;paint(false);});
    d.querySelectorAll("[data-exd]").forEach(row=>row.onclick=()=>{FX.tapSoft();const ex=ALL_EX.find(e=>e.id===row.dataset.exd);if(ex){S.modal="exDetail";S.mCtx={ex};r();}});
    const back=d.querySelector("#exBack");if(back)back.onclick=()=>{FX.tap();S.exGroup="";S.exEquip="";paint();};
    const clr=d.querySelector("#exClear");if(clr)clr.onclick=()=>{FX.tap();S.exFilter="";S.exEquip="";const i=d.querySelector("#exS");if(i)i.value="";const x=d.querySelector("#exSX");if(x)x.style.display="none";paint();};
  };
  const paint=(scrollTop=true)=>{
    d.querySelector("#exHead").innerHTML=headerHTML();
    d.querySelector("#exBody").innerHTML=bodyHTML();
    bind();
    if(scrollTop){const sc=d.closest(".tab-scroll")||d.parentElement;try{(sc||window).scrollTo({top:0,behavior:"instant"});}catch(_){}}
  };
  paint(false);

  const inp=d.querySelector("#exS");
  inp.addEventListener("input",()=>{
    S.exFilter=inp.value;
    const x=d.querySelector("#exSX");if(x)x.style.display=S.exFilter?"flex":"none";
    paint(false);
  });
  d.querySelector("#exSX").onclick=()=>{FX.tap();S.exFilter="";inp.value="";d.querySelector("#exSX").style.display="none";paint(false);inp.focus();};
  return d;
}

      <input id="nmInp" value="${(p?.fullName||name).replace(/"/g,"&quot;")}" maxlength="40" style="width:100%;padding:14px;background:var(--bg3);border:1.5px solid var(--orange);border-radius:12px;color:var(--text);font-size:16px;font-weight:600;outline:none;margin-bottom:18px"/>
      <div style="display:flex;gap:10px">
        <button id="nmCancel" style="flex:1;padding:13px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-weight:700;cursor:pointer">Cancelar</button>
        <button id="nmOk" style="flex:1;padding:13px;background:var(--orange);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer">Salvar</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector("#nmInp");inp.focus();inp.select();
    ov.onclick=e=>{if(e.target===ov)ov.remove();};
    ov.querySelector("#nmCancel").onclick=()=>ov.remove();
    ov.querySelector("#nmOk").onclick=async()=>{
      const v=inp.value.trim();
      if(!v){ov.remove();return;}
      S.profile.fullName=v;S.profile.name=v;
      try{await saveProfile(S.profile);indexUser();}catch(e){}
      ov.remove();r();
    };
    inp.onkeydown=e=>{if(e.key==="Enter")ov.querySelector("#nmOk").click();};
  });
  d_.querySelector("#bEditUsername")?.addEventListener("click",()=>{
    const ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px";
    ov.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:360px">
      <div style="font-weight:800;font-size:18px;margin-bottom:4px;color:var(--text)">Nome de usuário</div>
      <div style="font-size:13px;color:var(--text3);margin-bottom:16px">Aparece nos alimentos que você criar</div>
      <input id="unInp" value="${(p?.username||name).replace(/"/g,"&quot;")}" maxlength="24" style="width:100%;padding:14px;background:var(--bg3);border:1.5px solid var(--orange);border-radius:12px;color:var(--text);font-size:16px;font-weight:600;outline:none;margin-bottom:18px"/>
      <div style="display:flex;gap:10px">
        <button id="unCancel" style="flex:1;padding:13px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-weight:700;cursor:pointer">Cancelar</button>
        <button id="unOk" style="flex:1;padding:13px;background:var(--orange);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer">Salvar</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector("#unInp");inp.focus();inp.select();
    ov.onclick=e=>{if(e.target===ov)ov.remove();};
    ov.querySelector("#unCancel").onclick=()=>ov.remove();
    ov.querySelector("#unOk").onclick=async()=>{
      const v=inp.value.trim();
      if(!v){ov.remove();return;}
      S.profile.username=v;
      try{await saveProfile(S.profile);indexUser();}catch(e){}
      ov.remove();r();
    };
    inp.onkeydown=e=>{if(e.key==="Enter")ov.querySelector("#unOk").click();};
  });
  // Edit avatar (photo) — stored as base64 in profile
  const avInput=d_.querySelector("#avatarInput");
  d_.querySelector("#bEditAvatar")?.addEventListener("click",()=>avInput?.click());
  if(avInput)avInput.onchange=async e=>{
    const file=e.target.files?.[0];if(!file)return;
    if(file.size>2*1024*1024){toast("Imagem muito grande. Escolha uma foto menor que 2MB.","error");return;}
    try{
      // Resize to keep storage small
      const dataUrl=await new Promise((res,rej)=>{
        const reader=new FileReader();
        reader.onload=()=>{
          const img=new Image();
          img.onload=()=>{
            const size=256;const canvas=document.createElement("canvas");canvas.width=size;canvas.height=size;
            const ctx=canvas.getContext("2d");
            const min=Math.min(img.width,img.height);
            ctx.drawImage(img,(img.width-min)/2,(img.height-min)/2,min,min,0,0,size,size);
            res(canvas.toDataURL("image/jpeg",0.8));
          };
          img.onerror=rej;img.src=reader.result;
        };
        reader.onerror=rej;reader.readAsDataURL(file);
      });
      S.profile.avatar=dataUrl;
      await saveProfile(S.profile);
      r();
    }catch(err){toast("Erro ao carregar a foto. Tente outra.","error");}
  };
  d_.querySelector("#bDarkToggle")?.addEventListener("click",async()=>{
    S.darkMode=S.darkMode===false?true:false;
    applyTheme();
    // Update toggle visual without full re-render
    const tog=d_.querySelector("#bDarkToggle");
    if(tog){
      tog.classList.toggle("on",S.darkMode!==false);
      tog.style.background=S.darkMode===false?"#666":"var(--orange)";
      const knob=tog.querySelector("div");
      if(knob)knob.style.transform=`translateX(${S.darkMode===false?"0":"20px"})`;
    }
    // Persistir preferência no perfil
    if(S.profile){S.profile.darkMode=S.darkMode;try{await saveProfile(S.profile);}catch(e){}}
  });
  // Toggle SOM
  d_.querySelector("#bSoundToggle")?.addEventListener("click",async()=>{
    if(!S.profile)S.profile={};
    const newVal=S.profile.sound===false; // se está off, liga
    S.profile.sound=newVal;
    const tog=d_.querySelector("#bSoundToggle");
    if(tog){
      tog.style.background=newVal?"var(--orange)":"#666";
      const knob=tog.querySelector("div");if(knob)knob.style.transform=`translateX(${newVal?"20px":"0"})`;
    }
    if(newVal)FX.tapSoft(); // toca um som pra confirmar que ligou
    try{await saveProfile(S.profile);}catch(e){}
  });
  // Toggle VIBRAÇÃO
  d_.querySelector("#bHapticToggle")?.addEventListener("click",async()=>{
    if(!S.profile)S.profile={};
    const newVal=S.profile.haptic===false; // se está off, liga
    S.profile.haptic=newVal;
    const tog=d_.querySelector("#bHapticToggle");
    if(tog){
      tog.style.background=newVal?"var(--orange)":"#666";
      const knob=tog.querySelector("div");if(knob)knob.style.transform=`translateX(${newVal?"20px":"0"})`;
    }
    if(newVal){try{if(navigator.vibrate)navigator.vibrate(20);}catch(e){}}
    try{await saveProfile(S.profile);}catch(e){}
  });
  d_.querySelector("#bNotif")?.addEventListener("click",async()=>{if(!("Notification"in window))return toast("Navegador não suporta notificações.");const pp=await Notification.requestPermission();if(pp==="granted")new Notification("BoltFit ⚡",{body:"Notificações ativadas!"});else toast("Notificações bloqueadas nas configurações do navegador.");});
  return d;
}

// MODALS — rendered in #modalRoot (full screen, no 430px limit)
// ═══════════════════════════════════════════
function closeModal(refresh=false){
  try{FX.close();}catch(e){}
  const sheet=document.querySelector(".modal-sheet");
  const overlay=document.querySelector(".overlay");
  const finish=()=>{
    S.modal=null;S.mCtx=null;
    if(refresh){r();}
    else{document.getElementById("modalRoot").innerHTML="";_renderedModalKey="";}
  };
  if(sheet&&overlay){sheet.classList.add("closing");overlay.classList.add("closing");setTimeout(finish,280);}
  else finish();
}

function sheet(title,subtitle,html,onClose){
  const d=D("overlay");
  d.innerHTML=`<div class="modal-sheet"><div class="modal-handle"></div><div class="modal-hdr"><div><div class="modal-title">${title}</div>${subtitle?`<div class="modal-sub">${subtitle}</div>`:""}</div><button class="close-x" id="bCloseModal">✕</button></div>${html}</div>`;
  d.querySelector("#bCloseModal").onclick=()=>{if(onClose)onClose();else closeModal();};
  d.onclick=e=>{if(e.target===d){if(onClose)onClose();else closeModal();}};
  return d;
}

// ─── SUPORTE (usuário) ───
function rSupportModal(){
  let photoData=null;
  let sending=false;
  const d=sheet("🛟 Suporte","Fale com a equipe do BoltFit",`
    <div class="sup-intro">Encontrou um erro ou tem uma dúvida? Descreva abaixo. Você pode anexar uma foto para nos ajudar a entender.</div>
    <label class="sec-lbl" style="margin-bottom:6px">SUA MENSAGEM</label>
    <textarea id="supMsg" class="sup-ta" placeholder="Descreva o problema ou sua dúvida..." rows="5"></textarea>
    <div class="sup-photo-row">
      <label class="sup-photo-btn" id="supPhotoLbl">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        Anexar foto
        <input type="file" accept="image/*" id="supPhoto" style="display:none"/>
      </label>
      <div id="supPreview" class="sup-preview" style="display:none"><img id="supPrevImg" alt=""/><button id="supPrevX" aria-label="Remover">✕</button></div>
    </div>
    <button class="btn-primary" id="supSend" style="margin-top:16px">Enviar mensagem</button>
    <div id="supMyTickets" style="margin-top:22px"></div>
  `);
  const fileInp=d.querySelector("#supPhoto");
  const prev=d.querySelector("#supPreview");
  const prevImg=d.querySelector("#supPrevImg");
  fileInp.addEventListener("change",e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        // reduzir mantendo legível: máx 900px no maior lado, JPEG 0.6
        const max=900;let{width:w,height:h}=img;
        if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        photoData=cv.toDataURL("image/jpeg",0.6);
        prevImg.src=photoData;prev.style.display="flex";
        d.querySelector("#supPhotoLbl").style.display="none";
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  d.querySelector("#supPrevX").onclick=()=>{photoData=null;prev.style.display="none";fileInp.value="";d.querySelector("#supPhotoLbl").style.display="flex";};
  d.querySelector("#supSend").onclick=async()=>{
    if(sending)return;
    const msg=d.querySelector("#supMsg").value.trim();
    if(!msg){toast("Escreva sua mensagem primeiro.");return;}
    sending=true;const btn=d.querySelector("#supSend");btn.disabled=true;btn.textContent="Enviando...";
    try{
      await createTicket(msg,photoData);
      toast("Mensagem enviada! Responderemos em breve.","success");
      d.querySelector("#supMsg").value="";
      photoData=null;prev.style.display="none";fileInp.value="";d.querySelector("#supPhotoLbl").style.display="flex";
      loadMine();
    }catch(e){toast("Erro ao enviar: "+((e&&e.code)||e.message||"verifique sua conexão"),"error");}
    sending=false;btn.disabled=false;btn.textContent="Enviar mensagem";
  };
  const loadMine=async()=>{
    const box=d.querySelector("#supMyTickets");if(!box)return;
    const mine=await loadMyTickets();
    if(!mine.length){box.innerHTML="";return;}
    box.innerHTML=`<div class="sec-lbl" style="margin-bottom:8px">SEUS CHAMADOS</div>`+mine.map(t=>{
      const st={aberto:["Aberto","#FF8C42"],respondido:["Respondido","#4FC3F7"],resolvido:["Resolvido","#4ADE80"]}[t.status]||["Aberto","#FF8C42"];
      const lastReply=(t.replies||[]).filter(r=>r.agent).slice(-1)[0];
      return `<div class="sup-tk"><div class="sup-tk-top"><span class="sup-tk-st" style="color:${st[1]};background:${st[1]}22">${st[0]}</span><span class="sup-tk-dt">${t.createdAt?new Date(t.createdAt.seconds*1000).toLocaleDateString("pt-BR"):""}</span></div><div class="sup-tk-msg">${(t.message||"").replace(/</g,"&lt;")}</div>${lastReply?`<div class="sup-tk-reply"><strong>Equipe:</strong> ${(lastReply.text||"").replace(/</g,"&lt;")}</div>`:""}</div>`;
    }).join("");
  };
  loadMine();
  return d;
}

// ─── CHAMADOS (agente/dono) ───
function rTicketsModal(){
  let tickets=[];
  let view="abertos"; // abertos | arquivados
  if(!S._openTicket)S._openTicket=null;
  const d=sheet("🎫 Chamados","Suporte · "+(isOwner()?"Administrador":"Agente"),`
    <div class="tk-tabs">
      <button class="tk-tab tk-tab-on" data-tkview="abertos">Abertos</button>
      <button class="tk-tab" data-tkview="arquivados">Arquivados</button>
    </div>
    <div id="tkList" class="tk-list"><div class="tk-loading">Carregando chamados...</div></div>`);

  const fmtTime=iso=>{try{const dt=new Date(iso);return dt.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}catch(e){return "";}};
  const fmtDate=sec=>{try{return new Date(sec*1000).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});}catch(e){return "";}};

  const render=()=>{
    const box=d.querySelector("#tkList");if(!box)return;
    const filtered=tickets.filter(t=>view==="arquivados"?t.archived===true:t.archived!==true);
    if(!filtered.length){
      box.innerHTML=`<div class="empty" style="padding:44px 0;text-align:center"><div style="font-size:40px;opacity:0.5">${view==="arquivados"?"🗂️":"📭"}</div><p style="margin-top:8px;font-weight:700">${view==="arquivados"?"Nenhum chamado arquivado":"Nenhum chamado aberto"}</p></div>`;
      return;
    }
    box.innerHTML=filtered.map(t=>{
      const st={aberto:["Aberto","#FF8C42"],respondido:["Respondido","#4FC3F7"],resolvido:["Resolvido","#4ADE80"]}[t.status]||["Aberto","#FF8C42"];
      const open=S._openTicket===t.id;
      const replies=t.replies||[];
      const lastReply=replies.slice(-1)[0];
      // preview: última mensagem (estilo WhatsApp)
      const preview=lastReply?`${lastReply.agent?"Você: ":""}${(lastReply.text||"").slice(0,48)}`:(t.message||"").slice(0,48);
      // conversa completa: mensagem original + respostas
      const conv=[
        {agent:false,name:t.fromName||"Usuário",text:t.message,at:t.createdAt?new Date(t.createdAt.seconds*1000).toISOString():null,orig:true},
        ...replies
      ].map(m=>{
        const who=m.agent?`Equipe${m.agentName?` (${m.agentName})`:""}`:(t.fromName||"Usuário");
        return `<div class="tk-msg ${m.agent?"tk-msg-agent":"tk-msg-user"}"><div class="tk-msg-by">${who.replace(/</g,"&lt;")}</div><div class="tk-msg-tx">${(m.text||"").replace(/</g,"&lt;")}</div>${m.at?`<div class="tk-msg-at">${fmtTime(m.at)}</div>`:""}</div>`;
      }).join("");
      return `<div class="tk-card ${open?"tk-open":""}">
        <div class="tk-head" data-tk="${t.id}">
          <div class="tk-avatar">${(t.fromName||"U")[0].toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <div class="tk-from-row"><span class="tk-from">${(t.fromName||t.fromEmail||"Usuário").replace(/</g,"&lt;")}</span><span class="tk-date">${t.createdAt?fmtDate(t.createdAt.seconds):""}</span></div>
            <div class="tk-preview">${preview.replace(/</g,"&lt;")}${preview.length>=48?"…":""}</div>
          </div>
          <span class="tk-st" style="color:${st[1]};background:${st[1]}22">${st[0]}</span>
        </div>
        ${open?`<div class="tk-body">
          <div class="tk-conv">${conv}</div>
          ${t.photo?`<img class="tk-photo" src="${t.photo}" alt="anexo" data-img="${t.id}"/>`:""}
          <textarea class="tk-reply-ta" id="tkReply_${t.id}" placeholder="Escreva uma resposta..." rows="2"></textarea>
          <div class="tk-actions">
            <button class="tk-btn tk-btn-resolve" data-resolve="${t.id}">Responder e resolver</button>
            <button class="tk-btn" data-reply="${t.id}">Responder</button>
          </div>
          <div class="tk-actions2">
            ${t.archived?`<button class="tk-mini-btn" data-unarchive="${t.id}">↩️ Desarquivar</button>`:`<button class="tk-mini-btn" data-archive="${t.id}">🗂️ Arquivar</button>`}
            ${isOwner()?`<button class="tk-mini-btn tk-mini-del" data-del="${t.id}">🗑️ Excluir</button>`:""}
          </div>
        </div>`:""}
      </div>`;
    }).join("");

    // expandir/recolher conversa
    box.querySelectorAll("[data-tk]").forEach(el=>el.onclick=e=>{
      e.stopPropagation();
      const id=el.dataset.tk;
      S._openTicket=S._openTicket===id?null:id;
      render();
      // rolar a conversa recém-aberta para o fim
      if(S._openTicket===id){const conv=box.querySelector(".tk-open .tk-conv");if(conv)conv.scrollTop=conv.scrollHeight;}
    });
    box.querySelectorAll("[data-img]").forEach(im=>im.onclick=e=>{e.stopPropagation();const o=document.createElement("div");o.className="img-zoom";o.innerHTML=`<img src="${im.src}"/>`;o.onclick=()=>o.remove();document.body.appendChild(o);});
    const reload=async()=>{tickets=await loadTickets();render();};
    const doReply=async(id,close)=>{
      const ta=d.querySelector(`#tkReply_${id}`);const txt=(ta?.value||"").trim();
      if(!txt){toast("Escreva uma resposta.");return;}
      try{await replyTicket(id,txt,close);toast(close?"Chamado resolvido!":"Resposta enviada!","success");if(close)S._openTicket=null;await reload();}
      catch(e){toast("Erro ao responder.","error");}
    };
    box.querySelectorAll("[data-reply]").forEach(b=>b.onclick=e=>{e.stopPropagation();doReply(b.dataset.reply,false);});
    box.querySelectorAll("[data-resolve]").forEach(b=>b.onclick=e=>{e.stopPropagation();doReply(b.dataset.resolve,true);});
    box.querySelectorAll("[data-archive]").forEach(b=>b.onclick=async e=>{e.stopPropagation();try{await archiveTicket(b.dataset.archive,true);toast("Chamado arquivado.","success");S._openTicket=null;await reload();}catch(e){toast("Erro ao arquivar.","error");}});
    box.querySelectorAll("[data-unarchive]").forEach(b=>b.onclick=async e=>{e.stopPropagation();try{await archiveTicket(b.dataset.unarchive,false);toast("Chamado reaberto.","success");S._openTicket=null;await reload();}catch(e){toast("Erro.","error");}});
    box.querySelectorAll("[data-del]").forEach(b=>b.onclick=async e=>{
      e.stopPropagation();
      if(!(await askConfirm("Excluir chamado","Essa conversa será apagada permanentemente.","Excluir",true)))return;
      try{await deleteTicket(b.dataset.del);toast("Chamado excluído.","success");S._openTicket=null;await reload();}catch(e){toast("Erro ao excluir.","error");}
    });
  };

  d.querySelectorAll("[data-tkview]").forEach(b=>b.onclick=()=>{
    d.querySelectorAll("[data-tkview]").forEach(x=>x.classList.remove("tk-tab-on"));
    b.classList.add("tk-tab-on");view=b.dataset.tkview;S._openTicket=null;render();
  });
  loadTickets().then(t=>{tickets=t;render();});
  return d;
}

// ─── PERMISSÕES (somente dono) ───
function rPermsModal(){
  if(!isOwner())return sheet("Acesso restrito","",`<div class="empty" style="padding:40px 0;text-align:center"><div style="font-size:40px">🔒</div><p style="margin-top:8px">Apenas o administrador tem acesso.</p></div>`);
  let tab="grant";
  const d=sheet("🛡️ Permissões","Gerenciar acesso ao suporte",`
    <div class="perm-tabs">
      <button class="perm-tab perm-tab-on" data-pt="grant">Atribuir / Remover</button>
      <button class="perm-tab" data-pt="list">Com acesso</button>
      <button class="perm-tab" data-pt="log">Histórico</button>
    </div>
    <div id="permBody"></div>
  `);
  const body=d.querySelector("#permBody");

  const renderGrant=()=>{
    body.innerHTML=`
      <div class="perm-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="permSearch" placeholder="Buscar por nome ou email..." autocomplete="off"/></div>
      <div id="permResults" class="perm-results"><div class="tk-loading">Digite para buscar usuários...</div></div>`;
    const inp=body.querySelector("#permSearch");
    const results=body.querySelector("#permResults");
    let timer=null;
    const doSearch=async()=>{
      const term=inp.value;
      results.innerHTML=`<div class="tk-loading">Buscando...</div>`;
      let users;
      try{users=await searchUsers(term);}
      catch(err){results.innerHTML=`<div class="perm-err"><strong>Não foi possível buscar.</strong><br>As regras de segurança do Firestore precisam ser configuradas no console do Firebase. Erro: ${(err&&err.code)||err.message||"desconhecido"}</div>`;return;}
      if(!users.length){results.innerHTML=`<div class="tk-loading">Nenhum usuário encontrado.${term?"":" Nenhum usuário cadastrado ainda além de você."}</div>`;return;}
      results.innerHTML=users.map(u=>`<div class="perm-user">
        <div style="flex:1;min-width:0"><div class="perm-user-nm">${(u.username||u.name||"—").replace(/</g,"&lt;")}</div><div class="perm-user-em">${(u.email||"").replace(/</g,"&lt;")}</div></div>
        ${u.supportAgent?`<button class="perm-btn perm-btn-revoke" data-revoke="${u.uid}">Remover</button>`:`<button class="perm-btn perm-btn-grant" data-grant="${u.uid}">Dar acesso</button>`}
      </div>`).join("");
      results.querySelectorAll("[data-grant]").forEach(b=>b.onclick=async()=>{
        b.disabled=true;b.textContent="...";
        try{await setAgentPermission(b.dataset.grant,true);toast("Acesso concedido!","success");doSearch();}catch(e){toast("Erro ao conceder.","error");b.disabled=false;b.textContent="Dar acesso";}
      });
      results.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{
        if(!(await askConfirm("Remover acesso","O usuário deixará de ver e responder chamados.","Remover",true)))return;
        b.disabled=true;b.textContent="...";
        try{await setAgentPermission(b.dataset.revoke,false);toast("Acesso removido.","success");doSearch();}catch(e){toast("Erro ao remover.","error");b.disabled=false;b.textContent="Remover";}
      });
    };
    inp.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(doSearch,280);});
    inp.focus();
  };
  const renderList=async()=>{
    body.innerHTML=`<div class="tk-loading">Carregando...</div>`;
    const agents=await loadAgents();
    if(!agents.length){body.innerHTML=`<div class="empty" style="padding:36px 0;text-align:center"><div style="font-size:36px;opacity:0.5">👥</div><p style="margin-top:8px">Ninguém tem acesso ao suporte ainda.</p></div>`;return;}
    body.innerHTML=`<div class="sec-lbl" style="margin-bottom:10px">${agents.length} com acesso</div>`+agents.map(u=>`<div class="perm-user"><div style="flex:1;min-width:0"><div class="perm-user-nm">${(u.username||u.name||"—").replace(/</g,"&lt;")}</div><div class="perm-user-em">${(u.email||"").replace(/</g,"&lt;")}</div></div><button class="perm-btn perm-btn-revoke" data-revoke="${u.uid}">Remover</button></div>`).join("");
    body.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{
      if(!(await askConfirm("Remover acesso","O usuário deixará de ver e responder chamados.","Remover",true)))return;
      try{await setAgentPermission(b.dataset.revoke,false);toast("Acesso removido.","success");renderList();}catch(e){toast("Erro.","error");}
    });
  };
  const renderLog=async()=>{
    body.innerHTML=`<div class="tk-loading">Carregando histórico...</div>`;
    const log=await loadPermissionLog();
    // resolver nomes pelo índice
    let idx={};try{const snap=await getDocs(collection(db,"userIndex"));snap.docs.forEach(x=>{const v=x.data();idx[v.uid]=v;});}catch(e){}
    if(!log.length){body.innerHTML=`<div class="empty" style="padding:36px 0;text-align:center"><div style="font-size:36px;opacity:0.5">📜</div><p style="margin-top:8px">Nenhuma alteração registrada.</p></div>`;return;}
    body.innerHTML=log.map(l=>{
      const u=idx[l.targetUid]||{};
      const when=l.at?new Date(l.at.seconds*1000).toLocaleString("pt-BR"):"";
      return `<div class="perm-log ${l.grant?"perm-log-grant":"perm-log-revoke"}"><span class="perm-log-ic">${l.grant?"➕":"➖"}</span><div style="flex:1;min-width:0"><div class="perm-user-nm">${(u.username||u.email||l.targetUid).replace(/</g,"&lt;")}</div><div class="perm-user-em">${l.grant?"Acesso concedido":"Acesso removido"} · ${when}</div></div></div>`;
    }).join("");
  };
  const switchTab=t=>{tab=t;body.scrollTop=0;if(t==="grant")renderGrant();else if(t==="list")renderList();else renderLog();};
  d.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{d.querySelectorAll("[data-pt]").forEach(x=>x.classList.remove("perm-tab-on"));b.classList.add("perm-tab-on");switchTab(b.dataset.pt);});
  switchTab("grant");
  return d;
}

function rClearDayModal(){
  const d=D("overlay");
  d.innerHTML=`<div class="modal-sheet" style="max-width:420px"></div>`;
  const d2=d.querySelector(".modal-sheet");
  d.onclick=e=>{if(e.target===d)closeModal();};
  const count=S.foods.length;
  const totalCal=Math.round(S.foods.reduce((s,f)=>s+calcAdj(f).cal,0));
  const selDate=new Date((S.calDate||new Date().toISOString().split("T")[0])+"T12:00:00");
  const dateLbl=selDate.toLocaleDateString("pt-BR",{day:"2-digit",month:"long"});
  d2.innerHTML=`<div class="modal-handle"></div>
    <div style="text-align:center;padding:8px 4px 4px">
      <div style="width:64px;height:64px;background:rgba(255,107,107,0.12);border:2px solid rgba(255,107,107,0.3);border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF8888" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </div>
      <div style="font-weight:800;font-size:19px;color:var(--text);margin-bottom:6px">Limpar refeições do dia?</div>
      <div style="font-size:13.5px;color:var(--text2);line-height:1.5;margin-bottom:6px">Isso vai remover <strong style="color:#FF8888">${count} ${count===1?"item":"itens"}</strong> (${totalCal} kcal) registrado${count===1?"":"s"} em <strong>${dateLbl}</strong>.</div>
      <div style="font-size:12px;color:var(--text3);line-height:1.4;margin-bottom:18px">Essa ação não pode ser desfeita. A hidratação e os treinos do dia <em>não</em> serão afetados.</div>
      <div style="display:flex;gap:10px">
        <button id="bCdCancel" class="btn-sec" style="flex:1;padding:13px">Cancelar</button>
        <button id="bCdConfirm" style="flex:1;padding:13px;background:#FF6B6B;border:none;border-radius:12px;color:#fff;font-weight:800;font-size:14px;cursor:pointer">Sim, limpar</button>
      </div>
    </div>`;
  d2.querySelector("#bCdCancel").onclick=()=>{FX.tap();closeModal();};
  d2.querySelector("#bCdConfirm").onclick=async()=>{
    FX.tapStrong();
    const btn=d2.querySelector("#bCdConfirm");btn.disabled=true;btn.style.opacity="0.6";btn.textContent="Limpando...";
    S.foods=[];S.mealCat={};S.mealCatNames={};
    try{await saveFoods([]);}catch(e){}
    toast("Diário do dia limpo","success");
    closeModal(true);
  };
  return d;
}

// ─── FOOD MODAL ───
function rFoodModal(){
  const d=document.createElement("div");
  d.className="overlay";

  const getAllFoods=()=>{
    // Official foods with metadata
    const official=FOODS.map(f=>({...f,addedBy:"✅ Oficial",addedAt:"",addedById:"official",official:true,brand:f.brand||""}));
    // Community foods
    const community=S.communityFoods||[];
    return [...official,...community];
  };
  const updateList=(container,q2,cat2)=>{
    const all=getAllFoods();
    const f2=all.filter(x=>{
      const catOk=!cat2||x.cat===cat2;
      const sOk=!q2||x.n.toLowerCase().includes(q2)||(x.brand||"").toLowerCase().includes(q2);
      return catOk&&sOk;
    }).slice(0,60);
    const catColors={
      "Proteínas":"#4B9EFF","Carboidratos":"#FF8C42","Frutas":"#4ADE80","Laticínios":"#A78BFA",
      "Gorduras":"#FFD700","Lanches":"#F472B6","Bebidas":"#00D4FF","Vegetais":"#22D3A5",
      "Refeições":"#FF6B6B","Suplementos":"#818CF8","Outros":"#888","":""
    };
    container.innerHTML=f2.map(f=>{
      const cc=catColors[f.cat||""]||"#888";
      const isOwn=!f.official&&f.addedById===uid();
      return `<div class="frow" data-fn="${f.n.replace(/"/g,"&quot;")}">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">
            ${f.cat?`<span style="font-size:9px;font-weight:800;padding:2px 6px;border-radius:10px;background:${cc}20;color:${cc};letter-spacing:0.5px">${f.cat.toUpperCase()}</span>`:""}
            ${f.brand?`<span style="font-size:10px;color:#888">${f.brand}</span>`:""}
          </div>
          <div class="fn">${f.n}</div>
          <div class="fm">P:${f.p}g · C:${f.c}g · G:${f.f}g</div>
          <div style="font-size:10px;color:#555;margin-top:2px;display:flex;align-items:center;gap:4px">
            ${f.official?`<span style="color:#22D3A5;font-weight:700">✅ Oficial</span>`:`<span>👤 ${f.addedBy||"Usuário"}</span>`}
            ${(!f.official&&f.addedAt)?`<span>· ${(()=>{const p=String(f.addedAt).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:f.addedAt;})()}</span>`:""}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
          <div class="fcal">${f.cal} kcal</div>
          ${f.serving?`<div style="font-size:10px;color:#555">${f.serving}g</div>`:""}
          ${isOwn?`<button class="fi-del" data-del-community="${f.id||f.n}" style="font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(255,80,80,0.12);color:#FF6B6B;border:1px solid rgba(255,80,80,0.2);cursor:pointer">Excluir</button>`:""}
        </div>
      </div>`;
    }).join("");
    container.querySelectorAll("[data-fn]").forEach(row=>row.onclick=async(e)=>{
      if(e.target.closest("[data-del-community]"))return;
      if(e.target.closest("[data-del-community]"))return;
      const fname=row.dataset.fn;
      const all2=getAllFoods();const f=all2.find(x=>x.n===fname);
      if(!f)return;
      // Show quantity picker
      const overlay=document.createElement("div");
      overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px";
      let qty=f.serving||100;
      const renderQty=()=>{
        const ratio=qty/(f.serving||100);
        overlay.innerHTML=`<div style="background:var(--bg2);border-radius:20px;padding:24px;width:100%;max-width:340px;border:1px solid var(--border)">
          <div style="font-weight:800;font-size:18px;margin-bottom:4px">${f.n}</div>
          ${f.brand?`<div style="font-size:12px;color:#888;margin-bottom:12px">${f.brand}</div>`:""}
          <div style="font-size:13px;color:#aaa;margin-bottom:16px">Selecione a quantidade:</div>
          <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px">
            <button id="qm" style="width:44px;height:44px;background:var(--bg3);border:1px solid var(--border-soft);border-radius:12px;color:var(--text);font-size:24px;cursor:pointer">−</button>
            <div style="text-align:center">
              <input id="qtyInp" type="number" value="${qty}" min="1" max="5000" style="width:80px;padding:10px;background:var(--bg3);border:1.5px solid var(--orange);border-radius:10px;color:var(--text);font-size:22px;font-weight:800;text-align:center"/>
              <div style="font-size:12px;color:#888;margin-top:4px">gramas</div>
            </div>
            <button id="qp" style="width:44px;height:44px;background:var(--bg3);border:1px solid var(--border-soft);border-radius:12px;color:var(--text);font-size:24px;cursor:pointer">+</button>
          </div>
          <div style="background:var(--bg3);border-radius:12px;padding:12px;margin-bottom:16px;text-align:center">
            <div style="font-size:22px;font-weight:800;color:var(--orange)">${Math.round((f.cal||0)*ratio)} kcal</div>
            <div style="font-size:12px;color:#888;margin-top:4px">P:${+((f.p||0)*ratio).toFixed(1)}g · C:${+((f.c||0)*ratio).toFixed(1)}g · G:${+((f.f||0)*ratio).toFixed(1)}g</div>
          </div>
          <div style="display:flex;gap:8px">
            <button id="qCancel" style="flex:1;padding:13px;background:var(--bg3);border:1px solid var(--border-soft);border-radius:12px;color:var(--text2);font-size:15px;font-weight:600;cursor:pointer">Cancelar</button>
            <button id="qAdd" style="flex:2;padding:13px;background:var(--orange);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer">✓ Adicionar</button>
          </div>
        </div>`;
        overlay.querySelector("#qm").onclick=()=>{qty=Math.max(1,qty-10);renderQty();};
        overlay.querySelector("#qp").onclick=()=>{qty=qty+10;renderQty();};
        overlay.querySelector("#qtyInp").oninput=e=>{qty=parseFloat(e.target.value)||1;renderQty();};
        overlay.querySelector("#qCancel").onclick=()=>overlay.remove();
        const capturedCat=S.pendingMealCat||"sem_categoria";
        let qAdding=false;
        overlay.querySelector("#qAdd").onclick=async(ev)=>{
          if(qAdding)return;
          qAdding=true;
          const btn=ev.currentTarget;
          btn.disabled=true;btn.style.opacity="0.6";btn.textContent="Adicionando...";
          try{
            const ni=S.foods.length;
            S.foods.push({...f,grams:qty,at:new Date().toISOString()});
            if(!S.mealCat)S.mealCat={};
            S.mealCat[ni]=capturedCat;
            await saveFoods(S.foods);
            FX.food();
            S.foodSearch="";S.foodCat="";S.pendingMealCat=null;
            overlay.remove();
            closeModal(true);
          }catch(err){
            qAdding=false;btn.disabled=false;btn.style.opacity="1";btn.textContent="Adicionar";
            toast("Erro ao adicionar. Tente novamente.","error");
          }
        };
      };
      renderQty();
      document.body.appendChild(overlay);
    });
    container.querySelectorAll("[data-del-community]").forEach(btn=>btn.onclick=async e=>{
      e.stopPropagation();
      const id=btn.dataset.delCommunity;
      if(!(await askConfirm("Excluir alimento","Ele será removido do banco de alimentos.","Excluir",true)))return;
      try{
        // Find by id or name — only if addedById matches current user
        const food=S.communityFoods.find(f=>f.id===id||f.n===id);
        if(food&&food.addedById===uid()){
          await deleteDoc(doc(db,"communityFoods",food.id));
          S.communityFoods=S.communityFoods.filter(f=>f.id!==food.id);
          updateList(container,(S.foodSearch||"").toLowerCase(),S.foodCat);
        }
      }catch(err){console.error(err);}
    });
  };

  const buildAIHtml=()=>{
    if(S.aiLoading)return `<div style="text-align:center;padding:16px 0"><div style="font-size:32px;animation:spin 1.5s linear infinite;display:inline-block">⏳</div><div style="font-weight:600;margin-top:8px;color:#fff">Analisando com IA...</div><div style="font-size:12px;color:#888;margin-top:4px">Verificando se é comida e identificando ingredientes...</div></div>`;
    if(S.aiError)return `<div style="text-align:center;padding:8px 0">${S.aiImg?`<img src="${S.aiImg}" style="width:100%;max-height:80px;object-fit:cover;border-radius:10px;margin-bottom:10px"/>`:""}<div style="font-size:28px;margin-bottom:8px">🚫</div><div style="font-weight:700;font-size:15px;color:#FF6B6B;margin-bottom:6px">Isso não é comida!</div><div style="font-size:12px;color:#aaa;margin-bottom:12px">${S.aiError}</div><button class="btn-sec" id="bRetryAI" style="width:100%;padding:10px">↺ Tirar outra foto</button></div>`;
    if(S.aiWeightStep){
      // Step 2: confirm ingredients + ask for plate weight
      const r=S.aiRawResult;
      if(!S.aiIngChecked)S.aiIngChecked=(r.ingredients||[]).map(()=>true);
      const ings=r.ingredients||[];
      return `<div>
        ${S.aiImg?`<img src="${S.aiImg}" style="width:100%;max-height:80px;object-fit:cover;border-radius:10px;margin-bottom:10px"/>`:""}
        <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:2px">🍽️ ${r.n}</div>
        <div style="font-size:11px;color:#888;margin-bottom:12px">${r.desc||""}</div>
        <div style="background:var(--bg3);border-radius:12px;padding:12px;margin-bottom:12px">
          <div style="font-size:11px;color:#888;margin-bottom:8px;font-weight:700">CONFIRME OS INGREDIENTES</div>
          <div style="font-size:11px;color:#666;margin-bottom:10px">Toque para marcar/desmarcar o que está certo. Adicione o que faltou abaixo.</div>
          ${ings.map((ing,i)=>`<div class="ai-ing-row" data-ing="${i}" style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--border)">
            <div class="ai-ing-chk" style="width:24px;height:24px;border-radius:7px;border:2px solid ${S.aiIngChecked[i]?"var(--orange)":"#555"};background:${S.aiIngChecked[i]?"var(--orange)":"transparent"};color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${S.aiIngChecked[i]?"✓":""}</div>
            <span style="font-size:14px;color:${S.aiIngChecked[i]?"var(--text)":"#666"};flex:1;${S.aiIngChecked[i]?"":"text-decoration:line-through"}">${ing}</span>
            <button class="ai-ing-del" data-del-ing="${i}" style="background:none;border:none;color:#FF6B6B;font-size:18px;cursor:pointer;padding:0 4px">×</button>
          </div>`).join("")}
          <div style="display:flex;gap:8px;margin-top:10px">
            <input id="aiNewIng" placeholder="Adicionar ingrediente..." style="flex:1;padding:9px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none"/>
            <button id="aiAddIng" style="padding:9px 14px;background:var(--orange);border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer">+</button>

        <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:6px">⚖️ Qual o peso do prato? <span style="font-size:11px;font-weight:400;color:#888">(opcional)</span></div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <button id="aiWm" style="width:36px;height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:20px;cursor:pointer;flex-shrink:0">−</button>
          <input id="aiWinp" type="number" value="${S.aiPlateWeight||0}" min="0" max="3000" style="flex:1;padding:10px;background:var(--bg3);border:1.5px solid var(--orange);border-radius:10px;color:var(--text);font-size:18px;font-weight:800;text-align:center;outline:none"/>
          <button id="aiWp" style="width:36px;height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:20px;cursor:pointer;flex-shrink:0">+</button>
          <span style="font-size:13px;color:#888">g</span>
        </div>
        <div style="font-size:11px;color:#888;margin-bottom:14px;line-height:1.4">💡 Para um resultado mais preciso, informe o peso do prato (parte sólida, caldo, molho, salada). Se deixar em 0, o app mostra uma <strong style="color:#aaa">estimativa do total de calorias</strong> daquele prato.</div>
        <div style="display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg2);padding:8px 0">
          <button class="btn-sec" id="bSkipWeight" style="flex:1;padding:13px;font-size:13px">Pular peso</button>
          <button class="btn-primary" id="bConfirmWeight" style="flex:2;padding:13px">✓ Calcular calorias</button>
        </div>
      </div>`;
    }
    if(S.aiResult){
      const w=S.aiPlateWeight>0?`<div style="font-size:11px;color:#555;margin-top:2px">Baseado em ${S.aiPlateWeight}g do prato</div>`:"";
      return `<div>${S.aiImg?`<img src="${S.aiImg}" style="width:100%;max-height:90px;object-fit:cover;border-radius:10px;margin-bottom:10px"/>`:""}<div style="font-size:11px;color:#888;margin-bottom:3px">🤖 Estimativa IA:</div><div style="font-weight:700;font-size:16px;color:#fff">${S.aiResult.n}</div>${w}<div style="font-size:16px;color:#FF6B00;font-weight:800;margin:8px 0">${S.aiResult.cal} kcal &nbsp;·&nbsp; P:${S.aiResult.p}g · C:${S.aiResult.c}g · G:${S.aiResult.f}g</div><div style="display:flex;gap:8px"><button class="btn-primary" id="bAddAI" style="flex:1;padding:12px">✓ Adicionar</button><button class="btn-sec" id="bRetryAI" style="flex:1;padding:12px">↺ Nova foto</button></div></div>`;
    }

    if(S.aiPhotoStep){

    }
    // Hub unificado: escolher entre Foto e Dieta com IA
    const premiumBadge=isPremium()?"":`<span style="font-size:9px;font-weight:800;color:#FFD700;background:rgba(255,215,0,0.12);padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle">PREMIUM</span>`;
    return `<div style="display:flex;flex-direction:column;gap:12px;padding:4px 0">
      <button class="ai-hub-card" id="bAIHubPhoto" style="display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg2);border:1px solid var(--border-soft);border-radius:18px;cursor:pointer;text-align:left;width:100%;transition:all .18s">
        <div style="width:48px;height:48px;flex-shrink:0;border-radius:13px;background:linear-gradient(135deg,#FF6B00,#FFB347);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(255,107,0,0.3)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800;color:var(--text)">Tirar foto e identificar</div><div style="font-size:12px;color:var(--text3);margin-top:3px;line-height:1.35">A IA reconhece os alimentos no prato e calcula calorias e macros</div></div>
        <span style="color:var(--text3);font-size:20px;flex-shrink:0">→</span>
      </button>
      <button class="ai-hub-card" id="bAIHubDiet" style="display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg2);border:1px solid var(--border-soft);border-radius:18px;cursor:pointer;text-align:left;width:100%;transition:all .18s">
        <div style="width:48px;height:48px;flex-shrink:0;border-radius:13px;background:linear-gradient(135deg,#22D3A5,#16B894);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(34,211,165,0.3)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg></div>
        <div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800;color:var(--text)">Gerar dieta com IA${premiumBadge}</div><div style="font-size:12px;color:var(--text3);margin-top:3px;line-height:1.35">Plano completo de refeições para sua meta de ${S.targetCal||0} kcal</div></div>
        <span style="color:var(--text3);font-size:20px;flex-shrink:0">→</span>
      </button>
    </div>`;
  };

  const render=()=>{
    const q=(S.foodSearch||"").toLowerCase();
    const filtered=FOODS.filter(f=>{
      const catOk=!S.foodCat||f.cat===S.foodCat;
      const sOk=!q||f.n.toLowerCase().includes(q);
      return catOk&&sOk;
    }).slice(0,60);
    const mode=S.foodModalMode||"add";
    const isAI=mode==="ai";
    const step=S.foodAddStep||"picker"; // "picker" | "manual" | "db"

    // ─── MODE AI (hub unificado: foto + dieta) ───
    if(isAI){
      d.innerHTML=`<div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-hdr"><div style="display:flex;align-items:center;gap:10px"><button id="bAIBack" style="background:var(--bg3);border:1px solid var(--border-soft);color:var(--text);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;padding:0">←</button><div><div class="modal-title">IA Nutricional</div><div class="modal-sub">Foto inteligente ou dieta completa</div></div></div><button class="close-x" id="bCloseFood">✕</button></div>
        <div class="ai-zone" id="aiZone">${buildAIHtml()}</div>
      </div>`;
      d.querySelector("#bCloseFood").onclick=()=>closeModal();

  const bindAIHub=()=>{
    d.querySelector("#bAIHubPhoto")?.addEventListener("click",()=>{

  };

  const bindCam=()=>{
    const camInput=d.querySelector("#bCamInput");
    if(!camInput)return;
    const galInput=d.querySelector("#bGalInput");
    if(galInput){galInput.onchange=camInput.onchange=processFile;}
    async function processFile(e){
      const file=e.target.files?.[0];if(!file)return;
      if(usesLeft("aiFood")<=0){
        showPremiumGate("Você atingiu o limite de "+PLAN_LIMITS.free.aiFoodPerDay+" análises de comida por dia do plano grátis.");
        return;
      }
      consumeUse("aiFood");
      S.aiLoading=true;S.aiError=null;S.aiResult=null;S.aiRawResult=null;S.aiWeightStep=false;S.aiPlateWeight=0;
      const az=d.querySelector("#aiZone");if(az)az.innerHTML=buildAIHtml();
      try{
        const base64=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result.split(",")[1]);reader.onerror=rej;reader.readAsDataURL(file);});
        const mimeType=file.type||"image/jpeg";
        S.aiImg=`data:${mimeType};base64,${base64}`;
        const prompt2='Voce e um nutricionista especialista em analise de alimentos por imagem. Examine a foto com muita atencao e identifique TODOS os alimentos visiveis. Se a imagem NAO contiver alimento, responda isFood=false. Caso contrario, isFood=true. Liste cada alimento no campo ingredients. IMPORTANTE: os valores nutricionais devem ser para uma PORCAO TIPICA de uma refeicao individual (entre 150g e 500g no total). Cal deve ser em kcal reais (um prato de comida tipico tem entre 300 e 900 kcal, NUNCA mais de 2000 kcal por prato individual). p, c, f tambem em gramas reais por porcao. serving = peso estimado do prato em gramas. Exemplos de referencia: arroz+feijao+frango+salada = ~600kcal/350g; lanche natural = ~400kcal/200g; pizza 2 fatias = ~500kcal/200g. Responda em portugues.';
        const resp=await fetch("https://boltfit-ia.vitortorresdarosa.workers.dev",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            contents:[{parts:[
              {text:prompt2},
              {inline_data:{mime_type:mimeType,data:base64}}
            ]}],
            generationConfig:{
              temperature:0.2,
              maxOutputTokens:2048,
              thinkingConfig:{thinkingBudget:0},
              responseMimeType:"application/json",
              responseSchema:{
                type:"OBJECT",
                properties:{
                  isFood:{type:"BOOLEAN"},
                  reason:{type:"STRING"},
                  n:{type:"STRING"},
                  desc:{type:"STRING"},
                  ingredients:{type:"ARRAY",items:{type:"STRING"}},
                  cal:{type:"NUMBER"},
                  p:{type:"NUMBER"},
                  c:{type:"NUMBER"},
                  f:{type:"NUMBER"},
                  serving:{type:"NUMBER"}
                },
                required:["isFood"]
              }
            }
          })
        });
        if(!resp.ok){
          let errTxt="";try{errTxt=await resp.text();}catch(e){}
          if(resp.status===429)throw new Error("Limite de uso da IA atingido. Aguarde 1 minuto e tente de novo.");
          throw new Error("Falha na IA ("+resp.status+"). Tente novamente.");
        }
        const data=await resp.json();
        const cand=data?.candidates?.[0];
        let txt=cand?.content?.parts?.map(p=>p.text||"").join("")||"";
        txt=txt.replace(/```json|```/g,"").trim();
        let result=null;
        try{
          result=JSON.parse(txt);
        }catch(e1){
          // tenta extrair o maior bloco JSON balanceado
          const start=txt.indexOf("{");
          if(start>=0){
            let depth=0,end=-1;
            for(let i=start;i<txt.length;i++){
              if(txt[i]==="{")depth++;
              else if(txt[i]==="}"){depth--;if(depth===0){end=i;break;}}
            }
            if(end>start){try{result=JSON.parse(txt.slice(start,end+1));}catch(e2){}}
          }
        }
        if(!result){
          throw new Error("A IA respondeu de forma incompleta. Tire a foto novamente com boa iluminacao.");
        }
        if(!result.isFood){
          S.aiError=result.reason||"Isso nao parece ser comida. Tire uma foto de uma refeicao.";
          S.aiImg=null;
        }else{
          // Sanity check: cap unrealistic values (IA às vezes retorna por 100g mas multiplica errado)
          let rawCal=Number(result.cal)||0;
          let rawP=Number(result.p)||0;
          let rawC=Number(result.c)||0;
          let rawF=Number(result.f)||0;
          // Se calorias parecem ser por 100g (muito altas p/ uma porção), dividir pelo serving estimado
          const rawServing=Number(result.serving)||300;
          if(rawCal>2500&&rawServing>0){
            // Provavelmente é por 100g — ajustar para o serving real
            const factor=rawServing/100;
            rawCal=Math.round(rawCal/100*rawServing);
            rawP=+(rawP/100*rawServing).toFixed(1);
            rawC=+(rawC/100*rawServing).toFixed(1);
            rawF=+(rawF/100*rawServing).toFixed(1);
          }
          // Hard cap para valores absurdos
          rawCal=Math.min(rawCal,3000);
          rawP=Math.min(rawP,300);
          rawC=Math.min(rawC,400);
          rawF=Math.min(rawF,200);
          S.aiRawResult={
            n:result.n||"Refeicao",desc:result.desc||"",
            ingredients:Array.isArray(result.ingredients)?result.ingredients:[],
            cal:rawCal,p:rawP,c:rawC,f:rawF,
            serving:rawServing
          };
          S.aiWeightStep=true;
          S.aiIngChecked=S.aiRawResult.ingredients.map(()=>true);
          S.aiPlateWeight=0;
        }
      }catch(err){
        S.aiError=(err&&err.message)?err.message:"Erro ao analisar imagem. Tente novamente.";
        S.aiImg=null;
      }
      S.aiLoading=false;
      const az2=d.querySelector("#aiZone");
      if(az2){az2.innerHTML=buildAIHtml();bindAIButtons();}
    };
  };

  const bindAIButtons=()=>{
    // Helper to redraw the AI zone and rebind
    const redrawAI=()=>{const az=d.querySelector("#aiZone");if(az){az.innerHTML=buildAIHtml();bindAIButtons();bindCam();bindAIHub();}};
    // Ingredient confirm/uncheck
    d.querySelectorAll(".ai-ing-row").forEach(row=>row.onclick=e=>{
      if(e.target.closest("[data-del-ing]"))return;
      const i=parseInt(row.dataset.ing);
      if(!S.aiIngChecked)return;
      S.aiIngChecked[i]=!S.aiIngChecked[i];
      redrawAI();
    });
    // Delete ingredient
    d.querySelectorAll("[data-del-ing]").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const i=parseInt(b.dataset.delIng);
      S.aiRawResult.ingredients.splice(i,1);
      if(S.aiIngChecked)S.aiIngChecked.splice(i,1);
      redrawAI();
    });
    // Add missing ingredient
    const addIng=()=>{
      const inp=d.querySelector("#aiNewIng");if(!inp)return;
      const v=inp.value.trim();if(!v)return;
      if(!S.aiRawResult.ingredients)S.aiRawResult.ingredients=[];
      S.aiRawResult.ingredients.push(v);
      if(!S.aiIngChecked)S.aiIngChecked=[];
      S.aiIngChecked.push(true);
      redrawAI();
    };
    d.querySelector("#aiAddIng")?.addEventListener("click",addIng);
    d.querySelector("#aiNewIng")?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addIng();}});
    // Weight step controls
    const aiWm=d.querySelector("#aiWm");
    const aiWp=d.querySelector("#aiWp");
    const aiWinp=d.querySelector("#aiWinp");
    if(aiWm)aiWm.onclick=()=>{S.aiPlateWeight=Math.max(0,(S.aiPlateWeight||0)-10);if(aiWinp)aiWinp.value=S.aiPlateWeight;};
    if(aiWp)aiWp.onclick=()=>{S.aiPlateWeight=(S.aiPlateWeight||0)+10;if(aiWinp)aiWinp.value=S.aiPlateWeight;};
    if(aiWinp)aiWinp.oninput=e=>{S.aiPlateWeight=parseFloat(e.target.value)||0;};
    d.querySelector("#bSkipWeight")?.addEventListener("click",()=>{calcAndShowResult(0);});
    d.querySelector("#bConfirmWeight")?.addEventListener("click",()=>{calcAndShowResult(S.aiPlateWeight||0);});
    d.querySelector("#bAddAI")?.addEventListener("click",async()=>{
      if(S.aiResult){
        const ni=S.foods.length;
        S.foods.push({...S.aiResult,grams:S.aiResult.serving||100,at:new Date().toISOString()});
        if(!S.mealCat)S.mealCat={};
        S.mealCat[ni]=S.pendingMealCat||"sem_categoria";
        await saveFoods(S.foods);
        S.aiResult=null;S.aiImg=null;S.aiRawResult=null;S.aiWeightStep=false;S.aiPlateWeight=0;S.aiIngChecked=null;S.pendingMealCat=null;
        closeModal(true);
      }
    });
    d.querySelector("#bRetryAI")?.addEventListener("click",()=>{S.aiResult=null;S.aiImg=null;S.aiError=null;S.aiRawResult=null;S.aiWeightStep=false;S.aiPlateWeight=0;S.aiIngChecked=null;S.aiPhotoStep=true;const az=d.querySelector("#aiZone");if(az){az.innerHTML=buildAIHtml();bindCam();bindAIButtons();}});
  };

  const calcAndShowResult=(plateWeight)=>{
    const r=S.aiRawResult;if(!r)return;
    let ratio=1;
    if(plateWeight>0&&r.serving>0){
      ratio=plateWeight/r.serving;
    }
    // Trava de segurança: nunca permitir ratio extremo que gere valores absurdos
    ratio=Math.max(0.1,Math.min(ratio,5));
    // Build name/desc from confirmed ingredients
    const allIngs=r.ingredients||[];
    const confirmed=S.aiIngChecked?allIngs.filter((_,i)=>S.aiIngChecked[i]):allIngs;
    const descFromIngs=confirmed.length?confirmed.join(", "):(r.desc||"");
    S.aiResult={
      n:r.n,desc:descFromIngs,
      ingredients:confirmed,
      cal:Math.min(Math.round(r.cal*ratio),5000),
      p:Math.min(+(r.p*ratio).toFixed(1),400),
      c:Math.min(+(r.c*ratio).toFixed(1),600),
      f:Math.min(+(r.f*ratio).toFixed(1),300),
      serving:plateWeight>0?plateWeight:r.serving||100,
      cat:"Refeições"
    };
    S.aiPlateWeight=plateWeight;
    S.aiWeightStep=false;
    const az=d.querySelector("#aiZone");
    if(az){az.innerHTML=buildAIHtml();bindAIButtons();}
  };

  render();
  return d;
}

    if(!n){toast("Nome é obrigatório!");return;}
    saveBtn.dataset.saving="1";saveBtn.disabled=true;saveBtn.style.opacity="0.6";const oldTxt=saveBtn.textContent;saveBtn.textContent="Salvando...";
    const serving=parseFloat(d.querySelector("#mfServing").value)||100;
    const cal=parseFloat(d.querySelector("#mfC").value)||0;
    const p=parseFloat(d.querySelector("#mfP").value)||0;
    const c=parseFloat(d.querySelector("#mfCb").value)||0;
    const f=parseFloat(d.querySelector("#mfF").value)||0;
    const brand=d.querySelector("#mfBrand").value||"";
    const cat=d.querySelector("#mfCat").value||"Outros";
    const userName=S.profile?.username||S.profile?.name||S.user?.displayName||S.user?.email?.split("@")[0]||"Usuário";
    const newFood={n,cal,p,c,f,
      brand,serving,cat,
      fatSat:parseFloat(d.querySelector("#mfFs").value)||0,fatTrans:parseFloat(d.querySelector("#mfFt").value)||0,
      fiber:parseFloat(d.querySelector("#mfFib").value)||0,sugar:parseFloat(d.querySelector("#mfSug").value)||0,
      sodium:parseFloat(d.querySelector("#mfNa").value)||0,potassium:parseFloat(d.querySelector("#mfK").value)||0,
      calcium:parseFloat(d.querySelector("#mfCa").value)||0,iron:parseFloat(d.querySelector("#mfFe").value)||0,
      vitaminC:parseFloat(d.querySelector("#mfVc").value)||0,vitaminD:parseFloat(d.querySelector("#mfVd").value)||0,
      cholesterol:parseFloat(d.querySelector("#mfCol").value)||0,magnesium:parseFloat(d.querySelector("#mfMg").value)||0,
      addedBy:userName,addedById:uid(),addedAt:new Date().toISOString().split("T")[0],official:false,
    };
    try{
      const ref=await addDoc(collection(db,"communityFoods"),newFood);
      if(!S.communityFoods)S.communityFoods=[];
      S.communityFoods.push({...newFood,id:ref.id});
    }catch(e){console.error(e);saveBtn.dataset.saving="0";saveBtn.disabled=false;saveBtn.style.opacity="1";saveBtn.textContent=oldTxt;toast("Erro ao salvar o alimento. Tente novamente.","error");return;}
    const niM=S.foods.length;
    S.foods.push({n,cal,p,c,f,grams:serving,brand,serving,cat,at:new Date().toISOString()});
    if(!S.mealCat)S.mealCat={};
    S.mealCat[niM]=S.pendingMealCat||"sem_categoria";
    await saveFoods(S.foods);
    FX.food();
    S.pendingMealCat=null;
    closeModal(true);
  });
  return d;
}

function rAddExercisesModal(){

      const btn=ev.currentTarget;if(btn.dataset.saving==="1")return;btn.dataset.saving="1";btn.disabled=true;btn.style.opacity="0.6";

      }catch(e){btn.dataset.saving="0";btn.disabled=false;btn.style.opacity="1";toast("Erro ao salvar. Tente novamente.","error");}
    });
    renderFilters();renderList();updatePicked();
  };
  const renderFilters=()=>{
    const bar=d.querySelector("#pkFilters");if(!bar)return;
    bar.innerHTML=`<button class="mf ${!lG?"mf-on":""}" data-lg="">Todos</button>${MGROUPS.map(m=>`<button class="mf ${lG===m.id?"mf-on":""}" data-lg="${m.id}" style="${lG===m.id?`color:${m.color};background:${m.bg};border-color:${m.color}`:""}">${m.label}</button>`).join("")}`;
    bar.querySelectorAll("[data-lg]").forEach(b=>b.onclick=()=>{FX.tap();lG=b.dataset.lg;renderFilters();renderList();});
  };
  const renderList=()=>{
    const list=d.querySelector("#pkList");if(!list)return;
    const filtered=ALL_EX.filter(e=>{const gOk=!lG||e.group===lG;const sOk=!lF||e.name.toLowerCase().includes(lF.toLowerCase());return gOk&&sOk;});
    list.innerHTML=filtered.length===0
      ?`<div class="empty" style="padding:40px 0;text-align:center"><div style="font-size:36px;opacity:0.5">🔍</div><p style="margin-top:8px">Nenhum exercício encontrado</p></div>`
      :filtered.map(e=>{const isPicked=picked.find(p=>p.id===e.id);const m=MUSCLE_META[e.group]||{label:e.group,color:"#888",bg:"rgba(136,136,136,0.15)"};return `<div class="ex-add-row" data-eid="${e.id}"><div class="ex-add-thumb" style="display:flex;align-items:center;justify-content:center;background:${m.bg};overflow:hidden;position:relative"><img src="${gifUrl(e.id)}" loading="lazy" alt="" style="width:100%;height:100%;object-fit:cover" onload="this.classList.add('ld')" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div style="display:none;width:100%;height:100%;align-items:center;justify-content:center">${noImgHTML(true)}</div></div><div class="ex-add-info"><div class="ex-add-nm">${e.name}</div><div class="ex-add-tags"><span class="ex-tag" style="color:${m.color};background:${m.bg}">${m.label}</span><span class="ex-tq"> · ${e.eq}</span></div></div><button class="ex-add-btn ${isPicked?"ex-added":""}" data-eid="${e.id}">${isPicked?"✓":"+"}</button></div>`;}).join("");
    // Toggle in place: nada é reconstruído, então a rolagem fica exatamente onde está
    list.querySelectorAll("[data-eid]").forEach(el=>el.onclick=e=>{
      e.stopPropagation();
      const id=el.dataset.eid;const ex=ALL_EX.find(x=>x.id===id);if(!ex)return;
      FX.tap();
      const nowPicked=!picked.find(p=>p.id===id);
      picked=nowPicked?[...picked,ex]:picked.filter(p=>p.id!==id);
      list.querySelectorAll(`button[data-eid="${id}"]`).forEach(btn=>{btn.classList.toggle("ex-added",nowPicked);btn.textContent=nowPicked?"✓":"+";});
      updatePicked();
    });
    list.scrollTop=0;
  };
  const updatePicked=()=>{
    const bar=d.querySelector("#pkBar");
    if(bar)bar.innerHTML=picked.length>0?`<div class="picked-bar"><span style="font-size:12px;color:#888">${picked.length} selecionado(s):</span>${picked.map((e,i)=>`<span class="picked-pill">${i+1}.${e.name.split(" ")[0]}</span>`).join("")}</div>`:"";
    const sv=d.querySelector("#bSvEx");
    if(sv)sv.textContent=`Salvar (${picked.length} exercício${picked.length!==1?"s":""})`;
  };
  setTimeout(build,0);
  return d;
}

          <div><label style="font-size:10px;color:#888;display:block;margin-bottom:3px">REPS</label><input class="ps-inp" data-i="${i}" data-f="reps" value="${e.reps||"10-12"}" style="width:100%;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);text-align:center;font-weight:700;outline:none"/></div>
          <div><label style="font-size:10px;color:#888;display:block;margin-bottom:3px">DESC (s)</label><input class="ps-inp" data-i="${i}" data-f="rest" type="number" min="0" max="600" value="${e.rest||60}" style="width:100%;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);text-align:center;font-weight:700;outline:none"/></div>
        </div>`:""}
      </div>`;
    }).join("");
    d.querySelectorAll(".ps-tog").forEach(b=>b.onclick=()=>{const i=parseInt(b.dataset.i);if(picked.includes(i))picked=picked.filter(x=>x!==i);else picked.push(i);render();});
    d.querySelectorAll(".ps-inp").forEach(inp=>inp.oninput=e=>{const i=parseInt(inp.dataset.i);const f=inp.dataset.f;exs[i][f]=f==="reps"?inp.value:(parseInt(inp.value)||(f==="sets"?3:60));});

    startSession(chosen);
  });
  return d;
}

// Suggestion engine for automatic load adjustment
function suggestLoad(ex){
  // Returns {weight, reps, msg} based on last performance
  const hist=(S.perf||{})[ex.id];
  const repsTarget=parseInt(String(ex.reps||"10").split("-").pop())||12; // top of range
  if(!hist||!hist.weight){
    return {weight:0,reps:String(ex.reps||"10").split("-")[0],msg:null};
  }
  const lastW=hist.weight, lastReps=hist.reps, lastDone=hist.allDone;
  let w=lastW, msg="";
  // Rule: hit/exceeded top of range with all sets done → increase
  if(lastDone&&lastReps>=repsTarget){
    const inc=lastW>=20?2.5:lastW>=10?2:1;
    w=lastW+inc;
    msg=`📈 Você fez ${lastReps} reps fácil com ${lastW}kg. Hoje: <strong>${w}kg</strong> (+${inc}).`;
  } else if(!lastDone||lastReps<Math.max(1,repsTarget-4)){
    // Failed a lot → reduce
    const dec=lastW>=20?2.5:lastW>=10?2:1;
    w=Math.max(0,lastW-dec);
    msg=`📉 Última vez ficou pesado (${lastReps} reps). Hoje: <strong>${w}kg</strong> (-${dec}).`;
  } else {
    // Stayed in range → keep, aim for more reps
    w=lastW;
    msg=`➡️ Mantenha ${lastW}kg e tente bater ${repsTarget} reps para subir a carga.`;
  }
  return {weight:w,reps:String(ex.reps||"10").split("-")[0],msg};
}

let sessionTimer=null;
function startSession(exercises){
  if(!exercises?.length)return toast("Adicione exercícios ao treino primeiro!");
  clearInterval(restTimer);clearInterval(sessionTimer);
  S.session={exercises,idx:0,sets:exercises.map(e=>{
    const sug=suggestLoad(e);
    return Array.from({length:e.sets||3},()=>({reps:sug.reps,weight:sug.weight,done:false}));
  }),suggestions:exercises.map(e=>suggestLoad(e).msg),restActive:false,restLeft:0,restTotal:0,
    startTime:null,elapsed:0,restAccum:0,restStartedAt:null,notStarted:true};
  r();
}
// Inicia de fato o cronômetro (após o aviso "Iniciar treino").
function beginSessionTimer(){
  if(!S.session)return;
  S.session.notStarted=false;
  S.session.startTime=Date.now();
  S.session.elapsed=0;
  clearInterval(sessionTimer);
  sessionTimer=setInterval(()=>{
    if(!S.session){clearInterval(sessionTimer);return;}
    S.session.elapsed=Math.floor((Date.now()-S.session.startTime)/1000);
    const el=document.getElementById("sessClock");if(el)el.textContent=fmtTime(S.session.elapsed);
  },1000);
  r();
}
function fmtTime(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}
function fmtClock(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return h>0?`${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`:`${m}:${String(ss).padStart(2,"0")}`;}
// Encerra o descanso ativo e contabiliza o tempo REAL descansado.
function endRest(natural){
  if(S.session&&S.session.restActive){
    if(S.session.restStartedAt){
      const real=Math.round((Date.now()-S.session.restStartedAt)/1000);
      S.session.restAccum=(S.session.restAccum||0)+Math.max(0,real);
    }
    S.session.restActive=false;S.session.restStartedAt=null;
  }
  clearInterval(restTimer);
}

  });
  d.querySelector("#bAddSet")?.addEventListener("click",()=>{const last=S.session.sets[idx][S.session.sets[idx].length-1];S.session.sets[idx].push({reps:last?.reps||"10",weight:last?.weight||0,done:false});r();});

}

  if(S.darkMode===false){
    root.style.setProperty('--bg','#F0F0F0');
    root.style.setProperty('--bg2','#E5E5E5');

// AUTH + BOOT
// ═══════════════════════════════════════════
async function authOk(user){
  S.user=user;
  try{
    const p=await loadProfile();
    if(p){S.profile=p;if(typeof p.darkMode!=="undefined")S.darkMode=p.darkMode;applyTheme();computeTMB();
      S.calDate=new Date().toISOString().split("T")[0];
      try{S.foods=await loadFoods();}catch(e){S.foods=[];}
      try{const w=await loadWater();S.waterMl=w.ml;S.waterHistory=w.history;}catch(e){S.waterMl=0;S.waterHistory=[];}
      try{S.workouts=await loadWorkouts();}catch(e){S.workouts=[];}
      try{S.schedule=await loadSchedule();}catch(e){S.schedule={};}
      try{S.perf=await loadPerf();}catch(e){S.perf={};}
      try{S.usage=await loadUsage();}catch(e){S.usage={};}
      try{S.history=await loadHistory();}catch(e){S.history={};}
      // Load community foods from Firestore
      try{const cSnap=await getDocs(collection(db,"communityFoods"));S.communityFoods=cSnap.docs.map(d=>({id:d.id,...d.data()}));}catch(e){S.communityFoods=[];}
      indexUser();
      S.phase="home";
    }else{S.phase="onboard";S.onboard={step:0,data:{sex:"",age:"",weight:"",height:"",activity:"",goal:"",trainDays:[],split:""}};}
  }catch(e){S.phase="onboard";}
  r();
}

const SPLASH_START=Date.now();
const SPLASH_MIN=1900; // ms — tempo mínimo para a animação tocar
async function leaveSplash(fn){
  const elapsed=Date.now()-SPLASH_START;
  if(elapsed<SPLASH_MIN)await new Promise(res=>setTimeout(res,SPLASH_MIN-elapsed));
  await fn();
}

onAuthStateChanged(auth,async user=>{
  if(user&&(S.phase==="splash"||S.phase==="login"))await leaveSplash(()=>authOk(user));
  else if(!user&&S.phase==="splash"){await leaveSplash(async()=>{S.phase="login";r();});}
});

// Show splash immediately
applyTheme();
r();
// Safety fallback
setTimeout(()=>{if(S.phase==="splash"){S.phase="login";r();}},4500);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
