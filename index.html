// PLANOS (Free / Premium)
// ═══════════════════════════════════════════
const PLAN_LIMITS={
  free:{aiWorkoutsPerWeek:3,aiFoodPerDay:5,coachPerDay:5},
  premium:{aiWorkoutsPerWeek:Infinity,aiFoodPerDay:Infinity,coachPerDay:Infinity},
};
function isPremium(){return (S.profile?.plan)==="premium";}
function planLimit(key){return PLAN_LIMITS[isPremium()?"premium":"free"][key];}
function weekKey(){const d=new Date();const onejan=new Date(d.getFullYear(),0,1);const wk=Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7);return d.getFullYear()+"-W"+wk;}
function dayKey(){return new Date().toISOString().split("T")[0];}
// Returns how many uses remain for a feature; Infinity if premium
function usesLeft(feature){
  if(isPremium())return Infinity;
  const u=S.usage||{};
  if(feature==="aiWorkout"){const used=(u.aiWorkout&&u.aiWorkout.k===weekKey())?u.aiWorkout.n:0;return Math.max(0,planLimit("aiWorkoutsPerWeek")-used);}
  if(feature==="aiFood"){const used=(u.aiFood&&u.aiFood.k===dayKey())?u.aiFood.n:0;return Math.max(0,planLimit("aiFoodPerDay")-used);}
  if(feature==="coach"){const used=(u.coach&&u.coach.k===dayKey())?u.coach.n:0;return Math.max(0,planLimit("coachPerDay")-used);}
  return Infinity;
}
function consumeUse(feature){
  if(isPremium())return true;
  if(!S.usage)S.usage={};
  const k=feature==="aiWorkout"?weekKey():dayKey();
  const cur=S.usage[feature];
  if(!cur||cur.k!==k)S.usage[feature]={k,n:0};
  S.usage[feature].n++;
  saveUsage(S.usage);
  return true;
}
function showPremiumGate(reason){
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:600;display:flex;align-items:flex-end;justify-content:center";
  ov.innerHTML=`<div style="background:var(--bg2);border-top-left-radius:24px;border-top-right-radius:24px;padding:24px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto">
    <div style="text-align:center;margin-bottom:18px">
      <div style="font-size:48px">⭐</div>
      <div style="font-size:22px;font-weight:800;color:var(--text);margin-top:6px">BoltFit Premium</div>
      ${reason?`<div style="font-size:13px;color:var(--orange);margin-top:8px;background:rgba(255,107,0,0.1);border-radius:10px;padding:10px">${reason}</div>`:""}
    </div>
    <div style="font-size:13px;color:#888;margin-bottom:6px;font-weight:700">DESBLOQUEIE COM O PREMIUM</div>
    ${[
      ["🤖","IA ilimitada","Treinos e análises de comida sem limite"],
      ["📈","Progressão inteligente","A IA ajusta carga, reps e descanso automaticamente"],
      ["🍽️","Dieta automática","Gera refeições e substitui alimentos por você"],
      ["📊","Relatórios avançados","Gráficos de evolução e previsão de resultados"],
      ["🚫","Sem anúncios","Experiência limpa e sem interrupções"],
    ].map(([ic,t,d])=>`<div style="display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border)"><div style="font-size:22px;flex-shrink:0">${ic}</div><div><div style="font-weight:700;font-size:14px;color:var(--text)">${t}</div><div style="font-size:12px;color:#888">${d}</div></div></div>`).join("")}
    <button class="btn-primary" id="pgUpgrade" style="width:100%;margin-top:18px;padding:15px;font-size:15px;background:linear-gradient(135deg,#FF6B00,#FF8C42)">⭐ Quero ser Premium</button>
    <button class="btn-sec" id="pgClose" style="width:100%;margin-top:8px;padding:13px">Agora não</button>
  </div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.querySelector("#pgClose").onclick=()=>ov.remove();
  ov.querySelector("#pgUpgrade").onclick=()=>{
    ov.remove();
    // Cobrança real exige gateway de pagamento + servidor. Por ora, ativação manual.
    if(confirm("O pagamento online ainda será configurado.\n\nDeseja ativar o Premium neste dispositivo agora (modo teste)?")){
      if(!S.profile)S.profile={};
      S.profile.plan="premium";
      saveProfile(S.profile);
      alert("✅ Premium ativado! Aproveite a IA ilimitada.");
      r();
    }
  };
}

const D=(cls,html="")=>{const e=document.createElement("div");e.className=cls;if(html)e.innerHTML=html;return e;};
const today=()=>new Date().getDay();
const WD=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

function computeTMB(){
  const p=S.profile||S.onboard?.data;if(!p)return;
  const w=parseFloat(p.weight),h=parseFloat(p.height),a=parseFloat(p.age);if(!w||!h||!a)return;
  const bmr=p.sex==="M"?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
  const acts={sed:1.2,light:1.375,mod:1.55,active:1.725,very:1.9};
  const tdee=bmr*(acts[p.activity]||1.55);
  S.tmb=Math.round(bmr);
  S.targetCal=p.goal==="lose"?Math.round(tdee-400):p.goal==="gain"?Math.round(tdee+350):Math.round(tdee);
  if(S.profile){S.profile.tmb=S.tmb;S.profile.targetCal=S.targetCal;}
}

}

function bindOb(d,step){
  d.querySelectorAll("[data-sex]").forEach(b=>b.onclick=()=>{S.onboard.data.sex=b.dataset.sex;d.querySelectorAll("[data-sex]").forEach(x=>x.classList.toggle("sel",x===b));});

  d.querySelectorAll("[data-split]").forEach(b=>b.onclick=()=>{S.onboard.data.split=b.dataset.split;d.querySelectorAll("[data-split]").forEach(x=>x.classList.toggle("sel",x===b));});
  d.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{
    const i=parseInt(b.dataset.day);
    if(S.onboard.data.trainDays.includes(i))S.onboard.data.trainDays=S.onboard.data.trainDays.filter(x=>x!==i);
    else S.onboard.data.trainDays.push(i);
    b.classList.toggle("sel");
    const p=d.querySelector("#dayCount");if(p)p.textContent=`${S.onboard.data.trainDays.length} dia(s) selecionado(s)`;
  });
}
function collectOb(d,step){
  if(step===0&&d.querySelector("#fuser")?.value)S.onboard.data.username=d.querySelector("#fuser").value.trim();
  if(step===1&&d.querySelector("#fa")?.value)S.onboard.data.age=d.querySelector("#fa").value;

// Smart motivational message based on day, time and schedule
function motivationMsg(){
  const p=S.profile||{};
  const trainDays=p.trainDays||[];
  const now=new Date();
  const dow=now.getDay();
  const hour=now.getHours();
  const isTrainDay=trainDays.includes(dow);
  const sched=(S.schedule||{})[dow];
  const name=(p.username||p.name||"").split(" ")[0];
  if(!isTrainDay){
    return {icon:"😌",text:"Hoje é dia de descanso. Recuperação também faz parte do progresso — durma bem e se alimente direito."};
  }
  if(sched){
    if(hour<12)return {icon:"☀️",text:`Hoje tem <strong>${sched.name}</strong>! Já deixa o treino engatilhado pra mais tarde. Bora começar bem o dia.`};
    if(hour<18)return {icon:"💪",text:`Seu treino <strong>${sched.name}</strong> está te esperando. Bora pra cima${name?", "+name:""}!`};
    return {icon:"🔥",text:`Ainda dá tempo do <strong>${sched.name}</strong> hoje! 20 minutos já fazem diferença. Vamos?`};
  }
  return {icon:"📋",text:"Hoje é dia de treino, mas você ainda não atribuiu um treino. Toque em \"Montar treino com IA\" ou escolha um dos seus."};
}

function rAgenda(){
  const d=D("tab-page");
  const p=S.profile;
  const name=(p?.name||"Atleta").split(" ")[0];
  const trainDays=p?.trainDays||[];
  const isToday=trainDays.includes(today());
  // Auto-clean: remove schedule entries pointing to deleted workouts
  let schedDirty=false;

        <div style="max-height:55vh;overflow-y:auto;padding:2px">
        ${(w.exercises||[]).map((ex,i)=>{const m=MUSCLE_META[ex.group]||{label:ex.group||"",color:"#FF6B00",bg:"rgba(255,107,0,0.12)"};return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px">
          <div style="width:38px;height:38px;border-radius:9px;background:${m.bg};display:flex;align-items:center;justify-content:center;flex-shrink:0">${muscleSVG(ex.group,m.color)}</div>
          <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px">${i+1}. ${ex.name}</div><div style="font-size:12px;color:${m.color}">${ex.sets||3}×${ex.reps||"10-12"} · descanso ${ex.rest||60}s</div></div>
        </div>`;}).join("")}
        </div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn-sec" id="bRegen" style="flex:1;padding:13px">↺ Gerar outro</button>
          <button class="btn-primary" id="bSaveAIW" style="flex:2;padding:13px">✓ Salvar treino</button>
        </div>`;
      d2.querySelector("#bX").onclick=closeModal;
      d2.querySelector("#bRegen").onclick=()=>{S.aiwResult=null;S.aiwStep=0;render();};
      d2.querySelector("#bSaveAIW").onclick=async(ev)=>{
        const btn=ev.currentTarget;if(btn.dataset.s==="1")return;btn.dataset.s="1";btn.disabled=true;btn.style.opacity="0.6";btn.textContent="Salvando...";
        try{
          const muscles=[...new Set((w.exercises||[]).map(e=>e.group))];
          const wk={name:w.name||"Treino IA",letter:(w.name||"IA")[0].toUpperCase(),muscles,exercises:w.exercises||[]};

    d2.innerHTML=`<div class="modal-handle"></div><div class="modal-hdr"><div><div class="modal-sub">PERGUNTA ${S.aiwStep+1} DE ${steps.length+1}</div><div class="modal-title">${step.q}</div></div><button class="close-x" id="bX">✕</button></div>
      <div style="display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;padding:2px">
        ${step.opts.map(([v,label])=>`<button class="aiw-opt" data-v="${v}" style="padding:16px;background:${S.aiwData[step.key]===v?"rgba(255,107,0,0.15)":"var(--bg2)"};border:1.5px solid ${S.aiwData[step.key]===v?"var(--orange)":"var(--border)"};border-radius:14px;color:var(--text);font-weight:600;font-size:15px;text-align:left;cursor:pointer">${label}</button>`).join("")}

  const renderInjuries=()=>{
    d2.innerHTML=`<div class="modal-handle"></div><div class="modal-hdr"><div><div class="modal-sub">PERGUNTA ${steps.length+1} DE ${steps.length+1}</div><div class="modal-title">Tem alguma lesão ou limitação?</div></div><button class="close-x" id="bX">✕</button></div>
      <div style="font-size:13px;color:#888;margin-bottom:10px">Opcional. Ex: "dor no ombro", "lesão no joelho", "hérnia". A IA vai evitar exercícios que possam te machucar.</div>
      <textarea id="aiwInjury" placeholder="Deixe em branco se não tiver nenhuma..." style="width:100%;min-height:80px;padding:14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;outline:none;resize:vertical">${S.aiwData.injury||""}</textarea>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn-sec" id="bBack" style="flex:1;padding:13px">← Voltar</button>
        <button class="btn-primary" id="bGen" style="flex:2;padding:13px">🤖 Gerar treino</button>
      </div>`;
    d2.querySelector("#bX").onclick=closeModal;
    d2.querySelector("#bBack").onclick=()=>{render();};
    d2.querySelector("#bGen").onclick=()=>{S.aiwData.injury=d2.querySelector("#aiwInjury").value.trim();generateWorkout();};
  };

  const generateWorkout=async()=>{
    // Limit check (free plan)
    if(usesLeft("aiWorkout")<=0){
      S.aiwLoading=false;
      showPremiumGate("Você atingiu o limite de "+PLAN_LIMITS.free.aiWorkoutsPerWeek+" treinos com IA por semana do plano grátis.");
      return;
    }
    consumeUse("aiWorkout");
    S.aiwLoading=true;render();
    const dt=S.aiwData;
    const goalMap={hipertrofia:"hipertrofia (ganho de massa muscular)",emagrecer:"emagrecimento",forca:"força máxima",resistencia:"resistência e condicionamento"};
    const equipMap={academia:"academia completa (máquinas, barras, halteres, polias)",halteres:"apenas halteres",casa:"apenas peso do corpo (em casa, sem equipamentos)",barra:"barra e anilhas"};
    const focusMap={fullbody:"corpo todo",upper:"membros superiores",lower:"membros inferiores",push:"empurrar (peito, ombro, tríceps)",pull:"puxar (costas, bíceps)",legs:"pernas"};
    const validGroups="peito, costas, pernas, ombros, biceps, triceps, abdomen, gluteos, trapezio, antebraco";
    const prompt=`Voce e um personal trainer experiente. Monte um treino de musculacao personalizado em portugues do Brasil.
Perfil do aluno:
- Objetivo: ${goalMap[dt.goal]||dt.goal}
- Nivel: ${dt.level}
- Tempo disponivel: ${dt.time} minutos
- Equipamento: ${equipMap[dt.equip]||dt.equip}
- Foco: ${focusMap[dt.focus]||dt.focus}
- Lesoes/limitacoes: ${dt.injury||"nenhuma"}
Regras: escolha uma quantidade de exercicios compativel com o tempo (mais ou menos 1 exercicio a cada 6-8 min). Respeite o equipamento disponivel. Evite exercicios que agravem as lesoes citadas. Ajuste series/reps/descanso ao objetivo (hipertrofia 8-12 reps descanso 60-90s; forca 3-6 reps descanso 120-180s; emagrecer/resistencia 12-20 reps descanso 30-45s). Para cada exercicio defina o campo "group" usando SOMENTE um destes valores: ${validGroups}. Responda em portugues.`;
    try{
      const resp=await fetch("https://boltfit-ia.vitortorresdarosa.workers.dev",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{parts:[{text:prompt}]}],
          generationConfig:{
            temperature:0.5,maxOutputTokens:2048,thinkingConfig:{thinkingBudget:0},
            responseMimeType:"application/json",
            responseSchema:{type:"OBJECT",properties:{
              name:{type:"STRING"},desc:{type:"STRING"},
              exercises:{type:"ARRAY",items:{type:"OBJECT",properties:{
                name:{type:"STRING"},group:{type:"STRING"},sets:{type:"NUMBER"},reps:{type:"STRING"},rest:{type:"NUMBER"},muscles:{type:"STRING"}
              },required:["name","group","sets","reps","rest"]}}
            },required:["name","exercises"]}
          }
        })
      });
      if(!resp.ok){
        if(resp.status===429)throw new Error("Limite de uso da IA atingido. Aguarde 1 minuto.");
        throw new Error("Falha na IA ("+resp.status+").");
      }
      const data=await resp.json();
      let txt=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
      txt=txt.replace(/```json|```/g,"").trim();
      let result=null;
      try{result=JSON.parse(txt);}catch(e){
        const s=txt.indexOf("{");if(s>=0){let dep=0,end=-1;for(let i=s;i<txt.length;i++){if(txt[i]==="{")dep++;else if(txt[i]==="}"){dep--;if(dep===0){end=i;break;}}}if(end>s){try{result=JSON.parse(txt.slice(s,end+1));}catch(e2){}}}
      }
      if(!result||!result.exercises)throw new Error("A IA respondeu de forma incompleta. Tente novamente.");
      // Give each exercise an id and normalize group
      const valid=["peito","costas","pernas","ombros","biceps","triceps","abdomen","gluteos","trapezio","antebraco"];
      result.exercises=result.exercises.map((ex,i)=>({
        id:"aiw"+Date.now()+"_"+i,
        name:ex.name,group:valid.includes(ex.group)?ex.group:"peito",
        sets:Number(ex.sets)||3,reps:ex.reps||"10-12",rest:Number(ex.rest)||60,muscles:ex.muscles||""
      }));
      S.aiwResult=result;S.aiwLoading=false;render();
    }catch(err){
      S.aiwLoading=false;
      alert((err&&err.message)?err.message:"Erro ao gerar treino. Tente novamente.");
      render();
    }
  };

  render();
  return d;
}

          ?`<div style="align-self:flex-start;max-width:85%;background:var(--bg3);border-radius:14px;border-top-left-radius:4px;padding:11px 13px;font-size:14px;line-height:1.5;color:var(--text);white-space:pre-wrap">${m.text}</div>`
          :`<div style="align-self:flex-end;max-width:85%;background:var(--orange);border-radius:14px;border-top-right-radius:4px;padding:11px 13px;font-size:14px;line-height:1.5;color:#fff;white-space:pre-wrap">${m.text}</div>`
        ).join("")}
        ${S.coachLoading?`<div style="align-self:flex-start;background:var(--bg3);border-radius:14px;padding:11px 13px;font-size:14px;color:#888">digitando<span class="dots">...</span></div>`:""}
      </div>
      ${S.coachMsgs.length<=1?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px">${suggestions.map(s=>`<button class="coach-sug" data-q="${s.replace(/"/g,"&quot;")}" style="font-size:12px;padding:7px 11px;background:var(--bg3);border:1px solid var(--border);border-radius:16px;color:var(--text2);cursor:pointer">${s}</button>`).join("")}</div>`:""}
      <div style="display:flex;gap:8px;margin-top:10px;align-items:flex-end">
        <textarea id="coachInp" placeholder="Pergunte algo..." rows="1" style="flex:1;padding:12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;outline:none;resize:none;max-height:100px"></textarea>
        <button id="coachSend" style="width:48px;height:48px;background:var(--orange);border:none;border-radius:12px;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0">➤</button>
      </div>`;
    d2.querySelector("#bX").onclick=closeModal;
    const scroll=d2.querySelector("#coachScroll");if(scroll)scroll.scrollTop=scroll.scrollHeight;
    d2.querySelectorAll(".coach-sug").forEach(b=>b.onclick=()=>send(b.dataset.q));
    d2.querySelector("#coachSend").onclick=()=>{const inp=d2.querySelector("#coachInp");send(inp.value);};
    const inp=d2.querySelector("#coachInp");
    if(inp)inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(inp.value);}};
  };

  const send=async(text)=>{
    text=(text||"").trim();
    if(!text||S.coachLoading)return;
    if(usesLeft("coach")<=0){showPremiumGate("Você atingiu o limite de "+PLAN_LIMITS.free.coachPerDay+" perguntas ao Coach IA por dia do plano grátis.");return;}
    consumeUse("coach");
    S.coachMsgs.push({role:"user",text});
    S.coachLoading=true;render();
    // Build context from profile
    const p=S.profile||{};
    const ctx=`Perfil do usuario: ${p.age||"?"} anos, ${p.weight||"?"}kg, ${p.height||"?"}cm, objetivo: ${({lose:"emagrecer",maintain:"manutencao",gain:"ganhar massa"})[p.goal]||"?"}, divisao de treino: ${p.split||"?"}.`;
    const history=S.coachMsgs.slice(-8).map(m=>`${m.role==="user"?"Usuario":"Coach"}: ${m.text}`).join("\n");
    const prompt=`Voce e um personal trainer e nutricionista experiente, simpatico e direto, respondendo em portugues do Brasil. Responda de forma clara e pratica, sem enrolacao, como um coach de verdade no WhatsApp. Use no maximo 4 frases curtas, a nao ser que a pergunta exija mais detalhes. Se a pergunta for sobre dor ou lesao seria, recomende procurar um medico/fisioterapeuta. Se a pergunta nao tiver nada a ver com treino, nutricao ou saude, redirecione gentilmente para esses temas.\n\n${ctx}\n\nConversa ate agora:\n${history}\n\nResponda a ultima mensagem do usuario.`;
    try{
      const resp=await fetch("https://boltfit-ia.vitortorresdarosa.workers.dev",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.6,maxOutputTokens:600,thinkingConfig:{thinkingBudget:0}}})
      });
      if(!resp.ok){
        if(resp.status===429)throw new Error("Limite de uso da IA atingido. Aguarde 1 minuto.");
        throw new Error("Falha na IA ("+resp.status+").");
      }
      const data=await resp.json();
      let txt=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
      txt=txt.trim()||"Desculpe, não consegui responder. Tente reformular a pergunta.";
      S.coachMsgs.push({role:"assistant",text:txt});
    }catch(err){
      S.coachMsgs.push({role:"assistant",text:"⚠️ "+((err&&err.message)||"Erro ao responder. Tente novamente.")});
    }
    S.coachLoading=false;render();
  };

  render();
  return d;
}

        <div style="max-height:56vh;overflow-y:auto;padding:2px">
        ${(r.meals||[]).map(meal=>{const mc=Math.round((meal.items||[]).reduce((x,it)=>x+(Number(it.cal)||0),0));return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-weight:800;font-size:15px;color:var(--text)">${meal.name}</div><div style="font-size:13px;color:var(--orange);font-weight:700">${mc} kcal</div></div>
          ${(meal.items||[]).map(it=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--text2)"><span>• ${it.food} <span style="color:#666">(${it.qty||""})</span></span><span style="color:#888;flex-shrink:0;margin-left:8px">${Number(it.cal)||0} kcal</span></div>`).join("")}
          <button class="diet-add-meal" data-meal='${encodeURIComponent(JSON.stringify(meal))}' style="width:100%;margin-top:8px;padding:9px;background:var(--bg3);border:1px dashed var(--orange);border-radius:10px;color:var(--orange);font-size:13px;font-weight:700;cursor:pointer">+ Adicionar esta refeição ao diário</button>
        </div>`;}).join("")}
        ${r.tips?`<div style="background:rgba(255,107,0,0.08);border-radius:12px;padding:12px;font-size:12px;color:#aaa;line-height:1.5">💡 ${r.tips}</div>`:""}
        </div>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn-sec" id="bDietRegen" style="flex:1;padding:13px">↺ Gerar outra</button>
          <button class="btn-primary" id="bDietAddAll" style="flex:2;padding:13px">✓ Adicionar dia todo</button>

      d2.querySelector("#bX").onclick=closeModal;

      d2.querySelectorAll(".diet-add-meal").forEach(b=>b.onclick=()=>{

      });
      d2.querySelector("#bDietAddAll").onclick=async(ev)=>{
        const btn=ev.currentTarget;if(btn.dataset.s==="1")return;btn.dataset.s="1";btn.disabled=true;btn.style.opacity="0.6";btn.textContent="Adicionando...";
        (r.meals||[]).forEach(meal=>addMealToDiary(meal));
        await saveFoods(S.foods);
        closeModal();S.tab="calorias";r();
      };

    }
    // Intro
    d2.innerHTML=`<div class="modal-handle"></div><div class="modal-hdr"><div class="modal-title">🍽️ Dieta automática</div><button class="close-x" id="bX">✕</button></div>
      <div style="padding:6px 0 16px">
        <div style="font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:14px">A IA vai montar um plano de refeições para hoje baseado na sua meta de <strong style="color:var(--orange)">${S.targetCal||0} kcal</strong> e no objetivo de <strong>${({lose:"emagrecer",maintain:"manter",gain:"ganhar massa"})[S.profile?.goal]||"saúde"}</strong>.</div>
        <div style="font-size:13px;color:#888;margin-bottom:8px">Alguma preferência ou restrição? (opcional)</div>
        <textarea id="dietPref" placeholder="Ex: sou vegetariano, não como lactose, prefiro comida simples, low carb..." style="width:100%;min-height:70px;padding:13px;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;outline:none;resize:vertical"></textarea>
      </div>
      <button class="btn-primary" id="bGenDiet" style="width:100%;padding:14px;background:linear-gradient(135deg,#FF6B00,#FF8C42)">🤖 Gerar minha dieta</button>`;
    d2.querySelector("#bX").onclick=closeModal;
    d2.querySelector("#bGenDiet").onclick=()=>{S.dietPref=(d2.querySelector("#dietPref").value||"").trim();generateDiet();};
  };

  const addMealToDiary=(meal)=>{
    const catMap={"café da manhã":"cafe","cafe da manha":"cafe","almoço":"almoco","almoco":"almoco","lanche":"lanche","lanche da tarde":"lanche","jantar":"jantar","ceia":"ceia"};
    const key=catMap[(meal.name||"").toLowerCase()]||"sem_categoria";
    (meal.items||[]).forEach(it=>{
      const ni=S.foods.length;
      const grams=parseFloat(String(it.qty||"").replace(/[^0-9.]/g,""))||100;
      S.foods.push({n:it.food,cal:Number(it.cal)||0,p:Number(it.p)||0,c:Number(it.c)||0,f:Number(it.f)||0,grams});
      if(!S.mealCat)S.mealCat={};
      S.mealCat[ni]=key;
    });
  };

  const generateDiet=async()=>{
    if(usesLeft("aiWorkout")<=0&&!isPremium()){
      // reuse aiWorkout weekly limit bucket? No — diet is premium-flavored. Use its own gentle gate:
    }
    S.dietLoading=true;render();
    const p=S.profile||{};
    const goal=({lose:"emagrecimento (deficit calorico)",maintain:"manutencao",gain:"ganho de massa muscular (superavit)"})[p.goal]||"saude";
    const prompt=`Voce e um nutricionista. Monte um plano alimentar de UM dia em portugues do Brasil para uma pessoa com meta de ${S.targetCal||2000} kcal/dia, objetivo de ${goal}, ${p.weight||"?"}kg. Distribua em refeicoes (Cafe da Manha, Almoco, Lanche da Tarde, Jantar e Ceia se fizer sentido). Use alimentos comuns e baratos do Brasil. ${S.dietPref?("Preferencias/restricoes do usuario: "+S.dietPref+".") : ""} Para cada item informe: food (nome), qty (quantidade ex '100g' ou '2 unidades'), cal (kcal), p (proteina g), c (carbo g), f (gordura g). A soma do dia deve ficar proxima da meta. Responda em portugues.`;
    try{
      const resp=await fetch("https://boltfit-ia.vitortorresdarosa.workers.dev",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{
          temperature:0.5,maxOutputTokens:2048,thinkingConfig:{thinkingBudget:0},
          responseMimeType:"application/json",
          responseSchema:{type:"OBJECT",properties:{
            meals:{type:"ARRAY",items:{type:"OBJECT",properties:{
              name:{type:"STRING"},
              items:{type:"ARRAY",items:{type:"OBJECT",properties:{food:{type:"STRING"},qty:{type:"STRING"},cal:{type:"NUMBER"},p:{type:"NUMBER"},c:{type:"NUMBER"},f:{type:"NUMBER"}},required:["food","cal"]}}
            },required:["name","items"]}},
            tips:{type:"STRING"}
          },required:["meals"]}
        }})
      });
      if(!resp.ok){if(resp.status===429)throw new Error("Limite de uso da IA. Aguarde 1 minuto.");throw new Error("Falha na IA ("+resp.status+").");}
      const data=await resp.json();
      let txt=data?.candidates?.[0]?.content?.parts?.map(x=>x.text||"").join("")||"";
      txt=txt.replace(/```json|```/g,"").trim();
      let result=null;
      try{result=JSON.parse(txt);}catch(e){const s=txt.indexOf("{");if(s>=0){let dep=0,end=-1;for(let i=s;i<txt.length;i++){if(txt[i]==="{")dep++;else if(txt[i]==="}"){dep--;if(dep===0){end=i;break;}}}if(end>s){try{result=JSON.parse(txt.slice(s,end+1));}catch(e2){}}}}
      if(!result||!result.meals)throw new Error("A IA respondeu de forma incompleta. Tente novamente.");
      S.dietResult=result;S.dietLoading=false;render();
    }catch(err){
      S.dietLoading=false;alert((err&&err.message)||"Erro ao gerar dieta.");render();
    }
  };

  render();
  return d;
}

// ─── RELATÓRIOS E EVOLUÇÃO ───
function rReportsModal(){
  const d=D("overlay");
  d.innerHTML=`<div class="modal-sheet"></div>`;
  const d2=d.querySelector(".modal-sheet");
  d.onclick=e=>{if(e.target===d)closeModal();};

  // Build a polished SVG line chart from [{x,y}] points
  const lineChart=(points,color,unit)=>{
    if(!points||points.length<2)return `<div style="text-align:center;padding:28px 0;color:var(--text3);font-size:13px"><div style="font-size:28px;margin-bottom:6px;opacity:0.5">📈</div>Registre dados por alguns dias<br>para ver o gráfico aqui.</div>`;
    const W=300,H=130,pad=10;
    const ys=points.map(p=>p.y);
    let min=Math.min(...ys),max=Math.max(...ys);
    if(min===max){min=min-1;max=max+1;}
    const sx=i=>pad+(i/(points.length-1))*(W-2*pad);
    const sy=v=>H-pad-((v-min)/(max-min))*(H-2*pad);
    const path=points.map((p,i)=>`${i===0?"M":"L"}${sx(i).toFixed(1)},${sy(p.y).toFixed(1)}`).join(" ");
    const area=`M${sx(0)},${H-pad} `+points.map((p,i)=>`L${sx(i).toFixed(1)},${sy(p.y).toFixed(1)}`).join(" ")+` L${sx(points.length-1)},${H-pad} Z`;
    const last=points[points.length-1].y, first=points[0].y;
    const diff=last-first;
    const gid="g"+color.replace('#','')+Math.random().toString(36).slice(2,5);
    // grid lines (3 horizontais)
    const grid=[0,0.5,1].map(t=>{const y=pad+t*(H-2*pad);return `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>`;}).join("");
    const dots=points.map((p,i)=>`<circle cx="${sx(i).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="${i===points.length-1?4.5:2.5}" fill="${color}" ${i===points.length-1?`stroke="var(--bg2)" stroke-width="2"`:""}/>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#${gid})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:6px;font-weight:600"><span>Início: ${first.toFixed(unit==="kg"?1:0)}${unit}</span><span style="color:${diff>0?"#22D3A5":diff<0?"#FF6B6B":"var(--text3)"};font-weight:800">${diff>0?"▲ +":diff<0?"▼ ":""}${diff.toFixed(unit==="kg"?1:0)}${unit}</span><span>Agora: ${last.toFixed(unit==="kg"?1:0)}${unit}</span></div>`;
  };

  const hist=S.history||{};
  const dates=Object.keys(hist).sort();
  const last14=dates.slice(-14);
  const weightPts=last14.filter(k=>hist[k].weight).map(k=>({x:k,y:hist[k].weight}));
  const calPts=last14.filter(k=>typeof hist[k].cal==="number").map(k=>({x:k,y:hist[k].cal}));

  // Load progression: from perf, top exercises
  const perf=S.perf||{};
  const exNames={};
  Object.values(EXERCISES).flat().forEach(e=>{exNames[e.id]=e.name;});
  S.workouts.forEach(w=>(w.exercises||[]).forEach(e=>{if(e.id&&e.name)exNames[e.id]=e.name;}));
  const perfList=Object.keys(perf).map(id=>({name:exNames[id]||"Exercício",weight:perf[id].weight,reps:perf[id].reps,date:perf[id].date})).filter(x=>x.weight>0).slice(0,8);

  const totalWorkouts=Object.keys(perf).length;
  const trainDaysLogged=dates.length;

  // Weight delta + goal context
  const wDelta=weightPts.length>=2?(weightPts[weightPts.length-1].y-weightPts[0].y):0;
  const curWeight=weightPts.length?weightPts[weightPts.length-1].y:(S.profile?.weight||0);
  const goalLbl={lose:"Emagrecer",maintain:"Manutenção",gain:"Ganhar massa"}[S.profile?.goal]||"Saúde";

  const statCard=(icon,value,label,color)=>`<div style="background:var(--bg3);border-radius:16px;padding:15px 12px;text-align:center;border:1px solid var(--border)">
    <div style="font-size:22px;margin-bottom:4px">${icon}</div>
    <div style="font-size:22px;font-weight:800;color:${color};line-height:1.1">${value}</div>
    <div style="font-size:10.5px;color:var(--text3);margin-top:3px;font-weight:600;letter-spacing:0.3px">${label}</div>
  </div>`;

  d2.innerHTML=`<div class="modal-handle"></div>
    <div class="modal-hdr"><div><div class="modal-title">📊 Relatórios e Evolução</div><div class="modal-sub">Acompanhe seu progresso</div></div><button class="close-x" id="bX">✕</button></div>
    <div style="max-height:66vh;overflow-y:auto;padding:2px;-webkit-overflow-scrolling:touch">

      <div style="background:linear-gradient(135deg,rgba(255,107,0,0.18),rgba(255,140,66,0.06));border:1px solid rgba(255,107,0,0.3);border-radius:18px;padding:16px;margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:11px;color:var(--orange);font-weight:700;letter-spacing:1px">OBJETIVO ATUAL</div>
            <div style="font-size:20px;font-weight:800;color:var(--text);margin-top:2px">${goalLbl}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:26px;font-weight:900;color:var(--orange)">${curWeight||"—"}<span style="font-size:14px">kg</span></div>
            ${wDelta!==0?`<div style="font-size:12px;font-weight:700;color:${wDelta<0?"#22D3A5":"#FF8C42"}">${wDelta>0?"+":""}${wDelta.toFixed(1)}kg no período</div>`:`<div style="font-size:11px;color:var(--text3)">peso atual</div>`}
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
        ${statCard("🏋️",totalWorkouts,"EXERCÍCIOS",  "var(--orange)")}
        ${statCard("📅",trainDaysLogged,"DIAS REG.","#4B9EFF")}
        ${statCard("🔥",calPts.length?Math.round(calPts.reduce((a,p)=>a+p.y,0)/calPts.length):"—","MÉDIA KCAL","#22D3A5")}
      </div>

      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px">
        <div style="font-weight:700;font-size:13px;margin-bottom:12px;color:var(--text);letter-spacing:0.3px">📆 Atividade da semana</div>
        <div style="display:flex;justify-content:space-between;gap:6px">
          ${week.map(w=>`<div style="flex:1;text-align:center"><div style="width:100%;aspect-ratio:1;max-width:38px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;${w.active?"background:var(--orange);color:#fff":"background:var(--bg3);color:var(--text3);border:1.5px solid var(--border)"}">${w.active?"✓":w.init}</div></div>`).join("")}

// Meal categories with icons and colors
const MEAL_CATS=[
  {id:"cafe",label:"☕ Café da Manhã",color:"#FFB347"},
  {id:"almoco",label:"🍽️ Almoço",color:"#4B9EFF"},
  {id:"lanche",label:"🥪 Lanche da Tarde",color:"#22D3A5"},
  {id:"jantar",label:"🌙 Jantar",color:"#A78BFA"},
  {id:"ceia",label:"🌛 Ceia",color:"#818CF8"},
];

function calcAdj(f){
  const grams=f.grams||f.serving||100;
  const base=f.serving||100;
  const ratio=grams/base;
  return {
    grams,
    cal:Math.round((f.cal||0)*ratio),
    p:+(((f.p||0)*ratio).toFixed(1)),
    c:+(((f.c||0)*ratio).toFixed(1)),
    f:+(((f.f||0)*ratio).toFixed(1)),
  };
}

function updateCalTotals(d){
  let totalCal=0,totalP=0,totalC=0,totalF=0;
  S.foods.forEach(f=>{const a=calcAdj(f);totalCal+=a.cal;totalP+=a.p;totalC+=a.c;totalF+=a.f;});
  const cal=S.targetCal||0;
  const pct=cal>0?Math.min((totalCal/cal)*100,100):0;
  const circ=2*Math.PI*64;
  const mp=Math.round(cal*0.3/4),mc=Math.round(cal*0.45/4),mf=Math.round(cal*0.25/9);
  const ringEl=d.querySelector("#calRingCircle");
  const numEl=d.querySelector("#calTotalNum");
  if(ringEl)ringEl.style.strokeDashoffset=circ*(1-pct/100);
  if(numEl)numEl.textContent=Math.round(totalCal);
  const pb=d.querySelector("#pb-p");const cb=d.querySelector("#pb-c");const fb=d.querySelector("#pb-f");
  const pt=d.querySelector("#pt-p");const ct=d.querySelector("#pt-c");const ft=d.querySelector("#pt-f");
  if(pb)pb.style.width=Math.min((totalP/mp)*100,100)+"%";
  if(cb)cb.style.width=Math.min((totalC/mc)*100,100)+"%";
  if(fb)fb.style.width=Math.min((totalF/mf)*100,100)+"%";
  if(pt)pt.textContent=Math.round(totalP)+"g / "+mp+"g";
  if(ct)ct.textContent=Math.round(totalC)+"g / "+mc+"g";
  if(ft)ft.textContent=Math.round(totalF)+"g / "+mf+"g";
}

function renderFoodItem(f,i){
  const a=calcAdj(f);
  return `<div class="food-item" id="fi_${i}">
    <div class="fi-info">
      <div class="fi-name">${f.n}${f.brand?` <span style="font-size:10px;color:#666">${f.brand}</span>`:""}</div>
      <div class="fi-mac" id="fimac_${i}">P:${a.p}g · C:${a.c}g · G:${a.f}g</div>
      <div style="display:flex;align-items:center;gap:5px;margin-top:5px">
        <button class="fi-grams-btn" data-dir="-1" data-fi="${i}">−</button>
        <input type="number" class="fi-grams" data-fi="${i}" value="${a.grams}" min="1" max="5000"/>
        <button class="fi-grams-btn" data-dir="1" data-fi="${i}">+</button>
        <span style="font-size:11px;color:#888">g</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">

}

function rCalorias(){
  const d=D("tab-page");
  const cal=S.targetCal||0;
  if(!S.mealCat)S.mealCat={};// {foodIdx: mealCatId}
  const mp=Math.round(cal*0.3/4),mc2=Math.round(cal*0.45/4),mf2=Math.round(cal*0.25/9);
  let totalCal=0,totalP=0,totalC=0,totalF=0;
  S.foods.forEach(f=>{const a=calcAdj(f);totalCal+=a.cal;totalP+=a.p;totalC+=a.c;totalF+=a.f;});
  const pct=cal>0?Math.min((totalCal/cal)*100,100):0;
  const circ=2*Math.PI*64;

  // Group foods by meal category
  const grouped={};
  MEAL_CATS.forEach(mc=>grouped[mc.id]=[]);
  grouped["sem_categoria"]=[];
  S.foods.forEach((f,i)=>{
    const cat=S.mealCat[i]||"";
    if(cat&&grouped[cat])grouped[cat].push({f,i});
    else grouped["sem_categoria"].push({f,i});
  });

  if(!S.mealCatNames)S.mealCatNames={};
  const renderGroup=(catId,catLabel,catColor,items)=>{
    if(items.length===0&&catId!=="sem_categoria")return "";
    if(items.length===0&&catId==="sem_categoria")return "";
    const groupCal=items.reduce((s,{f})=>s+calcAdj(f).cal,0);
    const displayLabel=S.mealCatNames[catId]||catLabel;
    return `<div class="meal-group">
      <div class="meal-group-hdr" data-mcid="${catId}">
        <div style="display:flex;align-items:center;gap:8px">

        </div>
        <span style="font-size:13px;color:${catColor};font-weight:700">${groupCal} kcal</span>
      </div>
      ${items.map(({f,i})=>renderFoodItem(f,i)).join("")}
      <button class="meal-add-btn" data-addcat="${catId}">+ Adicionar</button>
    </div>`;
  };

  const foodsHTML=`
    <div class="meal-add-section" style="margin-bottom:16px">
      ${MEAL_CATS.map(mc=>`<button class="meal-cat-btn" data-newcat="${mc.id}" style="border-color:${mc.color}20;color:${mc.color}">${mc.label}</button>`).join("")}
    </div>
    ${MEAL_CATS.map(mc=>renderGroup(mc.id,mc.label,mc.color,grouped[mc.id])).join("")}
    ${grouped["sem_categoria"].length>0?renderGroup("sem_categoria","📦 Sem categoria","#888",grouped["sem_categoria"]):""}`;

  d.innerHTML=`
    <div class="tab-hdr"><div class="tab-title">Calorias</div><div style="display:flex;gap:8px">
      <button class="btn-sm-orange" id="bAIPhoto">📸 IA</button>
      <button class="btn-sm-orange" id="bAddFood">+ Adicionar</button>
    </div></div>
    <div class="cal-ring-wrap"><div class="cal-ring">
      <svg width="160" height="160" viewBox="0 0 160 160" style="transform:rotate(-90deg)">
        <circle cx="80" cy="80" r="64" fill="none" stroke="#222" stroke-width="14"/>
        <circle id="calRingCircle" cx="80" cy="80" r="64" fill="none" stroke="#FF6B00" stroke-width="14"
          stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}"
          stroke-linecap="round" style="transition:stroke-dashoffset 0.5s ease"/>
      </svg>
      <div class="cal-ring-inner"><div class="cal-num" id="calTotalNum">${Math.round(totalCal)}</div><div class="cal-lbl">/ ${cal} kcal</div></div>
    </div></div>
    <div class="macro-bar-wrap">
      <div class="mbar"><div class="mbar-label"><span style="color:#4B9EFF">Proteína</span><span id="pt-p">${Math.round(totalP)}g / ${mp}g</span></div><div class="mbar-track"><div class="mbar-fill" id="pb-p" style="width:${Math.min((totalP/mp)*100,100)}%;background:#4B9EFF"></div></div></div>
      <div class="mbar"><div class="mbar-label"><span style="color:#FF8C42">Carbs</span><span id="pt-c">${Math.round(totalC)}g / ${mc2}g</span></div><div class="mbar-track"><div class="mbar-fill" id="pb-c" style="width:${Math.min((totalC/mc2)*100,100)}%;background:#FF8C42"></div></div></div>
      <div class="mbar"><div class="mbar-label"><span style="color:#22D3A5">Gordura</span><span id="pt-f">${Math.round(totalF)}g / ${mf2}g</span></div><div class="mbar-track"><div class="mbar-fill" id="pb-f" style="width:${Math.min((totalF/mf2)*100,100)}%;background:#22D3A5"></div></div></div>
    </div>
    <div class="info-sec" style="margin-bottom:16px"><div class="sec-lbl">METABOLISMO</div><div class="info-grid"><div class="ic"><div class="iv" style="color:var(--orange)">${S.tmb||"—"} kcal</div><div class="il">TMB</div></div><div class="ic"><div class="iv" style="color:var(--orange)">${cal||"—"} kcal</div><div class="il">Meta diária</div></div></div><div class="goal-tag">↗ ${({lose:"Emagrecer",maintain:"Manutenção",gain:"Ganhar massa"})[S.profile?.goal]||"—"}</div></div>
    <button class="btn-primary" id="bAutoDiet" style="width:100%;margin-bottom:16px;background:linear-gradient(135deg,#FF6B00,#FF8C42)">🍽️ Gerar dieta automática com IA</button>
    <div class="sec-title">REFEIÇÕES DE HOJE</div>
    <div class="foods-list" id="foodsList">
      ${S.foods.length===0?`<div class="empty" style="padding:24px 0;text-align:center"><p style="color:#555">Nenhuma refeição registrada</p></div>`:""}
      ${foodsHTML}
    </div>`;

  // Button handlers
  d.querySelector("#bAddFood")?.addEventListener("click",()=>{S.pendingMealCat="sem_categoria";S.foodModalMode="add";S.modal="food";r();});
  d.querySelector("#bAutoDiet")?.addEventListener("click",()=>{S.modal="autoDiet";S.dietResult=null;S.dietLoading=false;r();});
  d.querySelector("#bAIPhoto")?.addEventListener("click",()=>{S.pendingMealCat="sem_categoria";S.foodModalMode="ai";S.modal="food";S.aiLoading=false;S.aiResult=null;S.aiRawResult=null;S.aiWeightStep=false;S.aiPlateWeight=0;S.aiError=null;S.aiIngChecked=null;r();});

  // Add to specific meal category
  d.querySelectorAll("[data-addcat]").forEach(b=>b.onclick=()=>{S.pendingMealCat=b.dataset.addcat;S.foodModalMode="add";S.modal="food";r();});
  d.querySelectorAll("[data-newcat]").forEach(b=>b.onclick=()=>{S.pendingMealCat=b.dataset.newcat;S.foodModalMode="add";S.modal="food";r();});
  d.querySelectorAll(".meal-rename-btn").forEach(btn=>btn.onclick=async e=>{
    e.stopPropagation();
    const catId=btn.dataset.rename;
    const current=btn.dataset.current;
    // Custom modal instead of ugly prompt()
    const ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px";
    ov.innerHTML=`<div style="background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:360px">
      <div style="font-weight:800;font-size:18px;margin-bottom:4px;color:var(--text)">Renomear refeição</div>
      <div style="font-size:13px;color:var(--text3);margin-bottom:16px">Digite o novo nome desta categoria</div>
      <input id="rcInp" value="${(current||"").replace(/"/g,"&quot;")}" style="width:100%;padding:14px;background:var(--bg3);border:1.5px solid var(--orange);border-radius:12px;color:var(--text);font-size:16px;font-weight:600;outline:none;margin-bottom:18px"/>
      <div style="display:flex;gap:10px">
        <button id="rcCancel" style="flex:1;padding:13px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-weight:700;cursor:pointer">Cancelar</button>
        <button id="rcOk" style="flex:1;padding:13px;background:var(--orange);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer">Salvar</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector("#rcInp");
    inp.focus();inp.select();
    ov.onclick=ev=>{if(ev.target===ov)ov.remove();};
    ov.querySelector("#rcCancel").onclick=()=>ov.remove();
    ov.querySelector("#rcOk").onclick=async()=>{
      const newName=inp.value;
      if(newName&&newName.trim()){
        if(!S.mealCatNames)S.mealCatNames={};
        S.mealCatNames[catId]=newName.trim();
        await saveFoods(S.foods);
        ov.remove();
        r();
      }else{ov.remove();}
    };
    inp.onkeydown=ev=>{if(ev.key==="Enter")ov.querySelector("#rcOk").click();};
  });

  // Delete food
  d.querySelectorAll(".fi-del").forEach(b=>b.onclick=async()=>{
    const i=parseInt(b.dataset.fi);
    S.foods.splice(i,1);
    // Rebuild mealCat with shifted indices
    const newMC={};
    Object.entries(S.mealCat||{}).forEach(([k,v])=>{
      const ki=parseInt(k);
      if(ki<i)newMC[ki]=v;
      else if(ki>i)newMC[ki-1]=v;
    });
    S.mealCat=newMC;
    await saveFoods(S.foods);
    r();
  });

  // Grams update — NO re-render, update inline + update totals
  const updateRow=(i)=>{
    const f=S.foods[i];if(!f)return;
    const a=calcAdj(f);
    const inp=d.querySelector(`.fi-grams[data-fi="${i}"]`);
    const calEl=d.querySelector(`#fical_${i}`);
    const macEl=d.querySelector(`#fimac_${i}`);
    if(inp)inp.value=a.grams;

    if(macEl)macEl.textContent=`P:${a.p}g · C:${a.c}g · G:${a.f}g`;
    // Update group calorie header
    const mc=S.mealCat?.[i]||"sem_categoria";

  d.querySelectorAll(".fi-grams").forEach(inp=>inp.addEventListener("input",async e=>{

  }));
  d.querySelectorAll(".fi-grams-btn").forEach(btn=>btn.addEventListener("click",async()=>{

    S.foods[i].grams=Math.max(1,cur+(dir*10));
    updateRow(i);
    await saveFoods(S.foods);
  }));
  return d;
}

 id="bReports" style="cursor:pointer;background:linear-gradient(135deg,rgba(255,107,0,0.16),rgba(75,158,255,0.08));border:1.5px solid rgba(255,107,0,0.35);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px"><div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#FF6B00,#FF8C42);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:0 4px 12px rgba(255,107,0,0.3)">📊</div><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:16px;color:var(--text)">Relatórios e Evolução</div><div style="font-size:12px;color:var(--text2);margin-top:2px">Gráficos de peso, calorias e cargas</div></div><div class="chev" style="font-size:22px;color:var(--orange)">›</div></div><div class="info-sec"><div class="sec-lbl">CONFIGURAÇÕES</div><div class="kv" id="bEditUsername" style="cursor:pointer"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:18px">🏷️</span><span class="kk">Nome de usuário</span></div><div style="display:flex;align-items:center;gap:6px"><span class="kv2">@${username}</span><span class="chev">›</span></div></div><div class="kv" style="cursor:pointer"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:18px">🌙</span><span class="kk">Tema escuro</span></div><div id="bDarkToggle" class="toggle-sw ${S.darkMode===false?'':'on'}" style="width:46px;height:26px;background:${S.darkMode===false?'#666':'var(--orange)'};border-radius:13px;padding:2px;cursor:pointer;transition:background 0.3s;flex-shrink:0"><div style="width:22px;height:22px;background:#fff;border-radius:50%;transition:transform 0.3s;transform:translateX(${S.darkMode===false?'0':'20px'})"></div></div></div>

  <input type="file" id="avatarInput" accept="image/*" style="display:none"/>`;
  d.querySelector("#bSO")?.addEventListener("click",()=>{if(confirm("Sair?"))signOut(auth).then(()=>{S={...S,user:null,profile:null,phase:"login",foods:[],workouts:[],schedule:{},communityFoods:[],mealCat:{},mealCatNames:{},session:null,modal:null,mCtx:null,tmb:null,targetCal:null,aiResult:null,aiRawResult:null,aiImg:null,aiError:null,aiWeightStep:false,aiPlateWeight:0,pendingMealCat:null};r();});});

  d.querySelector("#bEditUsername")?.addEventListener("click",()=>{

      <div style="font-weight:800;font-size:18px;margin-bottom:4px;color:var(--text)">Nome de usuário</div>

      <div style="display:flex;gap:10px">
        <button id="unCancel" style="flex:1;padding:13px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-weight:700;cursor:pointer">Cancelar</button>
        <button id="unOk" style="flex:1;padding:13px;background:var(--orange);border:none;border-radius:12px;color:#fff;font-weight:700;cursor:pointer">Salvar</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector("#unInp");inp.focus();inp.select();
    ov.onclick=e=>{if(e.target===ov)ov.remove();};
    ov.querySelector("#unCancel").onclick=()=>ov.remove();
    ov.querySelector("#unOk").onclick=async()=>{
      const v=inp.value.trim();
      if(!v){ov.remove();return;}
      S.profile.username=v;
      try{await saveProfile(S.profile);}catch(e){}
      ov.remove();r();
    };
    inp.onkeydown=e=>{if(e.key==="Enter")ov.querySelector("#unOk").click();};

  // Edit avatar (photo) — stored as base64 in profile
  const avInput=d.querySelector("#avatarInput");
  d.querySelector("#bEditAvatar")?.addEventListener("click",()=>avInput?.click());
  if(avInput)avInput.onchange=async e=>{
    const file=e.target.files?.[0];if(!file)return;
    if(file.size>2*1024*1024){alert("Imagem muito grande. Escolha uma foto menor que 2MB.");return;}
    try{
      // Resize to keep storage small
      const dataUrl=await new Promise((res,rej)=>{
        const reader=new FileReader();
        reader.onload=()=>{
          const img=new Image();
          img.onload=()=>{
            const size=256;const canvas=document.createElement("canvas");canvas.width=size;canvas.height=size;
            const ctx=canvas.getContext("2d");
            const min=Math.min(img.width,img.height);
            ctx.drawImage(img,(img.width-min)/2,(img.height-min)/2,min,min,0,0,size,size);
            res(canvas.toDataURL("image/jpeg",0.8));
          };
          img.onerror=rej;img.src=reader.result;
        };
        reader.onerror=rej;reader.readAsDataURL(file);
      });
      S.profile.avatar=dataUrl;
      await saveProfile(S.profile);
      r();

    }

    if(S.profile){S.profile.darkMode=S.darkMode;try{await saveProfile(S.profile);}catch(e){}}
  });
  d.querySelector("#bReports")?.addEventListener("click",()=>{S.modal="reports";r();});
  d.querySelector("#bNotif")?.addEventListener("click",async()=>{if(!("Notification"in window))return alert("Navegador não suporta notificações.");const p=await Notification.requestPermission();if(p==="granted")new Notification("BoltFit ⚡",{body:"Notificações ativadas!"});else alert("Notificações bloqueadas nas configurações do navegador.");});
  return d;
}

// MODALS — rendered in #modalRoot (full screen, no 430px limit)

function closeModal(){
  const sheet=document.querySelector(".modal-sheet");
  const overlay=document.querySelector(".overlay");
  if(sheet&&overlay){sheet.classList.add("closing");overlay.classList.add("closing");setTimeout(()=>{S.modal=null;S.mCtx=null;r();},280);}
  else{S.modal=null;S.mCtx=null;r();}
}

function sheet(title,subtitle,html,onClose){
  const d=D("overlay");
  d.innerHTML=`<div class="modal-sheet"><div class="modal-handle"></div><div class="modal-hdr"><div><div class="modal-title">${title}</div>${subtitle?`<div class="modal-sub">${subtitle}</div>`:""}</div><button class="close-x" id="bCloseModal">✕</button></div>${html}</div>`;
  d.querySelector("#bCloseModal").onclick=()=>{if(onClose)onClose();else closeModal();};
  d.onclick=e=>{if(e.target===d){if(onClose)onClose();else closeModal();}};
  return d;
}

function rModal(){
  if(S.modal==="food")return rFoodModal();
  if(S.modal==="addFoodManual")return rAddFoodManualModal();
  if(S.modal==="newWorkout")return rNewWorkoutModal();
  if(S.modal==="addExercises")return rAddExercisesModal();
  if(S.modal==="assignWorkout")return rAssignModal();
  if(S.modal==="exDetail")return rExDetailModal();
  if(S.modal==="pickSessionExercises")return rPickSessionModal();
  if(S.modal==="treinos")return rTreinosModal();
  if(S.modal==="aiWorkout")return rAIWorkoutModal();
  if(S.modal==="coach")return rCoachModal();
  if(S.modal==="autoDiet")return rAutoDietModal();
  if(S.modal==="reports")return rReportsModal();
  return D("div");
}

    const community=S.communityFoods||[];

  };
  const updateList=(container,q2,cat2)=>{

            ${f.brand?`<span style="font-size:10px;color:#888">${f.brand}</span>`:""}
          </div>
          <div class="fn">${f.n}</div>

          <div style="font-size:10px;color:#555;margin-top:2px;display:flex;align-items:center;gap:4px">
            ${f.official?`<span style="color:#22D3A5;font-weight:700">✅ Oficial</span>`:`<span>👤 ${f.addedBy||"Usuário"}</span>`}
            ${(!f.official&&f.addedAt)?`<span>· ${(()=>{const p=String(f.addedAt).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:f.addedAt;})()}</span>`:""}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
          <div class="fcal">${f.cal} kcal</div>

          ${isOwn?`<button class="fi-del" data-del-community="${f.id||f.n}" style="font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(255,80,80,0.12);color:#FF6B6B;border:1px solid rgba(255,80,80,0.2);cursor:pointer">Excluir</button>`:""}
        </div>
      </div>`;
    }).join("");
    container.querySelectorAll("[data-fn]").forEach(row=>row.onclick=async(e)=>{
      if(e.target.closest("[data-del-community]"))return;
      if(e.target.closest("[data-del-community]"))return;
      const fname=row.dataset.fn;
      const all2=getAllFoods();const f=all2.find(x=>x.n===fname);
      if(!f)return;
      // Show quantity picker
      const overlay=document.createElement("div");
      overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px";

    return `<div style="display:flex;align-items:center;gap:12px"><div style="font-size:32px">📸</div><div style="flex:1"><div style="font-weight:700;font-size:15px">Analisar com IA</div><div style="font-size:12px;color:#888;margin-top:2px">Tire uma foto e a IA estima as calorias</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><label style="padding:12px;background:var(--orange);border-radius:var(--radius);text-align:center;font-weight:700;font-size:14px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px">📷 Câmera<input type="file" accept="image/*" capture="environment" id="bCamInput" style="display:none"/></label><label style="padding:12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--radius);text-align:center;font-weight:700;font-size:14px;cursor:pointer;color:var(--orange);display:flex;align-items:center;justify-content:center;gap:6px">🖼️ Galeria<input type="file" accept="image/*" id="bGalInput" style="display:none"/></label></div>`;
  };

  const render=()=>{

    d.innerHTML=`<div class="modal-sheet">

      ${isAI?`<div class="ai-zone" id="aiZone">${buildAIHtml()}</div>`:`
      <button class="btn-sec" id="bManualAdd" style="width:100%;margin-bottom:12px;flex-shrink:0">✏️ Inserir manualmente</button>
      <div class="divider" style="flex-shrink:0"><span>ou buscar no banco de dados</span></div>

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-inp" id="fS" placeholder="Buscar alimento..." autocomplete="off"/>
      </div>
      <div class="cat-filters" style="flex-shrink:0">
        <button class="mf ${!S.foodCat?"mf-on":""}" data-fc="">Todos</button>
        ${FOOD_CATS.map(c=>`<button class="mf ${S.foodCat===c?"mf-on":""}" data-fc="${c}">${c}</button>`).join("")}
      </div>
      <div class="food-list" id="foodListEl"></div>`}
    </div>`;

    d.querySelector("#bCloseFood").onclick=()=>closeModal();
    d.onclick=e=>{if(e.target===d)closeModal();};
    d.querySelector("#bManualAdd")?.addEventListener("click",()=>{S.modal="addFoodManual";r();});
    if(isAI){bindAIButtons();bindCam();return;}
    // Populate list immediately with all foods including community
    const initListEl=d.querySelector("#foodListEl");
    if(initListEl)updateList(initListEl,(S.foodSearch||"").toLowerCase(),S.foodCat);
    // AI buttons handled by bindAIButtons() — call after initial render in case a result is shown
    bindAIButtons();

    // Search — only update list, no full re-render
    const fS=d.querySelector("#fS");
    if(fS){
      fS.value=S.foodSearch||"";
      fS.addEventListener("input",e=>{
        S.foodSearch=e.target.value;
        const listEl=d.querySelector("#foodListEl");
        if(listEl)updateList(listEl,(S.foodSearch||"").toLowerCase(),S.foodCat);
      });
    }

    // Category filters — update list without re-render
    const catFilterColors={"Proteínas":"#4B9EFF","Carboidratos":"#FF8C42","Frutas":"#4ADE80","Laticínios":"#A78BFA","Gorduras":"#FFD700","Lanches":"#F472B6","Bebidas":"#00D4FF","Vegetais":"#22D3A5","Refeições":"#FF6B6B","Suplementos":"#818CF8","Outros":"#888"};
    const applyFilterColors=()=>{
      d.querySelectorAll("[data-fc]").forEach(x=>{
        const cat=x.dataset.fc;
        const cc=cat?catFilterColors[cat]||null:null;
        const isActive=x.dataset.fc===S.foodCat;
        x.classList.toggle("mf-on",isActive);
        if(cc){x.style.color=cc;x.style.borderColor=isActive?cc:cc+"50";x.style.background=isActive?cc+"20":"transparent";}
        else{x.style.color="";x.style.borderColor="";x.style.background=isActive?"rgba(255,107,0,0.12)":"transparent";}
      });

    applyFilterColors();
    d.querySelectorAll("[data-fc]").forEach(b=>b.onclick=()=>{
      S.foodCat=b.dataset.fc;

      const listEl=d.querySelector("#foodListEl");

    // Food row clicks are bound inside updateList() (with quantity picker + community foods)

    bindCam();
  };

  const bindCam=()=>{
    const camInput=d.querySelector("#bCamInput");
    if(!camInput)return;
    const galInput=d.querySelector("#bGalInput");
    if(galInput){galInput.onchange=camInput.onchange=processFile;}
    async function processFile(e){
      const file=e.target.files?.[0];if(!file)return;
      if(usesLeft("aiFood")<=0){
        showPremiumGate("Você atingiu o limite de "+PLAN_LIMITS.free.aiFoodPerDay+" análises de comida por dia do plano grátis.");
        return;
      }
      consumeUse("aiFood");
      S.aiLoading=true;S.aiError=null;S.aiResult=null;S.aiRawResult=null;S.aiWeightStep=false;S.aiPlateWeight=0;
      const az=d.querySelector("#aiZone");if(az)az.innerHTML=buildAIHtml();
      try{
        const base64=await new Promise((res,rej)=>{const reader=new FileReader();reader.onload=()=>res(reader.result.split(",")[1]);reader.onerror=rej;reader.readAsDataURL(file);});
        const mimeType=file.type||"image/jpeg";
        S.aiImg=`data:${mimeType};base64,${base64}`;
        const prompt2='Voce e um nutricionista especialista em analise de alimentos por imagem. Examine a foto com muita atencao e identifique TODOS os alimentos visiveis. Se a imagem NAO contiver alimento, responda isFood=false. Caso contrario, isFood=true. Liste cada alimento no campo ingredients. IMPORTANTE: os valores nutricionais devem ser para uma PORCAO TIPICA de uma refeicao individual (entre 150g e 500g no total). Cal deve ser em kcal reais (um prato de comida tipico tem entre 300 e 900 kcal, NUNCA mais de 2000 kcal por prato individual). p, c, f tambem em gramas reais por porcao. serving = peso estimado do prato em gramas. Exemplos de referencia: arroz+feijao+frango+salada = ~600kcal/350g; lanche natural = ~400kcal/200g; pizza 2 fatias = ~500kcal/200g. Responda em portugues.';
        const resp=await fetch("https://boltfit-ia.vitortorresdarosa.workers.dev",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            contents:[{parts:[
              {text:prompt2},
              {inline_data:{mime_type:mimeType,data:base64}}
            ]}],
            generationConfig:{
              temperature:0.2,
              maxOutputTokens:2048,
              thinkingConfig:{thinkingBudget:0},
              responseMimeType:"application/json",
              responseSchema:{
                type:"OBJECT",
                properties:{
                  isFood:{type:"BOOLEAN"},
                  reason:{type:"STRING"},
                  n:{type:"STRING"},
                  desc:{type:"STRING"},
                  ingredients:{type:"ARRAY",items:{type:"STRING"}},
                  cal:{type:"NUMBER"},
                  p:{type:"NUMBER"},
                  c:{type:"NUMBER"},
                  f:{type:"NUMBER"},
                  serving:{type:"NUMBER"}
                },
                required:["isFood"]
              }
            }
          })
        });
        if(!resp.ok){
          let errTxt="";try{errTxt=await resp.text();}catch(e){}
          if(resp.status===429)throw new Error("Limite de uso da IA atingido. Aguarde 1 minuto e tente de novo.");
          throw new Error("Falha na IA ("+resp.status+"). Tente novamente.");
        }
        const data=await resp.json();
        const cand=data?.candidates?.[0];
        let txt=cand?.content?.parts?.map(p=>p.text||"").join("")||"";
        txt=txt.replace(/```json|```/g,"").trim();
        let result=null;
        try{
          result=JSON.parse(txt);
        }catch(e1){
          // tenta extrair o maior bloco JSON balanceado
          const start=txt.indexOf("{");
          if(start>=0){
            let depth=0,end=-1;
            for(let i=start;i<txt.length;i++){
              if(txt[i]==="{")depth++;
              else if(txt[i]==="}"){depth--;if(depth===0){end=i;break;}}
            }
            if(end>start){try{result=JSON.parse(txt.slice(start,end+1));}catch(e2){}}
          }
        }
        if(!result){
          throw new Error("A IA respondeu de forma incompleta. Tire a foto novamente com boa iluminacao.");
        }
        if(!result.isFood){
          S.aiError=result.reason||"Isso nao parece ser comida. Tire uma foto de uma refeicao.";
          S.aiImg=null;
        }else{
          // Sanity check: cap unrealistic values (IA às vezes retorna por 100g mas multiplica errado)
          let rawCal=Number(result.cal)||0;
          let rawP=Number(result.p)||0;
          let rawC=Number(result.c)||0;
          let rawF=Number(result.f)||0;
          // Se calorias parecem ser por 100g (muito altas p/ uma porção), dividir pelo serving estimado
          const rawServing=Number(result.serving)||300;
          if(rawCal>2500&&rawServing>0){
            // Provavelmente é por 100g — ajustar para o serving real
            const factor=rawServing/100;
            rawCal=Math.round(rawCal/100*rawServing);
            rawP=+(rawP/100*rawServing).toFixed(1);
            rawC=+(rawC/100*rawServing).toFixed(1);
            rawF=+(rawF/100*rawServing).toFixed(1);
          }
          // Hard cap para valores absurdos
          rawCal=Math.min(rawCal,3000);
          rawP=Math.min(rawP,300);
          rawC=Math.min(rawC,400);
          rawF=Math.min(rawF,200);
          S.aiRawResult={
            n:result.n||"Refeicao",desc:result.desc||"",
            ingredients:Array.isArray(result.ingredients)?result.ingredients:[],
            cal:rawCal,p:rawP,c:rawC,f:rawF,
            serving:rawServing
          };
          S.aiWeightStep=true;
          S.aiIngChecked=S.aiRawResult.ingredients.map(()=>true);
          S.aiPlateWeight=0;
        }
      }catch(err){
        S.aiError=(err&&err.message)?err.message:"Erro ao analisar imagem. Tente novamente.";
        S.aiImg=null;
      }
      S.aiLoading=false;
      const az2=d.querySelector("#aiZone");
      if(az2){az2.innerHTML=buildAIHtml();bindAIButtons();}
    };
  };

  const bindAIButtons=()=>{
    // Helper to redraw the AI zone and rebind
    const redrawAI=()=>{const az=d.querySelector("#aiZone");if(az){az.innerHTML=buildAIHtml();bindAIButtons();bindCam();}};
    // Ingredient confirm/uncheck
    d.querySelectorAll(".ai-ing-row").forEach(row=>row.onclick=e=>{
      if(e.target.closest("[data-del-ing]"))return;
      const i=parseInt(row.dataset.ing);
      if(!S.aiIngChecked)return;
      S.aiIngChecked[i]=!S.aiIngChecked[i];
      redrawAI();
    });
    // Delete ingredient
    d.querySelectorAll("[data-del-ing]").forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const i=parseInt(b.dataset.delIng);
      S.aiRawResult.ingredients.splice(i,1);
      if(S.aiIngChecked)S.aiIngChecked.splice(i,1);
      redrawAI();
    });
    // Add missing ingredient
    const addIng=()=>{
      const inp=d.querySelector("#aiNewIng");if(!inp)return;
      const v=inp.value.trim();if(!v)return;
      if(!S.aiRawResult.ingredients)S.aiRawResult.ingredients=[];
      S.aiRawResult.ingredients.push(v);
      if(!S.aiIngChecked)S.aiIngChecked=[];
      S.aiIngChecked.push(true);
      redrawAI();
    };
    d.querySelector("#aiAddIng")?.addEventListener("click",addIng);
    d.querySelector("#aiNewIng")?.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addIng();}});
    // Weight step controls
    const aiWm=d.querySelector("#aiWm");
    const aiWp=d.querySelector("#aiWp");
    const aiWinp=d.querySelector("#aiWinp");
    if(aiWm)aiWm.onclick=()=>{S.aiPlateWeight=Math.max(0,(S.aiPlateWeight||0)-10);if(aiWinp)aiWinp.value=S.aiPlateWeight;};
    if(aiWp)aiWp.onclick=()=>{S.aiPlateWeight=(S.aiPlateWeight||0)+10;if(aiWinp)aiWinp.value=S.aiPlateWeight;};
    if(aiWinp)aiWinp.oninput=e=>{S.aiPlateWeight=parseFloat(e.target.value)||0;};
    d.querySelector("#bSkipWeight")?.addEventListener("click",()=>{calcAndShowResult(0);});
    d.querySelector("#bConfirmWeight")?.addEventListener("click",()=>{calcAndShowResult(S.aiPlateWeight||0);});
    d.querySelector("#bAddAI")?.addEventListener("click",async()=>{
      if(S.aiResult){
        const ni=S.foods.length;
        S.foods.push({...S.aiResult,grams:S.aiResult.serving||100});
        if(!S.mealCat)S.mealCat={};
        S.mealCat[ni]=S.pendingMealCat||"sem_categoria";
        await saveFoods(S.foods);
        S.aiResult=null;S.aiImg=null;S.aiRawResult=null;S.aiWeightStep=false;S.aiPlateWeight=0;S.aiIngChecked=null;S.pendingMealCat=null;
        closeModal();
      }
    });
    d.querySelector("#bRetryAI")?.addEventListener("click",()=>{S.aiResult=null;S.aiImg=null;S.aiError=null;S.aiRawResult=null;S.aiWeightStep=false;S.aiPlateWeight=0;S.aiIngChecked=null;const az=d.querySelector("#aiZone");if(az){az.innerHTML=buildAIHtml();bindCam();}});
  };

  const calcAndShowResult=(plateWeight)=>{
    const r=S.aiRawResult;if(!r)return;
    let ratio=1;
    if(plateWeight>0&&r.serving>0){
      ratio=plateWeight/r.serving;
    }
    // Trava de segurança: nunca permitir ratio extremo que gere valores absurdos
    ratio=Math.max(0.1,Math.min(ratio,5));
    // Build name/desc from confirmed ingredients
    const allIngs=r.ingredients||[];
    const confirmed=S.aiIngChecked?allIngs.filter((_,i)=>S.aiIngChecked[i]):allIngs;
    const descFromIngs=confirmed.length?confirmed.join(", "):(r.desc||"");
    S.aiResult={
      n:r.n,desc:descFromIngs,
      ingredients:confirmed,
      cal:Math.min(Math.round(r.cal*ratio),5000),
      p:Math.min(+(r.p*ratio).toFixed(1),400),
      c:Math.min(+(r.c*ratio).toFixed(1),600),
      f:Math.min(+(r.f*ratio).toFixed(1),300),
      serving:plateWeight>0?plateWeight:r.serving||100,
      cat:"Refeições"
    };
    S.aiPlateWeight=plateWeight;
    S.aiWeightStep=false;
    const az=d.querySelector("#aiZone");
    if(az){az.innerHTML=buildAIHtml();bindAIButtons();}
  };

  render();
  return d;
}

// Suggestion engine for automatic load adjustment
function suggestLoad(ex){
  // Returns {weight, reps, msg} based on last performance
  const hist=(S.perf||{})[ex.id];
  const repsTarget=parseInt(String(ex.reps||"10").split("-").pop())||12; // top of range
  if(!hist||!hist.weight){
    return {weight:0,reps:String(ex.reps||"10").split("-")[0],msg:null};
  }
  const lastW=hist.weight, lastReps=hist.reps, lastDone=hist.allDone;
  let w=lastW, msg="";
  // Rule: hit/exceeded top of range with all sets done → increase
  if(lastDone&&lastReps>=repsTarget){
    const inc=lastW>=20?2.5:lastW>=10?2:1;
    w=lastW+inc;
    msg=`📈 Você fez ${lastReps} reps fácil com ${lastW}kg. Hoje: <strong>${w}kg</strong> (+${inc}).`;
  } else if(!lastDone||lastReps<Math.max(1,repsTarget-4)){
    // Failed a lot → reduce
    const dec=lastW>=20?2.5:lastW>=10?2:1;
    w=Math.max(0,lastW-dec);
    msg=`📉 Última vez ficou pesado (${lastReps} reps). Hoje: <strong>${w}kg</strong> (-${dec}).`;
  } else {
    // Stayed in range → keep, aim for more reps
    w=lastW;
    msg=`➡️ Mantenha ${lastW}kg e tente bater ${repsTarget} reps para subir a carga.`;
  }
  return {weight:w,reps:String(ex.reps||"10").split("-")[0],msg};
}

function startSession(exercises){
  if(!exercises?.length)return alert("Adicione exercícios ao treino primeiro!");
  clearInterval(restTimer);
  S.session={exercises,idx:0,sets:exercises.map(e=>{
    const sug=suggestLoad(e);
    return Array.from({length:e.sets||3},()=>({reps:sug.reps,weight:sug.weight,done:false}));
  }),suggestions:exercises.map(e=>suggestLoad(e).msg),restActive:false,restLeft:0,restTotal:0};
  r();
}
function fmtTime(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}

function rSession(){
  const{exercises,idx,sets}=S.session;
  const ex=exercises[idx];
  if(!ex){
    clearInterval(restTimer);
    // Record performance: best set (reps×weight) per exercise for next-time suggestion
    if(!S.perfSaved){
      S.perfSaved=true;
      if(!S.perf)S.perf={};
      exercises.forEach((e,i)=>{
        const exSets=sets[i]||[];
        const doneSets=exSets.filter(s=>s.done);
        if(doneSets.length===0)return;
        // pick the set with highest weight; tiebreak by reps
        let best=doneSets[0];
        doneSets.forEach(s=>{const sw=parseFloat(s.weight)||0,bw=parseFloat(best.weight)||0;if(sw>bw||(sw===bw&&(parseInt(s.reps)||0)>(parseInt(best.reps)||0)))best=s;});
        const allDone=exSets.length>0&&exSets.every(s=>s.done);
        S.perf[e.id]={weight:parseFloat(best.weight)||0,reps:parseInt(best.reps)||0,allDone,date:new Date().toISOString().split("T")[0]};
      });
      savePerf(S.perf);
    }
    const d=D("page");
    d.innerHTML=`<div class="session-done"><div style="font-size:80px">🏆</div><div class="done-title">TREINO CONCLUÍDO!</div><div class="done-sub">${exercises.length} exercícios · ${sets.flat().filter(s=>s.done).length} séries</div><button class="btn-primary" id="bEnd" style="max-width:260px;margin:0 auto">Finalizar</button></div>`;
    d.querySelector("#bEnd").onclick=()=>{S.session=null;S.perfSaved=false;r();};
    return d;
  }
  const m=MUSCLE_META[ex.group]||{color:"#FF6B00"};
  const prog=Math.round((idx/exercises.length)*100);
  const d=D("page");
  d.innerHTML=`<div class="sess-wrap"><div class="sess-hdr"><button class="back-x" id="bExit">✕</button><div style="flex:1"><div class="sess-eye">EXERCÍCIO ${idx+1}/${exercises.length}</div><div class="sess-title">${ex.name}</div></div></div><div class="sess-prog"><div class="sess-fill" style="width:${prog}%"></div></div><div class="sess-body">
    <div style="text-align:center;margin-bottom:14px">
      <div style="width:140px;height:140px;background:var(--bg3);border-radius:16px;margin:0 auto 10px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0;position:relative"><img src="${gifUrl(ex.id)}" alt="${ex.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;padding:10px">${exerciseAnimation(ex.group,(MUSCLE_META[ex.group]||{color:"#FF6B00"}).color)}</div></div>
      <div style="font-size:17px;font-weight:700">${ex.name}</div>
      <div style="font-size:13px;margin-top:4px;font-weight:600;color:${m.color}">${ex.muscles||"Músculos diversos"}</div>
    </div>
    <div class="ex3stats"><div class="es"><div class="esv">${sets[idx].length}</div><div class="esl">SÉRIES</div></div><div class="es"><div class="esv">${ex.reps||"10-12"}</div><div class="esl">REPS</div></div><div class="es"><div class="esv">${ex.rest||60}s</div><div class="esl">DESCANSO</div></div></div>
    ${S.session.suggestions&&S.session.suggestions[idx]?`<div style="background:rgba(255,107,0,0.1);border:1px solid rgba(255,107,0,0.3);border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px;color:var(--text);line-height:1.45">🤖 ${S.session.suggestions[idx]}</div>`:""}
    ${S.session.restActive?`<div class="rest-card"><div class="rest-lbl">DESCANSO</div><div class="rest-val" id="rV">${fmtTime(S.session.restLeft)}</div><div class="rest-bar"><div class="rest-fill" id="rF" style="width:${((S.session.restTotal-S.session.restLeft)/S.session.restTotal)*100}%"></div></div><button class="btn-sec" id="bSR" style="margin-top:10px;width:100%">Pular descanso</button></div>`:""}
    <div class="sets-block"><div class="sets-hdr"><span>SÉRIE</span><span>REPS</span><span>PESO (kg)</span><span></span></div>${sets[idx].map((s,si)=>`<div class="set-row"><div class="set-n">S${si+1}</div><input class="set-inp" data-si="${si}" data-f="reps" type="number" value="${s.reps}"/><input class="set-inp" data-si="${si}" data-f="weight" type="number" value="${s.weight}"/><div class="set-chk ${s.done?"chk-done":""}" data-si="${si}">${s.done?"✓":""}</div></div>`).join("")}
    <div class="set-ctrls">${sets[idx].length>1?`<button class="set-ctrl set-ctrl-del" id="bRemSet">- Remover série</button>`:`<span></span>`}<button class="set-ctrl" id="bAddSet">+ Adicionar série</button></div></div>
    <div class="sess-acts">${sets[idx].every(s=>s.done)?`<button class="btn-primary" id="bNxEx">${idx<exercises.length-1?"Próximo exercício →":"Finalizar treino 🏆"}</button>`:""}<button class="btn-sec" id="bSkipEx" style="width:100%">Pular exercício</button></div>
  </div></div>`;
  d.querySelector("#bExit").onclick=()=>{if(confirm("Sair do treino?")&&(clearInterval(restTimer)||true)){S.session=null;r();}};
  d.querySelectorAll(".set-inp").forEach(inp=>inp.oninput=e=>{S.session.sets[idx][parseInt(inp.dataset.si)][inp.dataset.f]=e.target.value;});
  d.querySelectorAll(".set-chk").forEach(btn=>btn.onclick=()=>{
    const si=parseInt(btn.dataset.si);
    S.session.sets[idx][si].done=!S.session.sets[idx][si].done;
    if(S.session.sets[idx][si].done&&!S.session.restActive){
      clearInterval(restTimer);S.session.restActive=true;S.session.restLeft=ex.rest||60;S.session.restTotal=ex.rest||60;
      restTimer=setInterval(()=>{S.session.restLeft--;const rv=document.getElementById("rV"),rf=document.getElementById("rF");if(rv)rv.textContent=fmtTime(S.session.restLeft);if(rf)rf.style.width=`${((S.session.restTotal-S.session.restLeft)/S.session.restTotal)*100}%`;if(S.session.restLeft<=0){clearInterval(restTimer);S.session.restActive=false;r();}},1000);
    }
    r();
  });
  d.querySelector("#bNxEx")?.addEventListener("click",()=>{clearInterval(restTimer);S.session.restActive=false;S.session.idx++;r();});
  d.querySelector("#bSkipEx")?.addEventListener("click",()=>{clearInterval(restTimer);S.session.restActive=false;S.session.idx++;r();});
  d.querySelector("#bSR")?.addEventListener("click",()=>{clearInterval(restTimer);S.session.restActive=false;r();});
  d.querySelector("#bAddSet")?.addEventListener("click",()=>{const last=S.session.sets[idx][S.session.sets[idx].length-1];S.session.sets[idx].push({reps:last?.reps||"10",weight:last?.weight||0,done:false});r();});
  d.querySelector("#bRemSet")?.addEventListener("click",()=>{if(S.session.sets[idx].length>1){S.session.sets[idx].pop();r();}});
  return d;
}

// THEME

function applyTheme(){
  const root=document.documentElement;
  if(S.darkMode===false){
    root.style.setProperty('--bg','#F0F0F0');
    root.style.setProperty('--bg2','#E5E5E5');
    root.style.setProperty('--bg3','#D8D8D8');
    root.style.setProperty('--bg4','#CBCBCB');
    root.style.setProperty('--text','#111111');
    root.style.setProperty('--text2','#444444');
    root.style.setProperty('--text3','#888888');
    root.style.setProperty('--border','#BBBBBB');
  }else{
    root.style.setProperty('--bg','#0D0D0D');
    root.style.setProperty('--bg2','#141414');
    root.style.setProperty('--bg3','#1C1C1C');
    root.style.setProperty('--bg4','#232323');
    root.style.setProperty('--text','#FFFFFF');
    root.style.setProperty('--text2','#AAAAAA');
    root.style.setProperty('--text3','#555555');
    root.style.setProperty('--border','#2A2A2A');
  }
}

// AUTH + BOOT
// ═══════════════════════════════════════════
async function authOk(user){
  S.user=user;
  try{
    const p=await loadProfile();
    if(p){S.profile=p;if(typeof p.darkMode!=="undefined")S.darkMode=p.darkMode;applyTheme();computeTMB();
      try{S.foods=await loadFoods();}catch(e){S.foods=[];}
      try{S.workouts=await loadWorkouts();}catch(e){S.workouts=[];}
      try{S.schedule=await loadSchedule();}catch(e){S.schedule={};}
      try{S.perf=await loadPerf();}catch(e){S.perf={};}
      try{S.usage=await loadUsage();}catch(e){S.usage={};}
      try{S.history=await loadHistory();}catch(e){S.history={};}
      // Load community foods from Firestore
      try{const cSnap=await getDocs(collection(db,"communityFoods"));S.communityFoods=cSnap.docs.map(d=>({id:d.id,...d.data()}));}catch(e){S.communityFoods=[];}
      S.phase="home";
    }else{S.phase="onboard";S.onboard={step:0,data:{sex:"",age:"",weight:"",height:"",activity:"",goal:"",trainDays:[],split:""}};}
  }catch(e){S.phase="onboard";}
  r();
}

onAuthStateChanged(auth,async user=>{
  if(user&&(S.phase==="splash"||S.phase==="login"))await authOk(user);
  else if(!user&&S.phase==="splash"){S.phase="login";r();}
});

// Show splash immediately
applyTheme();
r();
// Safety fallback
setTimeout(()=>{if(S.phase==="splash"){S.phase="login";r();}},4000);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script><style>
